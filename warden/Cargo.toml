[package]
name = "skein-warden"
version = "0.1.0"
edition = "2021"
description = "The host service that owns fleet create and destroy"
license = "MIT OR Apache-2.0"

# Deliberately not a dependency on `skein`. Architecture §14 gives the warden an empty depends-on
# column and the note "(separate binary)": it runs on the host, outside the fleet, and exists
# precisely because skein cannot be trusted to authorise its own privileged operations. A shared
# library is a shared blast radius, so the separation is a crate boundary rather than a convention.
[lib]
name = "skein_warden"
path = "src/lib.rs"

[[bin]]
name = "skein-warden"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# `kill(2)` against a process GROUP, which `std` has no way to spell: `Child::kill` signals one pid,
# and the pid it signals is a shell whose work outlives it (SKEIN-912). Not a new third-party wheel
# — libc is the platform, it is already in `Cargo.lock` under everything else here, and the
# alternative is shelling out to `kill(1)` from the one code path whose whole job is a deadline.
libc = "0.2"

# One feature per doer, all in the default set. §8.3: only the DOER is removable, and a warden that
# could not destroy could not resize either — resize is destroy + create (§7.3).
#
# `publish` and `unpublish` are doers like the other two and removable like them. Publishing opens
# a host port into the network namespace every box shares, which is why §9.4 keeps it a prompted
# act: the warden performs it only after the person types the operation id at its terminal, the
# same as every other doer, and nothing makes it pre-approvable (SKEIN-1130). A host that should
# never open a port into its fleet builds without it.
[features]
default = ["create", "destroy", "publish", "unpublish"]
create = []
destroy = []
publish = []
unpublish = []
