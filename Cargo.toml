[package]
name = "skein"
version = "0.1.0"
edition = "2021"
description = "See and steer your fleet of agent sandboxes"
license = "MIT OR Apache-2.0"

# Principle: compose, don't reinvent. Standard wheels only — serde/chrono for the core,
# axum/tokio for the server. The rich frontend (Svelte) is added when we need the diff
# viewer; the v0 web UI is a zero-build dark page served from src/web/index.html.
[lib]
name = "skein"
path = "src/lib.rs"

[[bin]]
name = "skein"
path = "src/bin/skein.rs"

[[bin]]
name = "skein-server"
path = "src/bin/skein-server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["time"] }
# reuse the wheel: wezterm's PTY layer for the embedded terminal (xterm.js handles the browser side)
portable-pty = "0.8"
# advisory file locking so registry writes share the same flock discipline as the box hooks
fs2 = "0.4"
