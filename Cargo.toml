# The warden is a workspace member rather than a module or a second `[[bin]]`, because §14 gives it
# an empty depends-on column: it must not be able to reach into skein's code by accident, and a
# crate boundary is the only thing that enforces that. CI already runs `--all`.
[workspace]
members = ["warden"]

[package]
name = "skein"
version = "0.1.0"
edition = "2021"
description = "See and steer your fleet of agent sandboxes"
license = "MIT OR Apache-2.0"
# Two binaries, so a bare `cargo run -- doctor` would otherwise refuse to pick one. The CLI is the
# one you type at; the server you start deliberately with `--bin skein-server`.
default-run = "skein"

# Principle: compose, don't reinvent. Standard wheels only — serde/chrono for the core,
# axum/tokio for the server. The rich frontend (Svelte) is added when we need the diff
# viewer; the v0 web UI is a zero-build dark page served from src/web/index.html.
# Generates the asset table from `src/web/vendor/` — see build.rs for why a directory rather than a
# constant per file.
build = "build.rs"

[lib]
name = "skein"
path = "src/lib.rs"

[[bin]]
name = "skein"
path = "src/bin/skein.rs"

[[bin]]
name = "skein-server"
path = "src/bin/skein-server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
axum = { version = "0.7", features = ["ws"] }
# our own accept loop (instead of axum::serve) so we can set TCP_NODELAY on each connection —
# without it Nagle's algorithm coalesces single-keystroke packets and the terminal echo stutters.
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    # attachment uploads stream from the socket into `sbx exec`'s stdin — async child + async writes,
    # so a multi-GB video never lands in host memory.
    "process",
    "io-util",
] }
# `sync` for BroadcastStream: it is what turns a lagged receiver into an item the stream can act
# on, rather than an error that ends it — which is how a slow client gets TOLD instead of dropped.
tokio-stream = { version = "0.1", features = ["time", "sync"] }
# reuse the wheel: wezterm's PTY layer for the embedded terminal (xterm.js handles the browser side)
portable-pty = "0.8"
# `kill(2)` against a process GROUP, which `std` cannot spell: `Child::kill` signals one pid, and
# the pid it signals is routinely a shell or a launcher whose work outlives it (SKEIN-912). Not a
# new third-party wheel — libc is the platform, and it is already in `Cargo.lock` under tokio and
# portable-pty; the alternative is shelling out to `kill(1)` from the one path whose job is a
# deadline.
libc = "0.2"

# advisory file locking so registry writes share the same flock discipline as the box hooks
fs2 = "0.4"
# load config from a local .env at startup, so the registry/repo paths don't have to be typed
# on every invocation; real env vars set on the command line still win (dotenv never overrides).
dotenvy = "0.15"
