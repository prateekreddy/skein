<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>skein</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<style>
  :root {
    --bg:#0b0d10; --panel:#14171c; --elevated:#1b1f26; --overlay:#20252e; --inset:#08090b;
    --border:#1b2026; --border-2:#2a3038; --border-3:#3d444d;
    --text:#e6edf3; --text-2:#b3bdc9; --dim:#8b949e; --faint:#5c636e;
    --accent:#7c7cf0; --accent-2:#9a9af5; --accent-bg:rgba(124,124,240,.12);
    --attn:#f85149; --waiting:#e3b341; --working:#58a6ff; --done:#3fb950; --idle:#8b949e; --stale:#484f58;
    --dur-fast:100ms; --dur:150ms; --dur-med:250ms; --ease:cubic-bezier(.2,0,0,1);
    --radius:10px;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:radial-gradient(1200px 600px at 70% -10%, #11151b 0%, var(--bg) 60%);
         color:var(--text); font-family:var(--ui); font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased; }

  #app { display:flex; height:100vh; overflow:hidden; }
  #left { flex:1 1 0; min-width:0; overflow-y:auto; }
  .wrap { max-width:920px; margin:0 auto; padding:26px 20px 64px; }
  /* docked: the fleet collapses to a narrow sidebar/tab-rail; the dock gets the rest */
  body.docked #left { flex:0 0 clamp(260px, 28%, 380px); }
  body.docked .wrap { margin:0; max-width:none; padding:16px 12px 40px; }
  body.docked header { flex-wrap:wrap; row-gap:8px; margin-bottom:14px; }
  body.docked .right { gap:8px; }
  body.docked .counts { font-size:12px; }
  body.docked footer { display:none; }
  /* compact rows in the rail: drop the path, age and chevron; tighten padding */
  body.docked .row { grid-template-columns:16px 1fr auto; gap:10px; padding:9px 11px; }
  body.docked .row .age, body.docked .row .chev { display:none; }
  body.docked .dir { display:none; }
  body.docked .ghead { padding:10px 4px 5px; }

  header { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .word { font-weight:650; letter-spacing:-.01em; font-size:18px; }
  .word b { color:var(--accent); }
  .counts { color:var(--dim); font-size:13px; display:flex; gap:10px; flex-wrap:wrap; }
  .counts .seg { display:inline-flex; align-items:center; gap:5px; }
  .counts .n { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .counts .pip { width:7px; height:7px; border-radius:50%; }
  .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .kbtn { font-family:var(--mono); font-size:11px; color:var(--dim); cursor:pointer; background:var(--panel);
          border:1px solid var(--border-2); border-radius:7px; padding:4px 9px;
          transition:color var(--dur-fast), border-color var(--dur-fast); }
  .kbtn:hover { color:var(--text); border-color:var(--border-3); }
  .live { display:flex; align-items:center; gap:7px; color:var(--dim); font-size:12px; }
  .live .pip { width:7px; height:7px; border-radius:50%; background:var(--stale); transition:background var(--dur); }
  .live.on .pip { background:var(--done); box-shadow:0 0 8px var(--done); }

  .group { margin-bottom:8px; }
  .ghead { display:flex; align-items:center; gap:8px; padding:14px 4px 7px; font-size:11px; font-weight:600;
           letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .ghead .gc { color:var(--dim); font-variant-numeric:tabular-nums; }
  .grows { display:flex; flex-direction:column; gap:6px; }

  .row { display:grid; grid-template-columns:18px 1fr auto auto 16px; align-items:center; gap:14px;
         padding:12px 16px; background:var(--panel); border:1px solid var(--border-2); border-left:2px solid transparent;
         border-radius:var(--radius); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
         transition:background var(--dur-fast), border-color var(--dur-fast); }
  .row:hover { background:var(--elevated); border-color:var(--border-3); }
  .row:hover .chev { color:var(--text); }
  .row.sel { border-left-color:var(--accent); background:var(--elevated); }
  .row.wired { border-left-color:color-mix(in srgb,var(--accent) 60%,transparent); }
  .row.active { border-left-color:var(--accent); }
  .row.s-attn { border-color:color-mix(in srgb,var(--attn) 42%,var(--border-2)); }
  .row.s-waiting { border-color:color-mix(in srgb,var(--waiting) 34%,var(--border-2)); }
  .chev { color:var(--faint); justify-self:end; transition:color var(--dur-fast); font-size:13px; }
  .row.wired .chev { color:var(--accent); }
  .row.streaming .chev { animation:pulse 1s var(--ease) infinite; }

  .dot { width:9px; height:9px; border-radius:50%; justify-self:center; }
  .s-attn .dot { background:var(--attn); box-shadow:0 0 12px var(--attn); animation:pulse 1.5s var(--ease) infinite; }
  .s-working .dot { background:var(--working); box-shadow:0 0 9px var(--working); animation:pulse 1.9s var(--ease) infinite; }
  .s-waiting .dot { background:var(--waiting); box-shadow:0 0 9px var(--waiting); }
  .s-done .dot { background:var(--done); box-shadow:0 0 7px var(--done); }
  .s-idle .dot { background:var(--idle); }
  .s-stale .dot, .s-unknown .dot { background:var(--stale); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .main { min-width:0; }
  .name { font-weight:600; letter-spacing:-.005em; }
  .s-stale .name, .s-unknown .name, .s-idle .name { color:var(--faint); font-weight:500; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; display:flex; gap:10px; min-width:0; }
  .branch { font-family:var(--mono); color:var(--accent); opacity:.9; white-space:nowrap; }
  .dir { font-family:var(--mono); color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .pill { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px;
          border-radius:999px; color:var(--dim); background:#1b2026; border:1px solid transparent; white-space:nowrap; }
  .s-attn .pill { color:var(--attn); background:color-mix(in srgb,var(--attn) 14%,transparent); border-color:color-mix(in srgb,var(--attn) 30%,transparent); }
  .s-waiting .pill { color:var(--waiting); background:color-mix(in srgb,var(--waiting) 14%,transparent); border-color:color-mix(in srgb,var(--waiting) 28%,transparent); }
  .s-working .pill { color:var(--working); background:color-mix(in srgb,var(--working) 14%,transparent); border-color:color-mix(in srgb,var(--working) 28%,transparent); }
  .s-done .pill { color:var(--done); background:color-mix(in srgb,var(--done) 14%,transparent); border-color:color-mix(in srgb,var(--done) 28%,transparent); }

  .age { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .empty { color:var(--dim); padding:52px 16px; text-align:center; border:1px dashed var(--border-2); border-radius:var(--radius); }
  .empty code { font-family:var(--mono); color:var(--text); }
  footer { margin-top:24px; color:var(--faint); font-size:12px; }
  kbd { font-family:var(--mono); font-size:11px; background:var(--panel); border:1px solid var(--border-2);
        border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--dim); }

  /* ---- terminal dock (persistent multi-session) ---- */
  #dock { display:none; flex-direction:column; background:var(--inset); border-left:1px solid var(--border-2); }
  body.docked #dock { display:flex; flex:1 1 0; min-width:0; }
  .tabs { display:flex; align-items:stretch; gap:0; border-bottom:1px solid var(--border); background:var(--panel);
          overflow-x:auto; scrollbar-width:thin; }
  .tab { display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; white-space:nowrap;
         color:var(--dim); border-right:1px solid var(--border); border-bottom:2px solid transparent;
         transition:color var(--dur-fast), background var(--dur-fast); max-width:220px; }
  .tab:hover { background:var(--elevated); color:var(--text-2); }
  .tab.on { color:var(--text); background:var(--inset); border-bottom-color:var(--accent); }
  .tab .td { width:8px; height:8px; border-radius:50%; flex:none; background:var(--stale); }
  .tab.t-attn .td { background:var(--attn); }
  .tab.t-waiting .td { background:var(--waiting); }
  .tab.t-working .td { background:var(--working); }
  .tab.t-done .td { background:var(--done); }
  .tab.streaming .td { animation:pulse 1s var(--ease) infinite; box-shadow:0 0 8px currentColor; }
  .tab .tl { overflow:hidden; text-overflow:ellipsis; font-size:13px; }
  .tab .tx { color:var(--faint); font-size:13px; padding:0 2px; border-radius:4px; }
  .tab .tx:hover { color:var(--attn); background:color-mix(in srgb,var(--attn) 14%,transparent); }
  .tab .spacer { flex:1; }
  .dock-actions { margin-left:auto; display:flex; align-items:center; padding:0 8px; gap:6px; }
  .dock-actions .da { color:var(--faint); cursor:pointer; font-size:12px; padding:4px 7px; border-radius:6px; }
  .dock-actions .da:hover { color:var(--text); background:var(--elevated); }
  .dockbar { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border);
             background:var(--panel); font-size:13px; }
  .dockbar .bdot { width:8px; height:8px; border-radius:50%; background:var(--stale); flex:none; }
  .dockbar.s-attn .bdot { background:var(--attn); } .dockbar.s-waiting .bdot { background:var(--waiting); }
  .dockbar.s-working .bdot { background:var(--working); } .dockbar.s-done .bdot { background:var(--done); }
  .dockbar .nm { font-weight:600; }
  .dockbar .br { font-family:var(--mono); color:var(--accent); font-size:12px; }
  .dockbar .dstat { font-family:var(--mono); font-size:12px; }
  .dstat .pos { color:var(--done); } .dstat .neg { color:var(--attn); }
  .seg-toggle { margin-left:auto; display:flex; border:1px solid var(--border-2); border-radius:7px; overflow:hidden; }
  .seg-toggle button { background:transparent; border:0; color:var(--dim); font:inherit; font-size:12px; padding:4px 13px;
                       cursor:pointer; transition:background var(--dur-fast), color var(--dur-fast); }
  .seg-toggle button.on { background:var(--elevated); color:var(--text); }
  .dockbar .rf { color:var(--faint); cursor:pointer; padding:4px 8px; border-radius:6px; font-size:12px; text-decoration:none; }
  .dockbar .rf:hover { color:var(--text); background:var(--elevated); }
  .dockbar .shipsep { width:1px; align-self:stretch; background:var(--border-2); margin:0 2px; }
  .dockbar .ship { font:inherit; font-size:12px; border:1px solid var(--border-2); background:var(--elevated); color:var(--text);
    border-radius:6px; padding:4px 11px; cursor:pointer; }
  .dockbar .ship:hover { border-color:var(--border-3); }
  .dockbar .prlink { color:var(--accent); }
  .dockbar .ck { font-size:11px; padding:2px 7px; border-radius:999px; }
  .dockbar .ck.ok { color:var(--done); background:color-mix(in srgb,var(--done) 14%,transparent); }
  .dockbar .ck.bad { color:var(--attn); background:color-mix(in srgb,var(--attn) 14%,transparent); }
  .dockbar .ck.pend { color:var(--waiting); background:color-mix(in srgb,var(--waiting) 14%,transparent); }
  #toast { position:fixed; right:18px; bottom:18px; z-index:80; background:var(--overlay); color:var(--text);
    border:1px solid var(--border-3); border-radius:9px; padding:10px 14px; font-size:13px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    opacity:0; transform:translateY(8px); transition:opacity var(--dur), transform var(--dur); pointer-events:none; }
  #toast.show { opacity:1; transform:none; pointer-events:auto; }
  #toast a { color:var(--accent); text-decoration:none; }

  .dockbody { position:relative; flex:1; min-height:0; }
  .termarea, .diffpane { position:absolute; inset:0; display:none; }
  .termarea.on { display:block; }
  .diffpane.on { display:block; overflow:auto; background:var(--inset); }
  .thost { position:absolute; inset:0; padding:8px 10px; display:none; }
  .thost.on { display:block; }
  .diff { font-family:var(--mono); font-size:12.5px; line-height:1.5; padding:8px 0; }
  .diff .ln { display:block; padding:0 14px; white-space:pre-wrap; word-break:break-word; }
  .diff .add  { color:#7ee787; background:color-mix(in srgb,var(--done) 10%,transparent); }
  .diff .del  { color:#ffa198; background:color-mix(in srgb,var(--attn) 10%,transparent); }
  .diff .hunk { color:var(--accent); background:var(--accent-bg); }
  .diff .meta { color:var(--dim); }
  .diff .note { color:var(--faint); padding:40px; text-align:center; }
  .diff .ln.cmtable { cursor:pointer; }
  .diff .ln.cmtable:hover { outline:1px solid color-mix(in srgb,var(--accent) 45%,transparent); outline-offset:-1px; }
  .diff .ln.cmtable:hover::after { content:"💬"; float:right; opacity:.7; padding-right:6px; }
  /* comment composer + saved comments, inserted between diff lines */
  .cmt { font-family:var(--ui); margin:4px 10px; border-left:2px solid var(--accent);
         background:var(--panel); border-radius:0 8px 8px 0; padding:8px 10px; }
  .cmt textarea { width:100%; resize:vertical; min-height:52px; background:var(--inset); color:var(--text);
                  border:1px solid var(--border-2); border-radius:6px; padding:7px 9px; font:inherit; font-size:13px; outline:none; }
  .cmt textarea:focus { border-color:var(--border-3); }
  .cmt .ca { display:flex; gap:8px; margin-top:7px; align-items:center; }
  .cmt .ca .ref { color:var(--faint); font-family:var(--mono); font-size:11px; margin-right:auto; }
  .cmt button { font:inherit; font-size:12px; border-radius:6px; padding:4px 12px; cursor:pointer; border:1px solid var(--border-2); background:var(--elevated); color:var(--text-2); }
  .cmt button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .cmt.saved { display:flex; gap:10px; align-items:flex-start; }
  .cmt.saved .body { flex:1; white-space:pre-wrap; font-size:13px; }
  .cmt.saved .ref { color:var(--faint); font-family:var(--mono); font-size:11px; }
  .cmt.saved .rm { color:var(--faint); cursor:pointer; padding:0 4px; }
  .cmt.saved .rm:hover { color:var(--attn); }
  .dockbar .send { background:var(--accent); border:1px solid var(--accent); color:#fff; font:inherit; font-size:12px;
                   border-radius:7px; padding:4px 12px; cursor:pointer; }
  .dockbar .send:hover { background:var(--accent-2); }

  /* command palette */
  #pal { position:fixed; inset:0; z-index:60; display:none; padding-top:14vh; background:rgba(5,7,10,.55); backdrop-filter:blur(3px); }
  #pal.open { display:flex; justify-content:center; align-items:flex-start; }
  .pal-card { width:100%; max-width:560px; background:var(--overlay); border:1px solid var(--border-3); border-radius:12px;
              overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.6); animation:rise var(--dur-med) var(--ease); }
  @keyframes rise { from { opacity:0; transform:translateY(-6px) scale(.985); } }
  .pal-card input { width:100%; border:0; outline:0; background:transparent; color:var(--text); font-family:var(--ui);
                    font-size:15px; padding:15px 16px; }
  .pal-list { max-height:46vh; overflow-y:auto; border-top:1px solid var(--border); padding:6px; }
  .pal-sec { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:9px 10px 5px; }
  .pal-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--text-2); }
  .pal-item .di { width:8px; height:8px; border-radius:50%; background:var(--stale); flex:none; }
  .pal-item .lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pal-item .meta { font-family:var(--mono); font-size:11px; color:var(--faint); }
  .pal-item.on { background:var(--accent-bg); color:var(--text); }
  .pal-foot { display:flex; gap:14px; padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--faint); }

  /* mailbox + new-box overlays */
  #mbx, #newbox { position:fixed; inset:0; z-index:60; display:none; padding-top:10vh; background:rgba(5,7,10,.55); backdrop-filter:blur(3px); }
  #mbx.open, #newbox.open { display:flex; justify-content:center; align-items:flex-start; }
  .mbx-card, .nb-card { width:100%; background:var(--overlay); border:1px solid var(--border-3); border-radius:12px;
    box-shadow:0 24px 70px rgba(0,0,0,.6); animation:rise var(--dur-med) var(--ease); display:flex; flex-direction:column; }
  .mbx-card { max-width:620px; max-height:78vh; }
  .nb-card { max-width:480px; padding:16px; gap:10px; }
  .mbx-head, .nb-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .nb-head { padding:0 0 4px; border:0; }
  .mbx-head .sub { color:var(--faint); font-size:12px; } .mbx-head .x, .nb-head .x { margin-left:auto; color:var(--dim); cursor:pointer; }
  .mbx-head .x:hover, .nb-head .x:hover { color:var(--text); }
  .mbx-list { flex:1; overflow-y:auto; padding:8px; min-height:120px; }
  .msg { padding:10px 12px; border-radius:9px; background:var(--panel); border:1px solid var(--border); margin-bottom:6px; }
  .msg .mh { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .msg .who { color:var(--text-2); font-weight:600; } .msg .arrow { color:var(--faint); }
  .msg .to { color:var(--accent); font-family:var(--mono); }
  .msg .kind { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); border:1px solid var(--border-2); border-radius:999px; padding:1px 7px; }
  .msg .mt { margin-left:auto; font-variant-numeric:tabular-nums; }
  .msg .mb { color:var(--text); font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .msg .seen { color:var(--faint); font-size:11px; margin-top:3px; }
  .mbx-list .note { color:var(--faint); text-align:center; padding:36px; }
  .mbx-compose { border-top:1px solid var(--border); padding:10px 12px; display:flex; flex-direction:column; gap:8px; background:var(--panel); }
  .mbx-compose .row1 { display:flex; gap:8px; } .mbx-compose .row2 { display:flex; align-items:center; gap:10px; }
  .mbx-compose .hint { color:var(--faint); font-size:11px; flex:1; }
  select, .nb-card input, .mbx-compose textarea { background:var(--inset); color:var(--text); border:1px solid var(--border-2);
    border-radius:7px; padding:7px 9px; font:inherit; font-size:13px; outline:none; }
  select:focus, .nb-card input:focus, .mbx-compose textarea:focus { border-color:var(--accent); }
  .mbx-compose textarea { resize:vertical; min-height:54px; }
  .mbx-compose select { flex:1; }
  .nb-lbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .nb-foot { display:flex; align-items:center; gap:10px; } .nb-foot .hint { flex:1; color:var(--faint); font-size:11px; }
  .nb-foot code { font-family:var(--mono); color:var(--text-2); }
  #mbx button.primary, #newbox button.primary { background:var(--accent); border:1px solid var(--accent); color:#0b0d10; font-weight:600;
    border-radius:7px; padding:7px 16px; font:inherit; font-size:13px; cursor:pointer; }
  #mbx button.primary:hover, #newbox button.primary:hover { background:var(--accent-2); }

  @media (max-width:860px) {
    #dock { position:fixed; inset:0; z-index:50; flex:none; border-left:0; }
    body.docked #left { display:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="left">
      <div class="wrap">
        <header>
          <div class="word"><b>skein</b></div>
          <div class="counts" id="counts"></div>
          <div class="right">
            <span class="kbtn" onclick="openNewBox()" title="Launch a new box (⌘N)">＋ box</span>
            <span class="kbtn" id="mbxbtn" onclick="openMailbox()" title="Cross-box mailbox &amp; broadcast">✉ mailbox</span>
            <span class="kbtn" id="alerts" title="Desktop alerts when a box needs you">🔔 alerts</span>
            <span class="kbtn" onclick="openPalette()">⌘K</span>
            <span class="live" id="live"><span class="pip"></span><span id="livetext">connecting…</span></span>
          </div>
        </header>
        <div id="fleet"></div>
        <footer><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>↵</kbd> open · <kbd>d</kbd> diff · <kbd>]</kbd> next · <kbd>⌘N</kbd> new box · <kbd>⌘K</kbd> palette · sessions stay live in the dock</footer>
      </div>
    </div>
    <div id="dock">
      <div class="tabs" id="tabs"></div>
      <div class="dockbar" id="dockbar"></div>
      <div class="dockbody">
        <div class="termarea" id="termarea"></div>
        <div class="diffpane" id="diffpane"></div>
      </div>
    </div>
  </div>

  <div id="pal" aria-hidden="true">
    <div class="pal-card">
      <input id="pal-input" placeholder="Search boxes and actions…" autocomplete="off" spellcheck="false" />
      <div class="pal-list" id="pal-list"></div>
      <div class="pal-foot"><span><kbd>↵</kbd> run</span><span><kbd>↑↓</kbd> move</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>

  <div id="mbx" aria-hidden="true">
    <div class="mbx-card">
      <div class="mbx-head"><b>Mailbox</b><span class="sub">cross-box hand-offs · the shared brain</span><span class="x" onclick="closeMailbox()">✕</span></div>
      <div class="mbx-list" id="mbx-list"></div>
      <div class="mbx-compose">
        <div class="row1">
          <select id="mbx-to"></select>
          <select id="mbx-kind">
            <option value="note">note</option>
            <option value="handoff">handoff</option>
            <option value="review-request">review-request</option>
          </select>
        </div>
        <textarea id="mbx-body" placeholder="Message to the box(es)… (⌘↵ to send)"></textarea>
        <div class="row2"><span class="hint" id="mbx-hint"></span><button class="primary" id="mbx-send">Send</button></div>
      </div>
    </div>
  </div>

  <div id="newbox" aria-hidden="true">
    <div class="nb-card">
      <div class="nb-head"><b>Launch a box</b><span class="x" onclick="closeNewBox()">✕</span></div>
      <label class="nb-lbl">branch name</label>
      <input id="nb-branch" placeholder="my-feature" autocomplete="off" spellcheck="false" />
      <div class="nb-foot"><span class="hint">runs <code id="nb-cmd">setup-sandbox.sh &lt;branch&gt;</code> → opens in the dock</span><button class="primary" id="nb-go">Launch →</button></div>
    </div>
  </div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
// ---------- model ----------
const GROUPS = [
  { key:"attn",    label:"needs you", match:s => ["needs-input","needs-decision","blocked"].includes(s) },
  { key:"waiting", label:"waiting",   match:s => s === "waiting" },
  { key:"done",    label:"done",      match:s => s === "done" },
  { key:"working", label:"working",   match:s => ["working","running","live"].includes(s) },
  { key:"idle",    label:"idle",      match:s => s === "idle" },
  { key:"stale",   label:"stale",     match:s => s === "stale" || s === "unknown" },
];
const groupOf = s => (GROUPS.find(g => g.match(s)) || GROUPS[GROUPS.length-1]).key;
const labelOf = s => ["needs-input","needs-decision","blocked"].includes(s) ? "decision" : s === "live" ? "active" : s;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
// coerce to integers — these land in innerHTML, so never interpolate raw box-reported values
const diffBadge = d => d && (d.files||d.ins||d.del)
  ? `<span class="pos">+${d.ins|0}</span> <span class="neg">−${d.del|0}</span>${d.files?` · ${d.files|0}f`:""}` : "";

let boxes = [], order = [], sel = null, prevState = {};
const stateOf = name => boxes.find(b => b.name === name)?.state || "unknown";

// ---------- fleet render (keyed reconcile) ----------
const fleet = document.getElementById("fleet");
const rowEls = new Map(), groupEls = {};
function ensureGroups() {
  for (const g of GROUPS) {
    const section = document.createElement("div"); section.className = "group"; section.style.display = "none";
    const head = document.createElement("div"); head.className = "ghead"; head.innerHTML = `${g.label} <span class="gc"></span>`;
    const rows = document.createElement("div"); rows.className = "grows";
    section.append(head, rows); fleet.append(section);
    groupEls[g.key] = { section, head: head.querySelector(".gc"), rows };
  }
}
function makeRow(name) {
  const el = document.createElement("div"); el.dataset.name = name;
  el.innerHTML = `<span class="dot"></span><div class="main"><div class="name"></div>
    <div class="sub"><span class="branch"></span><span class="dstat"></span><span class="dir"></span></div></div>
    <span class="pill"></span><span class="age"></span><span class="chev">›</span>`;
  el.addEventListener("click", () => openTerminal(name));
  el.addEventListener("mouseenter", () => select(name, true));
  return el;
}
function updateRow(el, b) {
  const g = groupOf(b.state);
  const wired = sessions.has(b.name);
  el.className = `row s-${g}` + (b.name === sel ? " sel" : "") + (wired ? " wired" : "")
    + (b.name === view.box ? " active" : "") + (wired && sessions.get(b.name).streaming ? " streaming" : "");
  el.querySelector(".name").textContent = b.name;
  el.querySelector(".branch").textContent = b.branch || "—";
  el.querySelector(".dir").textContent = b.dir || "";
  el.querySelector(".pill").textContent = labelOf(b.state);
  el.querySelector(".age").textContent = b.age;
  el.querySelector(".chev").textContent = wired ? "▣" : "›";
  el.querySelector(".dstat").innerHTML = diffBadge(b.diff);
}
function render(snapshot) {
  boxes = snapshot.slice().sort((a,b) => (a.tier ?? 9) - (b.tier ?? 9) || a.name.localeCompare(b.name));
  const counts = {};
  for (const b of boxes) (counts[groupOf(b.state)] ??= []).push(b);
  const need = (counts.attn?.length||0) + (counts.waiting?.length||0), working = counts.working?.length||0, done = counts.done?.length||0;
  document.getElementById("counts").innerHTML =
    `<span class="seg"><span class="n">${boxes.length}</span> boxes</span>`
    + (need ? `<span class="seg"><span class="pip" style="background:var(--attn)"></span><span class="n">${need}</span> need you</span>` : "")
    + (working ? `<span class="seg"><span class="pip" style="background:var(--working)"></span><span class="n">${working}</span> working</span>` : "")
    + (done ? `<span class="seg"><span class="pip" style="background:var(--done)"></span><span class="n">${done}</span> done</span>` : "");

  fleet.querySelector(".empty")?.remove();
  if (!boxes.length) {
    for (const g of GROUPS) groupEls[g.key].section.style.display = "none";
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = `the skein is empty — launch a box with <code>setup-sandbox.sh &lt;branch&gt;</code>`;
    fleet.append(e); order = [];
    renderTabs(); notify([]);   // clear stale title/favicon/tabs when the fleet drains
    return;
  }
  order = []; const seen = new Set();
  for (const g of GROUPS) {
    const list = counts[g.key] || [], ge = groupEls[g.key];
    ge.section.style.display = list.length ? "" : "none";
    ge.head.textContent = list.length || "";
    for (const b of list) {
      let el = rowEls.get(b.name); if (!el) { el = makeRow(b.name); rowEls.set(b.name, el); }
      updateRow(el, b); ge.rows.appendChild(el); order.push(b.name); seen.add(b.name);
    }
  }
  for (const [name, el] of rowEls) if (!seen.has(name)) { el.remove(); rowEls.delete(name); }
  // prune side-state for boxes that left the registry (live terminal sessions are kept on purpose)
  for (const m of [shipState, comments]) for (const k of [...m.keys()]) if (!seen.has(k)) m.delete(k);
  for (const k in prevState) if (!seen.has(k)) delete prevState[k];
  if (sel && !seen.has(sel)) sel = null;
  renderTabs();          // tab status follows registry status
  notify(boxes);
}
function refreshRow(name) { const el = rowEls.get(name), b = boxes.find(x => x.name === name); if (el && b) updateRow(el, b); }

// ---------- selection / keyboard ----------
function select(name, soft) {
  if (sel === name) return;
  if (sel) rowEls.get(sel)?.classList.remove("sel");
  sel = name; const el = rowEls.get(name);
  if (el) { el.classList.add("sel"); if (!soft) el.scrollIntoView?.({ block:"nearest" }); }
}
function move(d) { if (!order.length) return; let i = sel ? order.indexOf(sel) : -1; i = (i+d+order.length)%order.length; select(order[i]); }
function nextNeedsYou() {
  const need = boxes.filter(b => ["attn","waiting"].includes(groupOf(b.state))).map(b => b.name);
  if (!need.length) return; const i = sel ? need.indexOf(sel) : -1; select(need[(i+1)%need.length]);
}

// ---------- dock: persistent terminals + diff viewer ----------
const sessions = new Map();   // name -> { term, fit, ws, host, streaming, timer, dead }
let view = { box: null, mode: "term" };   // what the dock currently shows
const termarea = document.getElementById("termarea"), diffpane = document.getElementById("diffpane"),
      tabsEl = document.getElementById("tabs"), dockbar = document.getElementById("dockbar");

function openTerminal(name) { showBox(name, "term"); }
function openDiff(name) { showBox(name, "diff"); }
function showBox(name, mode) {
  select(name);
  view = { box: name, mode };
  if (mode === "term" && !sessions.has(name)) createSession(name);
  applyView();
  if (mode === "diff") loadDiff(name);
  loadShip(name);
}
function applyView() {
  const docked = sessions.size > 0 || !!view.box;
  document.body.classList.toggle("docked", docked);
  if (!docked) return;
  const termMode = view.mode === "term";
  termarea.classList.toggle("on", termMode);
  diffpane.classList.toggle("on", !termMode);
  for (const [n, s] of sessions) s.host.classList.toggle("on", termMode && n === view.box);
  if (termMode && sessions.has(view.box)) {
    const s = sessions.get(view.box);
    requestAnimationFrame(() => { s.fit.fit(); sendResize(view.box); s.term.focus(); });
  }
  renderDockbar(); renderTabs(); refreshRowAll();
}
function createSession(name, launchBranch) {
  const host = document.createElement("div"); host.className = "thost"; termarea.append(host);
  const term = new Terminal({ fontFamily:"ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace", fontSize:13,
    cursorBlink:true, scrollback:8000, theme:{ background:"#08090b", foreground:"#e6edf3", cursor:"#7c7cf0" } });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(host);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const qs = launchBranch ? `?launch=${encodeURIComponent(launchBranch)}` : "";
  const ws = new WebSocket(`${proto}://${location.host}/api/boxes/${encodeURIComponent(name)}/terminal${qs}`);
  ws.binaryType = "arraybuffer";
  const s = { term, fit, ws, host, streaming:false, timer:0 };
  sessions.set(name, s);
  ws.onopen = () => { if (view.box === name && view.mode === "term") sendResize(name); if (s.pending) { ws.send(s.pending); s.pending = null; } };
  ws.onmessage = e => { term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data)); markStreaming(name); };
  ws.onclose = () => { term.write("\r\n\x1b[2m[skein: session ended]\x1b[0m\r\n"); s.dead = true; renderTabs(); refreshRow(name); };
  term.onData(d => { if (ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
  term.onResize(() => { if (view.box === name && view.mode === "term") sendResize(name); });
}
function markStreaming(name) {
  const s = sessions.get(name); if (!s) return;
  s.streaming = true; renderTabFlag(name); refreshRow(name);
  clearTimeout(s.timer); s.timer = setTimeout(() => { s.streaming = false; renderTabFlag(name); refreshRow(name); }, 1100);
}
function sendResize(name) { const s = sessions.get(name); if (s && s.ws.readyState === 1) s.ws.send(JSON.stringify({ resize:{ cols:s.term.cols, rows:s.term.rows } })); }
function closeSession(name) {
  const s = sessions.get(name); if (!s) return;
  clearTimeout(s.timer);   // don't let a streaming-flag timer fire on a disposed session
  try { s.ws.close(); } catch {} try { s.term.dispose(); } catch {}
  s.host.remove(); sessions.delete(name);
  if (view.box === name) { const next = sessions.keys().next().value; view = next ? { box: next, mode:"term" } : { box:null, mode:"term" }; }
  applyView(); refreshRow(name);
}
function renderDockbar() {
  if (!view.box) { dockbar.innerHTML = ""; return; }
  const b = boxes.find(x => x.name === view.box) || { name: view.box };
  const g = groupOf(b.state || "unknown");
  dockbar.className = "dockbar s-" + g;
  dockbar.innerHTML =
    `<span class="bdot"></span><span class="nm">${esc(view.box)}</span>`
    + (b.branch ? `<span class="br">${esc(b.branch)}</span>` : "")
    + `<span class="dstat">${diffBadge(b.diff)}</span>`
    + `<div class="seg-toggle">
         <button data-m="term" class="${view.mode==='term'?'on':''}">Terminal</button>
         <button data-m="diff" class="${view.mode==='diff'?'on':''}">Diff</button>
       </div>`
    + (view.mode==='diff' ? `<span class="rf" id="dref" title="refresh diff">↻</span>` : "")
    + (view.mode==='diff' && (comments.get(view.box)||[]).length
        ? `<button class="send" id="dsend" title="paste the review into the agent prompt">Send ${(comments.get(view.box)||[]).length} 💬</button>` : "")
    + shipHtml(view.box)
    + `<span class="rf" id="dclose" title="close">✕</span>`;
  dockbar.querySelector('[data-m=term]').onclick = () => openTerminal(view.box);
  dockbar.querySelector('[data-m=diff]').onclick = () => openDiff(view.box);
  const rf = dockbar.querySelector("#dref"); if (rf) rf.onclick = () => loadDiff(view.box);
  const sd = dockbar.querySelector("#dsend"); if (sd) sd.onclick = () => sendReview(view.box);
  const pr = dockbar.querySelector("#dpr"); if (pr) pr.onclick = () => createPR(view.box);
  const ar = dockbar.querySelector("#darch"); if (ar) ar.onclick = () => archiveBox(view.box);
  dockbar.querySelector("#dclose").onclick = () => { if (sessions.has(view.box)) closeSession(view.box); else { view = {box:null,mode:"term"}; applyView(); } };
}

// ---------- ship: PR · checks · archive (host-side via gh/sbx) ----------
const shipState = new Map();   // box -> ShipStatus
function shipHtml(box) {
  const s = shipState.get(box);
  let h = `<span class="shipsep"></span>`;
  if (s && s.pr_url) {
    const ck = s.checks==="passing"?`<span class="ck ok">✓ checks</span>`
             : s.checks==="failing"?`<span class="ck bad">✗ checks</span>`
             : s.checks==="pending"?`<span class="ck pend">… checks</span>` : "";
    h += `<a class="rf prlink" href="${esc(s.pr_url)}" target="_blank" title="${esc(s.pr_state||"")} — open on GitHub">PR ${esc((s.pr_state||"").toLowerCase())}</a>${ck}`;
  } else {
    h += `<button class="ship" id="dpr" title="gh pr create for this branch">Create PR</button>`;
  }
  h += `<button class="ship" id="darch" title="archive — leaves the board">Archive</button>`;
  return h;
}
function loadShip(name, force) {
  if (!force && shipState.has(name)) return;
  fetch(`/api/boxes/${encodeURIComponent(name)}/ship`).then(r => r.json()).then(s => {
    shipState.set(name, s || {}); if (view.box === name) renderDockbar();
  }).catch(() => {});
}
function createPR(name) {
  toast("opening PR…");
  fetch(`/api/boxes/${encodeURIComponent(name)}/pr`, { method:"POST" }).then(r => r.json()).then(d => {
    if (d.ok) { toast("PR ready ↗", d.url); shipState.delete(name); loadShip(name, true); }
    else toast("PR failed: " + (d.error||"").split("\n")[0]);
  }).catch(() => toast("PR failed"));
}
function archiveBox(name) {
  if (!confirm(`Archive ${name}? It leaves the board (kept in history.jsonl) and runs the archive command if you set one.`)) return;
  fetch(`/api/boxes/${encodeURIComponent(name)}/archive`, { method:"POST" }).then(r => r.json()).then(d => {
    if (d.ok) { if (sessions.has(name)) closeSession(name); shipState.delete(name);
      if (view.box === name) { view = {box:null,mode:"term"}; applyView(); } toast(`archived ${name}`); }
    else toast("archive failed: " + (d.error||""));
  }).catch(() => toast("archive failed"));
}
let toastT;
function toast(msg, url) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.append(t); }
  t.innerHTML = url ? `<a href="${esc(url)}" target="_blank">${esc(msg)}</a>` : esc(msg);
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), url ? 8000 : 3500);
}
function renderTabs() {
  tabsEl.querySelectorAll(".tab, .dock-actions").forEach(t => t.remove());
  for (const name of sessions.keys()) {
    const s = sessions.get(name), g = groupOf(stateOf(name));
    const t = document.createElement("div");
    t.className = `tab t-${g}` + (name === view.box && view.mode === "term" ? " on" : "") + (s.streaming ? " streaming" : "") + (s.dead ? " dead" : "");
    t.dataset.name = name;
    t.innerHTML = `<span class="td"></span><span class="tl">${esc(name)}</span><span class="tx" title="close">✕</span>`;
    t.addEventListener("click", e => { if (e.target.classList.contains("tx")) closeSession(name); else openTerminal(name); });
    tabsEl.append(t);
  }
  if (sessions.size) {
    const da = document.createElement("div"); da.className = "dock-actions";
    da.innerHTML = `<span class="da" title="close all sessions">close all</span>`;
    da.querySelector(".da").addEventListener("click", () => [...sessions.keys()].forEach(closeSession));
    tabsEl.append(da);
  }
}
function renderTabFlag(name) {
  const t = [...tabsEl.querySelectorAll(".tab")].find(el => el.dataset.name === name); if (!t) return;
  t.classList.toggle("streaming", !!sessions.get(name)?.streaming);
}
function refreshRowAll() { for (const name of rowEls.keys()) refreshRow(name); }

function loadDiff(name) {
  diffpane.innerHTML = `<div class="diff"><div class="note">loading…</div></div>`;
  fetch(`/api/boxes/${encodeURIComponent(name)}/diff`).then(r => r.text()).then(txt => {
    if (view.box !== name || view.mode !== "diff") return;
    diffpane.innerHTML = renderDiff(txt);
    renderComments(name);
  }).catch(() => { diffpane.innerHTML = `<div class="diff"><div class="note">could not load diff</div></div>`; });
}
function renderDiff(txt) {
  if (!txt || !txt.trim() || txt.startsWith("# no diff"))
    return `<div class="diff"><div class="note">${esc((txt||"").replace(/^#\s*/,"")) || "no changes reported yet"}</div></div>`;
  let curFile = "", newLine = 0;
  const lines = txt.split("\n").map(l => {
    let cls = "", file = "", line = "";
    if (l.startsWith("+++")) { cls = "meta"; const m = l.match(/^\+\+\+ b\/(.*)$/); if (m) curFile = m[1]; }
    else if (l.startsWith("@@")) { cls = "hunk"; const m = l.match(/\+(\d+)/); if (m) newLine = +m[1]; }
    else if (l.startsWith("---") || l.startsWith("diff ") || l.startsWith("index ")
             || l.startsWith("new file") || l.startsWith("deleted") || l.startsWith("rename") || l.startsWith("similarity")) cls = "meta";
    else if (l.startsWith("+")) { cls = "add"; file = curFile; line = newLine; newLine++; }
    else if (l.startsWith("-")) { cls = "del"; file = curFile; line = newLine; }
    else { file = curFile; line = newLine; newLine++; }   // context
    const attrs = file ? ` data-file="${esc(file)}" data-line="${line}"` : "";
    const ce = file ? " cmtable" : "";
    return `<span class="ln ${cls}${ce}"${attrs}>${esc(l) || "&nbsp;"}</span>`;
  }).join("");
  return `<div class="diff">${lines}</div>`;
}

// ---------- inline review comments → back to the agent ----------
const comments = new Map();   // box -> [{file, line, text}]
diffpane.addEventListener("click", e => {
  const ln = e.target.closest(".ln.cmtable"); if (!ln || !view.box) return;
  // don't double-open a composer on the same line
  if (ln.nextElementSibling?.classList?.contains("composer")) return;
  openComposer(ln);
});
function openComposer(ln, existing) {
  closeComposers();
  const file = ln.dataset.file, line = ln.dataset.line;
  const box = document.createElement("div"); box.className = "cmt composer";
  box.innerHTML = `<textarea placeholder="Comment for the agent on ${esc(file)}:${esc(line)}…"></textarea>
    <div class="ca"><span class="ref">${esc(file)}:${esc(line)}</span>
      <button class="cancel">Cancel</button><button class="primary save">Save</button></div>`;
  ln.after(box);
  const ta = box.querySelector("textarea"); ta.value = existing || ""; ta.focus();
  box.querySelector(".cancel").onclick = () => box.remove();
  box.querySelector(".save").onclick = () => { saveComment(view.box, file, +line, ta.value.trim()); box.remove(); renderComments(view.box); };
  ta.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); box.querySelector(".save").click(); }
    else if (ev.key === "Escape") { ev.preventDefault(); box.remove(); }
    ev.stopPropagation();
  });
}
function closeComposers() { diffpane.querySelectorAll(".cmt.composer").forEach(c => c.remove()); }
function saveComment(box, file, line, text) {
  if (!text) return;
  const arr = comments.get(box) || []; arr.push({ file, line, text }); comments.set(box, arr);
  renderDockbar();
}
function removeComment(box, idx) {
  const arr = comments.get(box) || []; arr.splice(idx, 1); comments.set(box, arr);
  renderComments(box); renderDockbar();
}
function renderComments(box) {
  diffpane.querySelectorAll(".cmt.saved").forEach(c => c.remove());
  const arr = comments.get(box) || [];
  const lns = [...diffpane.querySelectorAll(".ln[data-file]")];
  arr.forEach((c, idx) => {
    const ln = lns.find(e => e.dataset.file === c.file && +e.dataset.line === c.line);
    const block = document.createElement("div"); block.className = "cmt saved";
    block.innerHTML = `<span class="ref">${esc(c.file)}:${c.line}</span><div class="body">${esc(c.text)}</div><span class="rm" title="remove">✕</span>`;
    block.querySelector(".rm").onclick = () => removeComment(box, idx);
    if (ln) ln.after(block); else diffpane.querySelector(".diff")?.prepend(block);
  });
}
function assembleReview(box) {
  const arr = comments.get(box) || []; if (!arr.length) return "";
  const byFile = {}; arr.forEach(c => (byFile[c.file] ??= []).push(c));
  let out = "Here is my review of your current changes. Please address each point:\n";
  for (const f in byFile) { out += `\n${f}:\n`; for (const c of byFile[f]) out += `  - line ${c.line}: ${c.text}\n`; }
  return out + "\n";
}
function sendReview(box) {
  const text = assembleReview(box); if (!text) return;
  comments.set(box, []);
  openTerminal(box);   // switch to (or create) the agent's terminal
  // bracketed paste so multi-line lands as one paste (not line-by-line submits); user presses Enter to send
  const payload = new TextEncoder().encode("\x1b[200~" + text + "\x1b[201~");
  const s = sessions.get(box);
  if (s.ws.readyState === 1) s.ws.send(payload); else s.pending = payload;
  applyView();
}
window.addEventListener("resize", () => { if (view.box && view.mode === "term") { sessions.get(view.box)?.fit.fit(); sendResize(view.box); } });

// ---------- attention: title / favicon / notifications ----------
let alertsOn = false;
function setFavicon(count) {
  const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d");
  x.fillStyle = count ? "#f85149" : "#7c7cf0"; const r = 7;
  x.beginPath(); x.moveTo(2+r,2); x.arcTo(30,2,30,30,r); x.arcTo(30,30,2,30,r); x.arcTo(2,30,2,2,r); x.arcTo(2,2,30,2,r); x.fill();
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = "bold " + (count > 9 ? 15 : 19) + "px " + getComputedStyle(document.body).fontFamily;
  x.fillText(count ? String(count) : "s", 16, 17);
  let link = document.querySelector("link[rel=icon]"); if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.append(link); }
  link.href = c.toDataURL("image/png");
}
let audioCtx;
function beep() {
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sine"; o.frequency.value = 660;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.12, audioCtx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .35);
    o.start(); o.stop(audioCtx.currentTime + .36);
  } catch {}
}
function notify(snapshot) {
  const need = snapshot.filter(b => ["attn","waiting"].includes(groupOf(b.state))).length;
  document.title = need ? `(${need}) skein · ${need} need you` : "skein";
  setFavicon(need);
  for (const b of snapshot) {
    const g = groupOf(b.state), was = prevState[b.name];
    if (g !== was && alertsOn && document.hidden) {
      if (g === "attn") { pushNote(`${b.name} needs a decision`, b.name); beep(); }
      else if (g === "done") pushNote(`${b.name} finished`, b.name);
    }
    prevState[b.name] = g;
  }
}
function pushNote(body, tag) { if (Notification.permission === "granted") try { new Notification("skein", { body, tag, renotify:true }); } catch {} }
document.getElementById("alerts").addEventListener("click", async () => {
  if (!("Notification" in window)) return;
  const p = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  alertsOn = p === "granted";
  const el = document.getElementById("alerts"); el.textContent = alertsOn ? "🔔 alerts on" : "🔔 alerts"; el.style.color = alertsOn ? "var(--done)" : "";
});
window.addEventListener("focus", () => { document.title = "skein"; });

// ---------- command palette ----------
const pal = document.getElementById("pal"), palInput = document.getElementById("pal-input"), palList = document.getElementById("pal-list");
let palItems = [], palSel = 0;
function commands() {
  const acts = [
    { sec:"Actions", label:"New box…", run:openNewBox, meta:"⌘N" },
    { sec:"Actions", label:"Open mailbox", run:openMailbox },
    { sec:"Actions", label:"Broadcast to all boxes…", run:()=>{ openMailbox(); setTimeout(()=>{ document.getElementById("mbx-to").value="broadcast"; document.getElementById("mbx-body").focus(); },50); } },
    { sec:"Actions", label:"Jump to next box that needs you", run:nextNeedsYou, meta:"]" },
    { sec:"Actions", label:(alertsOn?"Disable":"Enable")+" desktop alerts", run:()=>document.getElementById("alerts").click() },
    { sec:"Actions", label:"Reconnect live stream", run:connect },
  ];
  if (sessions.size) acts.unshift({ sec:"Actions", label:"Close all terminal sessions", run:()=>[...sessions.keys()].forEach(closeSession) });
  const bx = [];
  for (const b of boxes) {
    bx.push({ sec:"Boxes", label:b.name, meta:labelOf(b.state), state:b.state, run:()=>openTerminal(b.name) });
    bx.push({ sec:"Boxes", label:`Diff: ${b.name}`, meta:diffBadge(b.diff)?`${b.diff.ins}+ ${b.diff.del}−`:"", state:b.state, run:()=>openDiff(b.name) });
  }
  return [...bx, ...acts];
}
function fuzzy(q, s) { q = q.toLowerCase(); s = s.toLowerCase(); let i = 0; for (const ch of s) if (ch === q[i]) i++; return i === q.length; }
function openPalette() { pal.classList.add("open"); palInput.value = ""; renderPal(""); palInput.focus(); }
function closePalette() { pal.classList.remove("open"); }
function renderPal(q) {
  palItems = commands().filter(c => !q || fuzzy(q, c.label)); palSel = 0;
  let html = "", lastSec = null;
  palItems.forEach((c, i) => {
    if (c.sec !== lastSec) { html += `<div class="pal-sec">${c.sec}</div>`; lastSec = c.sec; }
    const col = c.state ? (groupOf(c.state)) : null;
    const dot = `<span class="di" style="background:${col?`var(--${col==='attn'?'attn':col==='waiting'?'waiting':col==='done'?'done':col==='working'?'working':'stale'})`:'transparent'}"></span>`;
    html += `<div class="pal-item${i===0?' on':''}" data-i="${i}">${dot}<span class="lbl">${esc(c.label)}</span>${c.meta?`<span class="meta">${esc(c.meta)}</span>`:""}</div>`;
  });
  palList.innerHTML = html || `<div class="pal-sec">no matches</div>`;
  palList.querySelectorAll(".pal-item").forEach(el => {
    el.addEventListener("mousemove", () => setPalSel(+el.dataset.i));
    el.addEventListener("click", runPal);
  });
}
function setPalSel(i) { palSel = i; palList.querySelectorAll(".pal-item").forEach(el => el.classList.toggle("on", +el.dataset.i === i)); }
function runPal() { const c = palItems[palSel]; if (c) { closePalette(); c.run(); } }
palInput.addEventListener("input", () => renderPal(palInput.value.trim()));
palInput.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); setPalSel(Math.min(palSel+1, palItems.length-1)); palList.querySelector(".on")?.scrollIntoView({block:"nearest"}); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setPalSel(Math.max(palSel-1,0)); palList.querySelector(".on")?.scrollIntoView({block:"nearest"}); }
  else if (e.key === "Enter") { e.preventDefault(); runPal(); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
});

// ---------- mailbox (cross-box hand-offs + broadcast) ----------
const mbx = document.getElementById("mbx");
function openMailbox() { mbx.classList.add("open"); fillRecipients(); loadMailbox(); }
function closeMailbox() { mbx.classList.remove("open"); }
function fillRecipients() {
  const sel = document.getElementById("mbx-to"), cur = sel.value;
  sel.innerHTML = `<option value="broadcast">📢 broadcast — all boxes</option>`
    + boxes.map(b => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join("");
  if (cur) sel.value = cur;
}
function loadMailbox() {
  const list = document.getElementById("mbx-list");
  fetch("/api/mailbox").then(r => r.json()).then(msgs => {
    if (!msgs.length) { list.innerHTML = `<div class="note">no messages yet — send a hand-off or broadcast below</div>`; return; }
    list.innerHTML = msgs.map(m => `
      <div class="msg">
        <div class="mh"><span class="who">${esc(m.from||"?")}</span><span class="arrow">→</span>
          <span class="to">${m.to==="broadcast"?"📢 all":esc(m.to)}</span>
          <span class="kind">${esc(m.kind||"note")}</span>
          <span class="mt">${esc((m.ts||"").replace("T"," ").replace("Z",""))}</span></div>
        <div class="mb">${esc(m.body||"")}</div>
        ${(m.seenBy&&m.seenBy.length)?`<div class="seen">seen by ${m.seenBy.map(esc).join(", ")}</div>`:""}
      </div>`).join("");
  }).catch(() => { list.innerHTML = `<div class="note">could not load mailbox</div>`; });
}
function sendMail() {
  const to = document.getElementById("mbx-to").value, kind = document.getElementById("mbx-kind").value;
  const ta = document.getElementById("mbx-body"), body = ta.value.trim();
  const hint = document.getElementById("mbx-hint");
  if (!body) { ta.focus(); return; }
  hint.textContent = "sending…";
  fetch("/api/mailbox", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ to, body, kind }) })
    .then(r => { if (!r.ok) throw 0; ta.value = ""; hint.textContent = `sent to ${to==="broadcast"?"all boxes":to}`; loadMailbox(); setTimeout(()=>hint.textContent="",2500); })
    .catch(() => hint.textContent = "send failed");
}
document.getElementById("mbx-send").addEventListener("click", sendMail);
document.getElementById("mbx-body").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey||e.ctrlKey)) { e.preventDefault(); sendMail(); }
  e.stopPropagation();
});

// ---------- launch a new box ----------
const newbox = document.getElementById("newbox"), nbBranch = document.getElementById("nb-branch");
function openNewBox() { newbox.classList.add("open"); nbBranch.value = ""; nbBranch.focus(); }
function closeNewBox() { newbox.classList.remove("open"); }
function launchBox(branch) {
  branch = (branch||"").trim().replace(/\s+/g, "-"); if (!branch) return;
  const name = branch.startsWith("thing-") ? branch : `thing-${branch}`;
  closeNewBox();
  select(name);
  view = { box: name, mode: "term" };
  if (!sessions.has(name)) createSession(name, branch);   // launch mode
  applyView();
}
document.getElementById("nb-go").addEventListener("click", () => launchBox(nbBranch.value));
nbBranch.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); launchBox(nbBranch.value); }
  else if (e.key === "Escape") { e.preventDefault(); closeNewBox(); }
  e.stopPropagation();
});

// ---------- global keys ----------
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.classList.contains("open") ? closePalette() : openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") { e.preventDefault(); openNewBox(); return; }
  if (mbx.classList.contains("open")) { if (e.key === "Escape") closeMailbox(); return; }
  if (newbox.classList.contains("open")) return;
  if (pal.classList.contains("open")) return;
  // When focus is in a live terminal or any text field, let it own every key — including Esc, which
  // the agent (claude/vim/less/fzf) needs. This guard MUST precede the Esc handler below.
  const inTerm = view.box && view.mode === "term" && sessions.get(view.box)?.host.contains(document.activeElement);
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (inTerm || inField) return;
  // Esc returns focus to the fleet for keyboard nav — it never closes/kills a session (that was a
  // footgun: one keypress destroyed the agent session). Close explicitly via the tab ✕ / "close all".
  if (e.key === "Escape") { e.preventDefault(); document.activeElement?.blur?.(); return; }
  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); move(1); break;
    case "k": case "ArrowUp":   e.preventDefault(); move(-1); break;
    case "Enter": case "o": if (sel) { e.preventDefault(); openTerminal(sel); } break;
    case "d": if (sel) { e.preventDefault(); openDiff(sel); } break;
    case "]": e.preventDefault(); nextNeedsYou(); break;
    case "[": e.preventDefault(); cycleSession(-1); break;
    case "}": e.preventDefault(); cycleSession(1); break;
  }
});
function cycleSession(d) {
  const ks = [...sessions.keys()]; if (!ks.length) return;
  const i = view.box ? ks.indexOf(view.box) : -1; openTerminal(ks[(i+d+ks.length)%ks.length]);
}

// ---------- live stream ----------
let es = null;
function connect() {
  if (es) { try { es.close(); } catch {} }   // don't stack streams on manual reconnect
  es = new EventSource("/api/events");
  es.addEventListener("boxes", e => { try { render(JSON.parse(e.data)); } catch {} });
  es.onopen = () => { document.getElementById("live").classList.add("on"); document.getElementById("livetext").textContent = "live"; };
  es.onerror = () => { document.getElementById("live").classList.remove("on"); document.getElementById("livetext").textContent = "reconnecting…"; };
}

// ---------- boot ----------
ensureGroups(); setFavicon(0);
fetch("/api/boxes").then(r => r.json()).then(render).catch(() => {});
connect();
</script>
