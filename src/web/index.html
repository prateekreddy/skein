<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>skein</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --panel-2: #181c22; --border: #21262d;
    --text: #e6edf3; --dim: #8b949e; --faint: #6e7681; --accent: #7c7cf0;
    --waiting: #f5a623; --working: #3fb950; --done: #58a6ff; --idle: #8b949e; --stale: #484f58;
    --radius: 10px;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #11151b 0%, var(--bg) 60%);
    color: var(--text); font-family: var(--ui); font-size: 14px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; }

  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .word { font-weight: 650; letter-spacing: -0.01em; font-size: 18px; }
  .word b { color: var(--accent); }
  .counts { color: var(--dim); font-size: 13px; }
  .counts .n { color: var(--text); font-weight: 600; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; }
  .live .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--stale); }
  .live.on .pip { background: var(--working); box-shadow: 0 0 8px var(--working); }

  .fleet { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 18px 1fr auto auto 14px; align-items: center; gap: 14px;
    padding: 13px 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: background .12s, border-color .12s, transform .12s;
  }
  .row:hover { background: var(--panel-2); border-color: #2c333c; transform: translateX(2px); }
  .row:hover .chev { color: var(--text); }
  .row.waiting { border-color: color-mix(in srgb, var(--waiting) 40%, var(--border)); }
  .chev { color: var(--faint); justify-self: end; }

  .dot { width: 9px; height: 9px; border-radius: 50%; justify-self: center; }
  .s-waiting .dot { background: var(--waiting); box-shadow: 0 0 10px var(--waiting); animation: pulse 1.8s ease-in-out infinite; }
  .s-working .dot { background: var(--working); }
  .s-done    .dot { background: var(--done); }
  .s-idle    .dot { background: var(--idle); }
  .s-stale   .dot, .s-unknown .dot { background: var(--stale); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .main { min-width: 0; }
  .name { font-weight: 600; letter-spacing: -0.005em; }
  .s-stale .name, .s-unknown .name { color: var(--faint); font-weight: 500; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 2px; display: flex; gap: 10px; }
  .branch { font-family: var(--mono); color: var(--accent); opacity: .9; }
  .dir { font-family: var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .state { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
           padding: 3px 9px; border-radius: 999px; color: var(--dim); background: #1b2026; }
  .s-waiting .state { color: var(--waiting); background: color-mix(in srgb, var(--waiting) 16%, transparent); }
  .s-working .state { color: var(--working); background: color-mix(in srgb, var(--working) 16%, transparent); }
  .s-done    .state { color: var(--done);    background: color-mix(in srgb, var(--done) 16%, transparent); }

  .age { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .empty { color: var(--dim); padding: 48px 16px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty code { font-family: var(--mono); color: var(--text); }
  footer { margin-top: 26px; color: var(--faint); font-size: 12px; }
  kbd { font-family: var(--mono); font-size: 11px; background: #1b2026; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--dim); }

  /* embedded terminal overlay */
  #term { position: fixed; inset: 0; z-index: 50; display: none; padding: 3vh 3vw;
          background: rgba(5,7,10,.72); backdrop-filter: blur(4px); }
  #term.open { display: flex; }
  .term-card { margin: auto; width: 100%; max-width: 1100px; height: 100%; max-height: 86vh;
               display: flex; flex-direction: column; overflow: hidden;
               background: #0a0c10; border: 1px solid var(--border); border-radius: 12px;
               box-shadow: 0 24px 70px rgba(0,0,0,.55); }
  .term-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .term-head .name { font-weight: 600; }
  .term-head .branch { font-family: var(--mono); color: var(--accent); font-size: 12px; }
  .term-head .x { margin-left: auto; cursor: pointer; color: var(--dim); border: 1px solid var(--border);
                  border-radius: 6px; padding: 3px 10px; font-size: 12px; }
  .term-head .x:hover { color: var(--text); border-color: #2c333c; }
  #termhost { flex: 1; min-height: 0; padding: 8px 10px; background: #0a0c10; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="word"><b>skein</b></div>
      <div class="counts" id="counts">—</div>
      <div class="live" id="live"><span class="pip"></span><span id="livetext">connecting…</span></div>
    </header>
    <div class="fleet" id="fleet"></div>
    <footer>v0 · live over SSE · click a box to open its terminal · <kbd>⌘K</kbd> palette next</footer>
  </div>

  <div id="term" aria-hidden="true">
    <div class="term-card">
      <div class="term-head">
        <span class="name" id="term-name"></span>
        <span class="branch" id="term-branch"></span>
        <span class="x" id="term-x" title="close (sends nothing to the agent)">✕ close</span>
      </div>
      <div id="termhost"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
  const fleet = document.getElementById("fleet");
  const counts = document.getElementById("counts");
  const live = document.getElementById("live");
  const livetext = document.getElementById("livetext");

  const order = { waiting: 0, "needs-input": 0, blocked: 0, done: 1, working: 2, running: 2, live: 2, idle: 3, stale: 4, unknown: 5 };
  const cls = s => "s-" + (["waiting","needs-input","blocked"].includes(s) ? "waiting"
                          : s === "done" ? "done"
                          : ["working","running","live"].includes(s) ? "working"
                          : s === "idle" ? "idle" : "stale");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

  function render(boxes) {
    boxes.sort((a, b) => (order[a.state] ?? 9) - (order[b.state] ?? 9) || a.name.localeCompare(b.name));
    const waiting = boxes.filter(b => order[b.state] === 0).length;
    const done = boxes.filter(b => b.state === "done").length;
    counts.innerHTML = `<span class="n">${boxes.length}</span> boxes`
      + (waiting ? ` · <span class="n">${waiting}</span> waiting` : "")
      + (done ? ` · <span class="n">${done}</span> done` : "");

    if (!boxes.length) {
      fleet.innerHTML = `<div class="empty">the skein is empty — launch a box with <code>setup-sandbox.sh &lt;branch&gt;</code></div>`;
      return;
    }
    fleet.innerHTML = boxes.map(b => `
      <div class="row ${cls(b)} ${order[b.state] === 0 ? "waiting" : ""}" data-name="${esc(b.name)}" data-branch="${esc(b.branch || "")}">
        <span class="dot"></span>
        <div class="main">
          <div class="name">${esc(b.name)}</div>
          <div class="sub"><span class="branch">${esc(b.branch || "—")}</span><span class="dir">${esc(b.dir || "")}</span></div>
        </div>
        <span class="state">${esc(b.state)}</span>
        <span class="age">${esc(b.age)}</span>
        <span class="chev">›</span>
      </div>`).join("");
  }

  function connect() {
    const es = new EventSource("/api/events");
    es.addEventListener("boxes", e => { try { render(JSON.parse(e.data)); } catch {} });
    es.onopen = () => { live.classList.add("on"); livetext.textContent = "live"; };
    es.onerror = () => { live.classList.remove("on"); livetext.textContent = "reconnecting…"; };
  }
  fetch("/api/boxes").then(r => r.json()).then(render).catch(() => {});
  connect();

  // ---- embedded terminal ----
  let term, fit, ws;
  fleet.addEventListener("click", e => {
    const row = e.target.closest(".row");
    if (row) openTerminal(row.dataset.name, row.dataset.branch);
  });
  document.getElementById("term-x").addEventListener("click", closeTerminal);

  function openTerminal(name, branch) {
    closeTerminal();
    document.getElementById("term-name").textContent = name;
    document.getElementById("term-branch").textContent = branch || "";
    document.getElementById("term").classList.add("open");

    term = new Terminal({
      fontFamily: 'ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace',
      fontSize: 13, cursorBlink: true,
      theme: { background: "#0a0c10", foreground: "#e6edf3", cursor: "#7c7cf0" },
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("termhost"));
    fit.fit();
    term.focus();

    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/api/boxes/${encodeURIComponent(name)}/terminal`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => sendResize();
    ws.onmessage = e => {
      if (typeof e.data === "string") term.write(e.data);
      else term.write(new Uint8Array(e.data));
    };
    ws.onclose = () => term && term.write("\r\n\x1b[2m[skein: session ended]\x1b[0m\r\n");

    term.onData(d => { if (ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
    term.onResize(() => sendResize());
    window.addEventListener("resize", onWinResize);
  }

  function sendResize() {
    if (ws && ws.readyState === 1 && term) {
      ws.send(JSON.stringify({ resize: { cols: term.cols, rows: term.rows } }));
    }
  }
  function onWinResize() { if (fit) { fit.fit(); sendResize(); } }
  function closeTerminal() {
    window.removeEventListener("resize", onWinResize);
    if (ws) { try { ws.close(); } catch {} ws = null; }
    if (term) { term.dispose(); term = null; }
    document.getElementById("term").classList.remove("open");
  }
</script>
</body>
</html>
