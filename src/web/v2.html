<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skein</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
/* The identity (§11.7), and it is nearly all greys on purpose.
   Warm is the only loud thing on the page, and it means one thing: a human is needed. Cool is the
   machine working, muted green is finished, grey is nothing happening. Four, learned in one glance.
   Every other decision on this page spends no colour at all, which is what leaves the budget for
   the only question the board exists to answer. */
:root {
  --bg: #0e0f11; --panel: #16181c; --line: #24272d;
  --ink: #e6e8ec; --dim: #9aa0aa; --faint: #6b7280;
  --warm: #e0a458; --cool: #7d9cc0; --done: #7fa07f; --grey: #5b6068;
  /* Two spacing scales, one component set. Density is a class on <body>, so a row does not need to
     know how big the fleet is — the page it is on already does. */
  --row-y: 12px; --row-gap: 8px; --title: 15px;
}
body.dense { --row-y: 5px; --row-gap: 3px; --title: 13px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column;
}
header { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
h1.warm { color: var(--warm); }
h1.grey { color: var(--dim); }
.sub { color: var(--faint); margin-top: 3px; font-size: 13px; }
.old { float: right; color: var(--faint); font-size: 12px; text-decoration: none; }
.old:hover { color: var(--ink); }
main { flex: 1; overflow: auto; padding: 14px 22px 40px; }
.repo { color: var(--faint); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; margin: 18px 0 7px; }
.repo:first-child { margin-top: 2px; }
.row {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  padding: var(--row-y) 12px; margin-bottom: var(--row-gap);
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--grey);
  border-radius: 5px; color: inherit; font: inherit; cursor: pointer;
}
.row:hover { border-color: var(--faint); }
.row:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
.row.warm { border-left-color: var(--warm); }
.row.cool { border-left-color: var(--cool); }
.row.done { border-left-color: var(--done); }
.row.grey { border-left-color: var(--grey); }
.name { font-size: var(--title); font-weight: 600; }
.state { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.row.warm .state { color: var(--warm); }
.row.cool .state { color: var(--cool); }
.row.done .state { color: var(--done); }
.head { color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.age { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.fix { display: block; color: var(--faint); font-size: 12px; margin-top: 4px; }
.calm { color: var(--faint); padding: 30px 2px; }
/* The terminal is the whole of "converse" (§11): commenting back to an agent is an Act against a
   box, and the box's terminal already is one. */
#pane { display: none; position: fixed; inset: 0; background: var(--bg); flex-direction: column; }
#pane.open { display: flex; }
#panebar { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
#panebar b { font-weight: 600; }
#panebar span { color: var(--faint); font-size: 12px; }
#panebar button { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
#screen { flex: 1; min-height: 0; padding: 6px 10px; }
</style>
</head>
<body>
<header>
  <a class="old" href="/">old board</a>
  <h1 id="title">…</h1>
  <div class="sub" id="sub">asking</div>
</header>
<main id="queue"></main>

<div id="pane">
  <div id="panebar"><b id="panebox"></b><span id="panestate"></span><button id="paneclose">close · esc</button></div>
  <div id="screen"></div>
</div>

<script src="/vendor/cockpit.js"></script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
// The new board. One question — who needs me — and the three answers to it.
//
// Everything that decides anything lives in `cockpit/src` and is tested in node: `toneOf` and
// `headlineOf` (the identity), `densityFor` (adaptive spacing), `ago`/`ageNow` (the clock). What is
// here is the part that needs a document: elements, events, and a websocket.
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const queueEl = document.getElementById("queue");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");

// The rows as the server last answered, and when it answered. The second is what lets an age keep
// advancing between answers without asking again: the server sends the age at the moment of the
// observation, and this page knows how long ago that was.
let rows = [];
let standing = null;
let answeredAt = 0;

function render() {
  const head = headlineOf(standing);
  titleEl.textContent = head.title;
  titleEl.className = head.tone;
  subEl.textContent = head.sub;
  document.title = head.title === "nothing needs you" ? "skein" : `skein — ${head.title}`;
  // Adaptive density (§11.7): dense when the fleet is large, comfortable when it is small, same
  // components either way.
  document.body.classList.toggle("dense", densityFor(rows.length) === "dense");

  if (!rows.length) {
    // The calm state is a sentence, not an empty list. A dashboard that looks the same whether or
    // not anything is wrong has failed at its only job.
    queueEl.innerHTML = standing
      ? `<div class="calm">Nothing is waiting on you. Every box that is running is running on its own.</div>`
      : `<div class="calm">Asking…</div>`;
    return;
  }
  // Grouped by repo, in the order the server ranked them — the ordering is the server's one
  // comparator, and re-sorting here would be a second one that disagrees.
  const seen = [];
  for (const row of rows) if (!seen.includes(row.repo || "")) seen.push(row.repo || "");
  const since = Date.now() - answeredAt;
  queueEl.innerHTML = seen.map(repo => {
    const mine = rows.filter(r => (r.repo || "") === repo);
    const head = repo ? `<div class="repo">${esc(repo)}</div>` : `<div class="repo">no repo</div>`;
    return head + mine.map(r => `
      <button class="row ${toneOf(r.need)}" data-name="${esc(r.name)}" data-source="${esc(r.source)}" data-url="${esc(r.url)}">
        <span class="name">${esc(r.name)}</span>
        <span class="state">${esc(r.state)}</span>
        <span class="head">${esc(r.headline)}${r.fix ? `<span class="fix">${esc(r.fix)}</span>` : ""}</span>
        <span class="age">${esc(ageNow(r.waiting_secs, since))}</span>
      </button>`).join("");
  }).join("");
}

async function ask() {
  try {
    const answer = await fetch("/api/queue", { headers: { accept: "application/json" } });
    if (!answer.ok) return;
    const body = await answer.json();
    rows = body.waiting || [];
    standing = body.standing || null;
    answeredAt = Date.now();
    render();
  } catch { /* a failed ask leaves the last answer on screen, which is truer than clearing it */ }
}

// The stream is the trigger, not the data. It already exists, one producer feeds every client, and
// a tick that changed nothing sends nothing — so this asks only when something moved, and a board
// nobody is watching costs the server nothing at all.
function follow() {
  const events = new EventSource("/api/events");
  for (const name of ["snapshot", "changed", "behind"]) events.addEventListener(name, ask);
  // A stream that drops is a board that silently freezes, so fall back to asking on a timer until
  // it comes back.
  events.onerror = () => { events.close(); setTimeout(follow, 4000); };
}

// Ages advance without traffic: the row keeps the age it was observed at, and this adds the time
// since. One second is the smallest unit anything on this page renders.
setInterval(() => { if (rows.length) render(); }, 1000);

queueEl.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  // A pull request or a setup fault is somewhere else; a box is here, and its terminal is how you
  // answer it.
  if (row.dataset.source !== "box") {
    if (row.dataset.url) window.open(row.dataset.url, "_blank", "noopener");
    return;
  }
  openBox(row.dataset.name, row.querySelector(".state").textContent);
});

const pane = document.getElementById("pane");
let live = null;

function openBox(name, state) {
  closeBox();
  document.getElementById("panebox").textContent = name;
  document.getElementById("panestate").textContent = state;
  pane.classList.add("open");
  const term = new Terminal({ convertEol: false, fontSize: 13, theme: { background: "#0e0f11", foreground: "#e6e8ec" } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("screen"));
  fit.fit();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/boxes/${encodeURIComponent(name)}/terminal`);
  ws.binaryType = "arraybuffer";
  live = { term, fit, ws };
  const resize = () => {
    fit.fit();
    // `{"resize":{cols,rows}}` — the shape the server parses. Nothing in either language connects
    // these two names, which is why `cockpit.rs` asserts the join rather than trusting this comment.
    if (ws.readyState === 1) ws.send(JSON.stringify({ resize: { cols: term.cols, rows: term.rows } }));
  };
  ws.onopen = resize;
  ws.onmessage = e => term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data));
  ws.onclose = () => term.write("\r\n\x1b[2m— disconnected —\x1b[0m\r\n");
  term.onData(d => { if (ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
  window.addEventListener("resize", resize);
  term.focus();
}

function closeBox() {
  if (!live) return;
  try { live.ws.close(); } catch {}
  live.term.dispose();
  live = null;
  document.getElementById("screen").innerHTML = "";
  pane.classList.remove("open");
}

document.getElementById("paneclose").addEventListener("click", closeBox);
document.addEventListener("keydown", e => {
  // Only when a terminal is open: escape is a key the agent inside it needs, and taking it always
  // would make the pane impossible to type in.
  if (e.key === "Escape" && live && e.target === document.body) closeBox();
});

ask();
follow();
</script>
</body>
</html>
