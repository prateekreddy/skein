schemaVersion: "1"
kind: mixin
name: skein
displayName: skein workspace
description: >-
  skein's own repo-agnostic kit. Wires each --clone sandbox to the skein-managed
  shared .claude store (mailbox + skein's turn-state probe) that lives outside the
  repo, checks out the box's branch before the agent starts, and installs jq + tmux
  as the minimal probe/session substrate. Installed by skein (ensure_kit); used by
  `sbx create --clone --kit <skein-home>/kit --name <repo>-<branch> <agent> <work> <store>`.
  Skein starts and reconnects the agent through one persistent tmux session.

commands:
  initFiles:
    # The script body lives in src/kit/skein-startup.sh and ensure_kit() splices it in below, in
    # place of the marker line. It is ONE script with two callers: this kit hook (sbx runs it at
    # startup in a --clone sandbox) and the fleet path (skein runs the same bytes inside a box's
    # namespace in the shared sandbox). Inline here, the fleet path would have had to reimplement
    # a dozen provisioning steps — which is how the two shapes would have drifted apart.
    - path: /home/agent/.local/bin/skein-startup.sh
      mode: "0755"
      description: Link the skein store into the clone and check out the box branch
      content: |
        # @SKEIN_STARTUP_SCRIPT@

  startup:
    - command: ["bash", "/home/agent/.local/bin/skein-startup.sh"]
      user: "1000"
      description: Link skein store into the clone, then check out the box branch

memory: |
  ## skein workspace (clone + shared .claude)

  This sandbox is a private `--clone` of the repo (isolated code, full git); the
  `.claude` store (memory/skills/hooks/mailbox + skein's turn-state probe) is a
  shared mount linked in at startup and is LIVE across every parallel sandbox.
  Re-opening a box attaches to its persistent `skein-agent` tmux session; `skein-shell`
  is the separate persistent shell. UI reloads reattach to the live process; only a
  missing tmux process falls back to Claude's `--continue` or Codex's `resume --last`.
  Cross-provider takeover creates a single-runtime replacement box and restores an
  immutable worktree/context snapshot before its agent starts; the source remains intact.

  ## Durable shared working files

  `$HOME/shared` is the repo's project-scoped durable working-data directory and is live across
  every Claude/Codex box for this repo. Use it for reference documents, samples, and working notes
  that must outlive or cross boxes. Real `$HOME` remains private; never move credentials, agent
  runtime state, caches, repositories, build outputs, sockets, or locks into `shared`. Concurrent
  writes have normal last-writer-wins filesystem semantics, so coordinate edits to the same file.

  ## Git authentication in this box

  Before retrying a failed fetch, push, or PR, inspect the configured path:

  1. Run `git remote -v`.
  2. For an HTTPS remote, run `gh auth status`. If `gh` is authenticated but Git is not, run
     `gh auth setup-git` once, then retry `git push -u origin HEAD`.
  3. For a GitHub SSH remote, establish host trust once with
     `mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh -o StrictHostKeyChecking=accept-new -T git@github.com`.
     GitHub normally prints "successfully authenticated, but does not provide shell access" and
     exits 1; that means SSH works. Do not misdiagnose that expected exit code as missing auth.
  4. Then run `test -S "$SSH_AUTH_SOCK" && ssh-add -l`. Skein forwards the host SSH agent; the
     private key must remain on the host and must never be copied into this box. **A box scoped to
     its own repo has that socket deliberately bound over with a regular file, so this test failing
     is the expected state there rather than a fault — use HTTPS.**
  5. If HTTPS has no `gh` session, ask the user to enable "Seed gh token into sbx" in Skein
     Settings (and run `gh auth login` on the host if needed). If SSH has no identities, ask them
     to set the host SSH key path in Skein Settings or switch `origin` to HTTPS.

  State the failing command and its exact stderr when asking. Do not loop on `gh auth login`, create
  keys, rewrite the remote, or copy credentials without the user's explicit direction.

  A fetch or push that succeeds is not evidence you were granted the repository: the sandbox's own
  network path may answer with a credential skein did not place and cannot take away. Write only
  the repo you were given.
