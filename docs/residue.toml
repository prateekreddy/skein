# What this tree is allowed to name.
#
# Read by `tools/residue-check.py`. Every table here is an ALLOW-list: a host, a home directory or
# an address that is not here fails the build, and an entry here that nothing uses fails it too,
# because an allow-list nobody prunes is a permission nobody granted.
#
# This file is the register of what is permitted, so `residue-check` is the one gate that does not
# read it. Scanning it would make every entry cite itself as its own use, and no entry could ever
# be stale.
#
# What this file does NOT hold is the denylist. That register — the literal strings that may
# never come back, and the sentence saying whose each one was — was a `[banned]` table here until
# 2026-09-07, and it was the disclosure it existed to prevent: every string in it had just been
# removed from all of this repository's history and was then written back into one published
# file. So it lives outside the repository (SKEIN-630), and the tree carries
# `docs/residue-banned.txt`, sha256 of each needle and nothing readable. The gate enforces from
# those hashes and needs no register to do it, which is how the rule keeps working in CI.
#
# Regenerate with `python3 tools/residue-check.py --update`. It keeps every reason already written
# — a reason is a TOML value — and leaves TODO against anything new, which is the line to stop
# and think about. Every `#` line, this header included, is written by `render` in that tool and
# nowhere else, and the gate fails on one that `render` would not write back (SKEIN-1126): prose
# worth keeping goes into `render`, not here.

# A host this tree reaches or names. A synthetic one is still a decision: a single label with no
# dot cannot be anybody's domain but can be somebody's internal name, and the tailnet's members
# and non-members are named concretely because `*.ts.net` and the CGNAT range are the origin
# guard's whole trust boundary.
[hosts]
"100.128.0.1" = "just outside the /10, which the guard must refuse"
"100.64.0.1" = "the bottom of Tailscale's CGNAT /10, which the guard accepts"
"100.64.0.30" = "an address inside that /10, in the same test — it stands in for a real box's tailnet address that the history rewrite removed, and stays inside the /10 because the test asserts a CGNAT origin is allowed and a public one is not, so a documentation address would have inverted it"
"127.0.0.1" = "the cockpit binds loopback; the address appears in every doc that says so"
"192.168.1.10" = "an ordinary LAN address the guard must refuse"
"8.8.8.8" = "a public address the guard must refuse"
"api.github.com" = "GitHub's REST/GraphQL endpoint — the base every API call is built on"
"bitbucket.org" = "same: recognised by the URL parser so the refusal can say which host it is"
"box.my-tnet.ts.net" = "a made-up tailnet host, in the origin-guard test that must ACCEPT it"
"box.ts.net.evil.com" = "the look-alike the same test must REFUSE — it only contains ts.net"
"ci" = "a fake CI check URL in the pull-request fixtures — `https://ci/build/1`"
"cli.github.com" = "the `gh` install page, linked from the README's prerequisites"
"copilot.github.com" = "GitHub's own, and here for the same reason as gist.github.com above — measured to be intercepted by the proxy, so a scoped box must route it direct or its own credential is replaced. api.githubcopilot.com is deliberately NOT in that set: it was measured presenting a real certificate, so it is not one of the intercepted hosts"
"docs.docker.com" = "Docker's docs, cited where the sandbox's daemon configuration is explained"
"docs.github.com" = "GitHub's own docs, cited by docs/pr-workflow.md for stacked-PR behaviour"
"e.com" = "the shortest URL that still has a host, used by the link-sanitiser tests"
"elsewhere" = "the off-origin script src in the comment explaining the page's CSP"
"evil.com" = "the plain refusal case in that test"
"gist.github.com" = "GitHub's own, named here because it is one of the five hosts the sandbox's proxy terminates TLS for: it is in the NO_PROXY set that takes a scoped box off the proxy (SKEIN-548) and in the --noproxy list skein's own curl calls carry"
"git.example.com" = "a synthetic remote in the cockpit's gitgate suite"
"github.blog" = "cited once in docs/pr-workflow.md for a behaviour change GitHub announced"
"github.com" = "the code host skein reads and writes, and Cargo.lock's crate registry index"
"gitlab.com" = "not used — recognised, so a GitLab remote is parsed and then refused by name"
"gitlab.example.com" = "a synthetic GitLab remote, for the refusal path"
"host" = "the placeholder in the doc comment that shows the SSH-to-HTTPS URL rewrite"
"host.docker.internal" = "how a container reaches the sandbox host — the documented Docker name"
"nope.local" = "the host that is not on that allow-list, and refused"
"plane" = "a single-label placeholder for the tracker in two page comments"
"plane.example.com" = "the work tracker's placeholder host, used in `src/fleet/create.rs`'s tests"
"plane.example.net" = "a SECOND placeholder gateway, distinct from the one above: two tracking connections that must not read as one. RFC 2606 reserved, like every other host in this table."
"plane.host" = "a placeholder host in a tracking.rs test"
"proxy.local" = "a host set through SKEIN_ALLOWED_ORIGINS in that test, and accepted"
"raw.githubusercontent.com" = "where bootstrap.sh and the README fetch the installer from"
"sh.rustup.rs" = "the rustup installer bootstrap.sh runs when a box has no toolchain"
"status" = "a fake commit-status target URL in the same fixtures"
"www.apache.org" = "the Apache License 2.0's own header and appendix, in LICENSE-APACHE — part of the licence text, not a host anything reaches"
"www.jsdelivr.com" = "the CDN banner inside the vendored xterm bundles; not fetched at runtime"
"www.w3.org" = "an SVG namespace URI in the page's markup, not a host anything reaches"

# A home directory, which names a person and often a machine.
[homes]
"/Users/me" = "a synthetic checkout path in the tests that prove a local path is not a slug"
"/Users/y" = "a home that is a string-prefix of /Users/you and must not read as under it — the collision src/fleet/create.rs:1307 exists to refuse"
"/Users/you" = "the same placeholder on macOS, in bootstrap.sh's install instructions"
"/home/..." = "an elision inside a doc comment, not a path"
"/home/.claude" = "the `$HOME/.claude` store, written with the variable already expanded away"
"/home/.config" = "the same, for `$HOME/.config`, in a launch test"
"/home/.skein" = "the same, for `$HOME/.skein`"
"/home/.skein-warden" = "the same, for the warden's own state directory"
"/home/agent" = "the uid-1000 account every box runs as; the fleet's own fixed path"
"/home/me" = "the same, in util.rs's path-shortening tests"
"/home/somebody" = "a deliberately anonymous home in a src/repos/source.rs and a server.rs test"
"/home/x" = "the shortest home that is still a home, in volume.rs and warden_client.rs tests"
"/home/you" = "the placeholder this tree's docs and scripts use for a person's home"

# An email address.
[addresses]
"git@github.com" = "the SSH login on every GitHub remote URL — a username, not a mailbox"
"git@gitlab.com" = "the same login on the GitLab remotes the URL parser recognises"
"git@gitlab.example.com" = "the same, on a synthetic remote in a `src/fleet/hosts.rs` test"
"git@thing.git" = "not an address: a malformed SCP-style remote in a src/repos/source.rs refusal test"
"t@e.com" = "the shortest address that is still one, in a fleet-launch test"

# What a COMMIT MESSAGE or an authorship line may name, on top of everything the tables above
# allow. Not pruned when nothing matches, and not regenerated by `--update`: the set of commits
# this is checked against is the set not yet pushed, so it empties itself every time somebody
# pushes, and pruning on that would delete a decision the next commit asks for again.
[messages]
"api.githubcopilot.com" = "GitHub's own Copilot API endpoint, named in 7bf8dd6's message to record a MEASUREMENT rather than a reach: it was found presenting a real certificate, which is why it is deliberately absent from the NO_PROXY set that commit installs. Declared rather than reworded because that measurement is the reason the set has the shape it does, and a commit that cannot say why it excluded a host is a worse public record than one that names a host this code never speaks to"
"claude.ai" = "the session link in the trailer this project's assisted commits carry — a page about the commit, not a host any of this code reaches"
"noreply@anthropic.com" = "the co-author line's no-reply mailbox, which belongs to a company rather than a person and receives nothing"
"prateekreddyy@gmail.com" = "the author and committer of every commit in this repository. Declared rather than exempted in code, because the entry is what makes a commit written under any OTHER address fail this gate — which has happened here, and is the mistake worth catching while it is still unpushed"

# Credential-shaped strings that are deliberate — a documented example, a fixture. Expected to
# stay empty: a real credential is rotated, not exempted.
[exempt]
