# What this tree is allowed to name — and what it may never name again.
#
# Read by `tools/residue-check.py`. Three of these tables are ALLOW-lists: a host, a home
# directory or an address that is not here fails the build, and an entry here that nothing
# uses fails it too, because an allow-list nobody prunes is a permission nobody granted.
# `[banned]` is the opposite, and is the one place in this repository where an entry that
"example-topic-19" = "a client project; the history rewrite replaced it with gadget"
"example-org-5" = "the client organisation; replaced by acme"
"example-org-3" = "the client's repository; replaced by thing"
"example-topic-9" = "a separate private project, in eight files and one fixture filename; replaced by lattice"
"example-box-2" = "the client's contract work, in a box name"
"example-org-2" = "a private repository named in the todo list"
"mcp.tracker.example.invalid" = "the private tracker gateway; replaced by plane.example.com"
"tracker.example.invalid" = "the same gateway without its MCP subdomain; replaced by plane.example.net"
"/Users/example" = "the owner's real home directory; replaced by /Users/you"
"203.0.113.10" = "a real box's Tailscale address, replaced by another inside the same CGNAT /10 — the test it lives in asserts that a CGNAT origin is allowed and a public one is not, so a documentation address would have inverted it"
"example-topic-2" = "a client work-product filename"
# matches nothing is the correct state.
#
# This file is the register, so `residue-check` is the one gate that does not read it. Scanning
# it would make every entry cite itself as its own use — no entry could ever be stale — and would
# report every banned string as back in the tree the moment it was banned.
#
# Regenerate the allow-lists with `python3 tools/residue-check.py --update`; it keeps the reasons
# already written and leaves TODO against anything new, which is the line to stop and think about.
#
# **The sweep has landed.** Four entries here were once marked SWEEP — declared only so this gate
# was green about the tree *before* the SKEIN-520 rewrite was replayed. When it landed their last
# use went, the stale-entry rule turned this file red, and that is exactly what it was for.
#
# **This section is written after a rewrite, never before one, and that is not a style choice.**
# The strings below are the sweep's own inputs, so a replacement rule reaching this file turns the
# denylist into a list of the NEW names — banning the replacements and permitting the originals.
# It happened: an attempt that wrote them first came back with `dev-rhea`, `dev-vale`, `ladder` and
# `thing-tables` banned, each with a reason that no longer described its key.

# A host this tree reaches or names.
[hosts]
# Loopback and the sandbox's own escape hatch.
"127.0.0.1" = "the cockpit binds loopback; the address appears in every doc that says so"
"host.docker.internal" = "how a container reaches the sandbox host — the documented Docker name"
# GitHub and its neighbours: the code hosts skein actually speaks to, plus the ones its URL
# parser has to recognise in order to refuse or rewrite them.
"github.com" = "the code host skein reads and writes, and Cargo.lock's crate registry index"
"api.github.com" = "GitHub's REST/GraphQL endpoint — the base every API call is built on"
"raw.githubusercontent.com" = "where bootstrap.sh and the README fetch the installer from"
"cli.github.com" = "the `gh` install page, linked from the README's prerequisites"
"docs.github.com" = "GitHub's own docs, cited by docs/pr-workflow.md for stacked-PR behaviour"
"github.blog" = "cited once in docs/pr-workflow.md for a behaviour change GitHub announced"
"gitlab.com" = "not used — recognised, so a GitLab remote is parsed and then refused by name"
"bitbucket.org" = "same: recognised by the URL parser so the refusal can say which host it is"
"docs.docker.com" = "Docker's docs, cited where the sandbox's daemon configuration is explained"
"sh.rustup.rs" = "the rustup installer bootstrap.sh runs when a box has no toolchain"
"code.claude.com" = "Claude Code's own site, cited once in docs/TODO.md"
"www.w3.org" = "an SVG namespace URI in the page's markup, not a host anything reaches"
"www.jsdelivr.com" = "the CDN banner inside the vendored xterm bundles; not fetched at runtime"
# The tailnet. `*.ts.net` and the CGNAT range are the origin guard's whole trust boundary, so
# the guard's tests have to name concrete members and concrete non-members of both.
"box.my-tnet.ts.net" = "a made-up tailnet host, in the origin-guard test that must ACCEPT it"
"box.ts.net.evil.com" = "the look-alike the same test must REFUSE — it only contains ts.net"
"evil.com" = "the plain refusal case in that test"
"100.64.0.1" = "the bottom of Tailscale's CGNAT /10, which the guard accepts"
"100.64.0.30" = "an address inside that /10, in the same test — see the note in [banned]"
"100.128.0.1" = "just outside the /10, which the guard must refuse"
"192.168.1.10" = "an ordinary LAN address the guard must refuse"
"8.8.8.8" = "a public address the guard must refuse"
"proxy.local" = "a host set through SKEIN_ALLOWED_ORIGINS in that test, and accepted"
"nope.local" = "the host that is not on that allow-list, and refused"
# Single-label and obviously-synthetic hosts inside fixtures. A label with no dot cannot be
# anybody's domain, but it can be somebody's internal name, so each is still a decision.
"ci" = "a fake CI check URL in the pull-request fixtures — `https://ci/build/1`"
"status" = "a fake commit-status target URL in the same fixtures"
"host" = "the placeholder in the doc comment that shows the SSH-to-HTTPS URL rewrite"
"elsewhere" = "the off-origin script src in the comment explaining the page's CSP"
"e.com" = "the shortest URL that still has a host, used by the link-sanitiser tests"
"git.example.com" = "a synthetic remote in the cockpit's gitgate suite"
"gitlab.example.com" = "a synthetic GitLab remote, for the refusal path"
"plane.example.com" = "the work tracker's placeholder host, used in fleet.rs's tests"
"plane.example.net" = "a SECOND placeholder gateway, distinct from the one above: two tracking connections that must not read as one. RFC 2606 reserved, like every other host in this table."
"plane.host" = "a placeholder host in a tracking.rs test"
"plane" = "a single-label placeholder for the tracker in two page comments"
# SWEEP — the private work-tracker gateway. Delete these two when the sweep lands.

