[banned]
"dev-rhea" = "a collaborator's GitHub login, in five files of fixtures and docs"
"dev-sixth" = "a second collaborator's login, in two suites"
"dev-vale" = "a third; the camelCase form the identifier map's `acme` rule does not match"
"example-org-1" = "a component in the client's private repository, quoted in a pane capture"
"example-topic-11" = "the client's subject matter, in a branch name"
"example-topic-3" = "the same, in a pull-request title quoted by a mockup"
"example-topic-12" = "the same, in a branch name"
"example-topic-5" = "the same — `pls` is pleadings — in a branch name"
"example-topic-10" = "the same, in two branch names"
"example-box-8" = "the same, as a box name in a layout mockup"
"example-box-4" = "the client's subject matter, in a real box name used as a `valid_name` fixture"
"example-topic-7" = "the same, in a branch name"
"example-topic-16" = "the client's records vocabulary, in two branch names"
"example-topic-14" = "the same, in two branch names"
"example-topic-15" = "the same, in a branch name"
"example-topic-4" = "the same, in a branch name"
"example-topic-17" = "the client's document pipeline, in the branch that roots the deepest stack"
"example-topic-18" = "the client's storage vendor, in a branch name"
"example-topic-8" = "the client's product surface, in a branch name"
"example-topic-22" = "the same, in a branch name"
