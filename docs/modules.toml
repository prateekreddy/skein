[current.prwork]
# The half with consequences: `workflow` for what was decided, `github` to do it, `prq` for where a
# repo's state is kept, `warden_client` for the log skein does not own, `config` for the switch.
# Nothing depends on THIS except the tick and the routes — it is a leaf, so the thing that merges
# pull requests can never become something another module reaches into.
#
# `util` for one thing: `read_json_or_why`, which is what keeps "no stops recorded" apart from "the
# stop file will not parse" (SKEIN-359). It is the leaf every module already reaches for and it
# depends on nothing, so this edge cannot pull `prwork` toward the knot — and the alternative was a
# fourth private copy of the same six lines, which is how the three that already exist drift.
#
# `review` for `Act::Read`, and it is the one edge the reviewer half could not avoid. This module is
# where an act becomes a consequence, and the reviewer's first act IS a reading — so the choice was
# this edge or a second reading beside `review`'s, which is not a choice. Two things make it a
# narrower edge than it looks: `review` does not depend on `prwork` (no cycle, and the leaf rule
# above is about what depends on THIS, which is still only the tick and the routes), and the direction
# already existed as a path — `prwork` has been reading `review`'s cache since the reviewer facts
# landed, through a hand-copy of `cache_path` that `the_path_the_engine_reads_a_reading_from_is_the_one_review_writes_it_to`
# exists to stop drifting. That copy stays: the READ side is a path a test can pin, and the module
# note argues it is worth keeping the engine's fact lookup free of this module's weight.
depends_on = [
    "config",
    "github",
    # `owed` for `docs/pr-review.md` §8: what a repository owes a reviewer, what the diff fired,
    # and what has been answered at this commit. The intersection of those three lives in `owed`
    # and not here, because `facts_of_in` and `audit_now` both need it and two readers of one rule
    # is how the rule comes to have two answers.
    "owed",
    "prq",
    "repos",
    "review",
    # `secret` because every act here is performed WITH the owner's credential — a label, a merge, a
    # deleted branch — and `perform` takes it as an argument rather than reaching for it, so that the
    # credential a consequence happened under is visible at the call site. The type is what keeps
    # that argument honest: a `&str` threaded through eight functions is eight places it can be
    # printed.
    "secret",
    "util",
    "warden_client",
    "workflow",
]

# `util` for `update_json`: the audit record is a read-modify-write that decides whether
#   a verdict may be posted, and it was neither locked nor written atomically (audit F28).
[current.owed]
# What a repository owes a reviewer before a verdict — `docs/pr-review.md` §8.
#
# `config` for `skein_home`, where the answers are recorded, and nothing else. A leaf on purpose,
# and the purpose is the one `reviewbox`'s row was rewritten for: this is read by `review` and by
# `prwork`, and `review` is already inside the `{prq, review}` cycle — an edge from here to `prq`
# for `review_dir` would have put this module inside it too, for the sake of one path. So it keeps
# its own directory under `~/.skein/owed/` instead. The cheaper-looking edge was the one that would
# have cost the acyclicity.
#
# **No `contracts`, though it is the obvious neighbour.** Both scan a diff, and merging them would
# put a module that decides whether a VERDICT may go out inside one whose stated rule is that it
# "can only ever add scrutiny" and may therefore ship imperfect scanners. The rules are the same
# shape; what hangs off them is not.
depends_on = ["config",
    "util",
]

# `util` for `with_lock` + `write_atomic`: `workflows.json` is edited from the cockpit, and
#   was written with a bare `fs::write` + rename under no lock at all (audit F28).
[current.workflow]
# `config` for one thing: where skein's own home is, so the file can be found. Nothing else, and
# that is the point — this module is a vocabulary and a reader, and it is the one part of the
# workflow feature with no opinion about GitHub, no network, and nothing to act with. What decides
# is next door and what acts is beyond that, so the piece somebody has to trust with a merge is
# never the piece that also parses a file.
depends_on = ["config",
    "util",
]

[current.volume]
# `fleet` for two things now: is the sandbox up — because moving the volume out from under a running
# box leaves it reading a copy nobody writes to any more — and `create_line`, so the recipe below
# names the mounts this installation actually has rather than a guess at them.
#
# `operation` because moving the volume IS one (§2.4, SKEIN-574): the volume is bind-mounted at
# sandbox create and skein runs inside that sandbox, so the move ends the process performing it.
# `class: destructive` is what says nobody may drive it, and it is on the operation rather than at
# the call site so a new caller cannot acquire the permission by not knowing about it.
#
# `warden_client` for two renderers and nothing else: `Act::command`, so the `sbx` lines in the
# recipe are the ones the warden's own approval prompt prints, and `operation_id`, so asking twice
# about the same move names one operation rather than two. No request is made from here — this
# module reports and prints; a person runs it on the host.
depends_on = ["config", "fleet", "operation", "util", "warden_client"]

[current.operation]
