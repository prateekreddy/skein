# `deployment` and `gitgate` both left with the fleet-wide GitHub secret (architecture §13a). The
# seeding was host-side on both halves — `gh auth token` read the host's login, `sbx secret set -g`
# wrote the host's keyring — and the store it wrote to was the *machine's*, so two fleets on one host
# shared one token. `deployment` was the edge that refused it in-fleet and `gitgate` the one that
# skipped it for a fleet that can scope; with nothing to refuse or skip, both edges go. What is left
# is `gh_secret_seeded`, a read of a marker on the volume, which reaches neither.
#
# `gitgate` came BACK on this list with SKEIN-951, for the opposite reason to the one that took it
# off. What left was skein WRITING a fleet-wide secret; what returns is skein READING the credential
# a person already stored, for the two git runs this module makes outside every box — `clone_mirror`
# and `fetch_mirror`. Those had no credential wiring at all and nothing set `GIT_TERMINAL_PROMPT`,
# so a private remote with no usable token stopped a box start dead on
# `Username for 'https://github.com':`. `repos` asks `gitgate` three questions and mints nothing:
# `repo_slug` for the `owner/name` a stored token is filed under, `credential_for` to pick the token
# filed under THAT repository rather than the first in the file, and `read_pat` for the fleet-wide
# read-only fallback. No module joins a cycle over it — `repos` and `gitgate` are both already
# inside the eighteen-module component recorded at the top of this file.
#
# `fleet` for one question, SKEIN-943: would the fleet mount this store? `add_repo` asks
# `fleet::volume_exposure` — the very predicate `fleet_mounts` filters with — before it writes a
# store, so `skein add --store ~/.skein/thing` is refused while a person can still act on it instead
# of registering a repo whose boxes silently come up with no store. A copy of the rule in `repos`
# would have avoided the edge and reintroduced the defect, which was two rules drifting. `fleet` is
# already in the eighteen-module component with `repos`, so the knot does not grow.
depends_on = [
  "config",
  "fleet",
  "gitgate",
  "kit",
  "place",
  "registry",
  "runtime",
  "sbx",
  "tracking",
  "util",
]

