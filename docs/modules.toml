depends_on = ["fleet", "registry", "repos", "util"]

[current.moduledocs]
depends_on = ["ai", "codeowners", "prq", "repos", "review", "util"]

[current.place]
# `secret` left with the fleet agent's token (SKEIN-521): the `Secret` wrapper was here to keep that
# credential out of a log on its way to the transport, and there is no transport and no token.
depends_on = ["config", "util"]

[current.probes]
depends_on = ["kit", "registry", "repos", "runtime", "sandbox", "tracking", "util"]

[current.prq]
# `secret` because the host GitHub credential is one. It is resolved once per process and held in a
# static for the life of it, which is precisely the value that must not be a `String`: a
# `Mutex<Option<(GhToken, Option<String>)>>` is the fleet owner's token, in the clear, printable by
