# fix line would then name one box while the agent that got interrupted was another.
#
# `mailbox` because a box's own inbox is the one directory the launcher binds READ-ONLY into it
# (§9.5 R10), so a warning delivered there cannot have been forged by a box — which is the property
# that makes an interruption worth obeying. `config` and `util` for one file each: where the record
# of what was already said lives, and writing it atomically.
#
# **No `fleet` edge, and that is load-bearing rather than incidental.** The per-box figures come
# through `health::biggest_first`, which is behind `fleet_disk_usage`'s five-minute gate — the most
# expensive recurring thing skein does. A direct edge here would be an invitation to walk the tree
# again on a cadence this module chooses, and the announcement is worth nothing if it costs more
# than the disk it is warning about.
depends_on = ["config", "health", "mailbox", "util"]

[current.usage]
# `fleet` for `box_state_root` and `box_state`, and nothing else: where a box's transcripts are is
# the one fact about the fleet this module needs, and the one it must not restate for itself.
# `config` for `skein_home`, where the cached tally and its per-file digests are written.
# Deliberately NOT `transcript`, though the two read the same tree. That module reads the tail of
# the newest conversation for a person to look at; this one reads every byte of every file and
# returns counts. Sharing a walker would couple a deliberately two-level walk to a recursive one,
# and the recursion is the whole difference between counting a third of this fleet's spend and
# counting all of it — the `subagents/` transcripts sit one level below the conversation.
# `fleet` also for `fleet_home_dir`: skein's own calls in this process are filed under the fleet
# login home, not under any box (SKEIN-1074).
# `ai` for which of skein's own call sites a session was — the labelled id and the ledger the model
# call writes (`ai::site`). The label is decided where the call is made; this module only reads it.
depends_on = ["ai", "config", "fleet"]
