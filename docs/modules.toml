depends_on = ["config", "probes"]

[current.machine]
# `place` for which sandboxes have ever been placed in — what makes another skein's fleet
# recognisable as one, and where "which fleet is ours" is read from — and `sbx` for the listing.
# Nothing else: this answers a question about the MACHINE, and a module that also knew about boxes
