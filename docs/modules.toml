[current.update]
# Whether the skein you are running is the newest one, and the button that makes it so.
#
# `fleet` for the three things only it knows: where the source checkout is, what `SKEIN_SOURCE_URL`
# and `SKEIN_SOURCE_REF` resolve to, and `build_script_for_update` — which is `bootstrap.sh` itself
# rather than a second copy of it, so an upgrade cannot drift from an install. `github` for the one
# API call. `health` for `BUILD_REVISION`, the stamp `build.rs` puts in the binary. `config` for
# `skein_home`, where the log goes. Not `place`: which sandbox to build in is named by the caller,
# so this module never has to ask where it is.
#
# **No `prq`, and that is the point of the token being a parameter.** The credential belongs to
# whoever already has a policy about credentials — the server — and an `update` that fetched its own
# would be a module with an opinion about logins in order to read a public repository's HEAD.
#
# `secret` is the type that parameter now has. It changes nothing about the argument above and is
# the reason the argument stays true: a `String` parameter would be a credential this module could
# print without saying so.
depends_on = ["config", "fleet", "github", "health", "secret", "util"]

