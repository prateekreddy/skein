[current.tracking]
depends_on = ["config", "repos", "sandbox", "sbx", "util"]

[current.transcript]
depends_on = ["fleet", "place", "repos", "sandbox", "util"]

[current.volume]
# `fleet` for one question only — is the sandbox up — because moving the volume out from under a
# running box leaves it reading a copy nobody writes to any more. Nothing depends on this except
# the two binaries, so it cannot join the knot however it grows.
depends_on = ["config", "fleet", "util"]

[current.answer]
# `source` only. An answer carries two axes — which copy of the fact it is, and how it was reached —
# and the second is §2.3's type rather than a string this module invents. Nothing else: provenance
# that had to ask `config` or `fleet` anything would be provenance the subject could shape.
depends_on = ["source"]

[current.warden_client]
# §14 calls this `warden-client` and gives it `operation`. `util` for `sh_quote`, which is the
# hand-run line a person gets when the warden cannot be reached — nothing else, because a client that
# had to ask `config` or `fleet` anything would be a client the thing it is talking about could shape.
depends_on = ["util"]

[current.source]
# Nothing, and that is the rule rather than an accident: reaching a subject is precisely the thing
# that must not require privilege, so a Source that had to ask `config` where something lived would
# be a Source that could be denied. §14 says the same with an empty row.
depends_on = []

[current.signal]
# `source` and nothing else, which is exactly what §14's destination row says (`signal` depends on
# `source` and `state`; `state` does not exist yet). A signal declares which Source produced it, so
# it names §2.3's type rather than a string of its own. Nothing further: a budget that had to ask
# `config` how much it could spend would be a budget the thing being measured gets to set.
#
# Note the name — this is §14's `signal` module, which today holds the primitive's *declaration*
# (budgets, costs, cadence, sources). `signals` beside it is the current code that computes
# observations, and the two meet when that is rewritten against §14.
depends_on = ["source"]
