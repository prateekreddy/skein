# `health` because a failing check belongs in the SAME queue as the work: a fleet whose substrate
# will not install is not a quiet fleet, and putting that somewhere else is how a first run looks
# like nothing happening.
depends_on = ["board", "health", "prq", "repos"]

[current.registry]
depends_on = ["mailbox", "repos", "sbx", "util"]

[current.repos]
# `deployment` and `gitgate` both left with the fleet-wide GitHub secret (architecture §13a). The
# seeding was host-side on both halves — `gh auth token` read the host's login, `sbx secret set -g`
# wrote the host's keyring — and the store it wrote to was the *machine's*, so two fleets on one host
# shared one token. `deployment` was the edge that refused it in-fleet and `gitgate` the one that
# skipped it for a fleet that can scope; with nothing to refuse or skip, both edges go. What is left
# is `gh_secret_seeded`, a read of a marker on the volume, which reaches neither.
depends_on = ["config", "kit", "place", "registry", "runtime", "sbx", "tracking", "util"]

[current.review]
# `config` carries the review-model setting — which model reads and reviews PRs is the owner's
# choice, not a constant.
#
# `secret` for `acting_credential`, and for nothing else: a review is posted as the person, so the
# owner's token passes through this module on its way to `ai` and to `prq::submit_review_with_
# comments`. It passes through as a `Secret` so that "passes through" cannot become "was logged".
#
# `testutil` is no longer here. This checker cuts `#[cfg(test)] mod tests` before reading (see its
# own doc), so the edge it used to see was a reference OUTSIDE that module, and the drafted-review
# cut took it with everything else. The test module still uses `testutil::env_lock` 60 times, which
# is invisible to this graph by design — a test's reach says nothing about the design.
#
# `fleet` for ONE question, `model_runs_here`, and it is not a convenience. `stand_the_change_up`
# checks a commit out on skein's own filesystem, and on a host-driven fleet the model runs in the
# sandbox — so the checkout is unreachable and the prompt built from it ("go and read the tree, no
# diff below") describes code the model never opened. Whether the call stays in this process is
# `fleet`'s fact, and the alternative to this edge is `review` deciding it a second time, which is
# the same fact answered in two places and free to drift. Found live on `acme/thing#740`.
#
# `reviewbox` for where a reading RUNS — `docs/pr-review.md` §11. Every reading now happens in the
# pull request's own review box when one can be opened: a checkout of the commit under review, a
# private `$HOME`, a cgroup, and a conversation that survives a stop. The edge is one-way and must
# stay so — `reviewbox` is about a box's life and this module is about what happens inside it.
#
# `workflow` for one question, and it is `docs/pr-review.md` §7d: has this repo's engine undertaken
# to keep watching a pull request the LANE has released? The triggers are `workflow`'s vocabulary
# and there must not be a second copy of them here — a scope rule that disagreed with the engine's
# own triggers would be the §7d bug rebuilt one module along. Narrow and acyclic: `workflow`
# depends on `config` alone, deliberately, so this cannot pull anything toward the knot.
#
# `owed` for one call: which of §8's checks the DIFF fired. This is the only place the whole
# download is in hand — the engine next door has a `prq::Pr` and no bytes of the change — so the
# answer is computed here and recorded in the summary against the sha it came from. The edge is
# downward and narrow: `owed` depends on `config` alone, so it cannot pull anything toward the
# `{prq, review}` knot, which is the failure `reviewbox`'s row above records.
depends_on = ["ai", "codeowners", "config", "contracts", "fleet", "owed", "prq", "repos", "reviewbox", "secret", "util", "workflow"]

[current.reviewbox]
# The box skein opens to read one pull request — `docs/pr-review.md` §11. Deliberately a leaf, for
# `prwork`'s reason: this is the module that DESTROYS boxes, and nothing else should be able to
# reach into it. Its only caller is the server's housekeeping pass.
#
# `fleet` to start one and to build the script that stands it at a head; `sandbox` for `destroy_box`,
# which is where teardown lives; `place` for the placement records, which is where a box's purpose
# is written and the only honest way to tell a review box from a box that merely shares its shape;
# `repos` for the registry entry and the name.
#
# **`prq` is deliberately NOT here.** `pr_is_open` is the one question that may end a box, and
# reaching for it put this module inside the `{prq, review}` cycle — the gate said so. So
# `close_finished` takes the answer rather than the asker, and the server asks. The edge that was
# hard to justify was also the one making the function impossible to test.
#
# It does NOT depend on `review`, and must not: this module is about a box's life, and what runs
# inside it is the reading's business. The edge goes the other way — `review` reaches HERE to open a
# box and ask what is standing in it — so a dependency back would close a cycle around the one
# module that destroys boxes.
# `util` for `valid_name`, and it guards a recursive delete. `forget_the_conversation` removes
# `$SKEIN_HOME/boxes/<name>` when a review box is destroyed, and the path check below it is not
# enough on its own: `PathBuf::starts_with` is component-wise, so `<root>/..` starts with the
# root and would pass. The name has to be refused before it is ever joined to a path.
depends_on = ["fleet", "place", "repos", "sandbox", "util"]

