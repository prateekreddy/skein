# What each module may depend on. Read by `tools/module-check.py`, which fails the build on an edge
# that is not here.
#
# Two graphs, because the rewrite has two. `[destination.*]` is architecture.md §14 — the design,
# which nothing implements yet, checked only against itself. `[current.*]` is what `src/` has today,
# generated from the code and then reviewed, so that adding a dependency is a line in a diff rather
# than an import nobody looked at.
#
# The point of the allow-list is not that today's edges are right. Most of them are not: eighteen of
# the twenty-six modules are one mutually dependent knot, which is the condition §14 exists to end.
# The point is that the knot cannot quietly get bigger.

# ─────────────────────────── the destination: architecture.md §14 ───────────────────────────
#
# `owns` is abbreviated; the table in §14 is the text. What is load-bearing here is `depends_on`,
# because two of §14's rules are statements about it and nothing else:
#
#   - `state` and `source` depend on nothing.
#   - `source` never depends on `operation` — reaching a subject must never require privilege.
#
# Both are enforced by those rows being empty, and by the whole graph being acyclic.

[destination.state]
owns = "the volume: declared, requested, artifact, recorded — and the rule each carries"
depends_on = []

[destination.source]
owns = "enter, socket, file, http"
depends_on = []

[destination.signal]
owns = "kinds, freshness, budgets, cadence, gates, fusion"
depends_on = ["source", "state"]

[destination.operation]
owns = "desired, tri-state check, recipe, doer, DAG, leases"
depends_on = ["state", "signal"]

[destination.act]
owns = "streaming interactions; emits edges; reports outcomes"
depends_on = ["source", "signal", "state"]

[destination.warden-client]
owns = "protocol, operation ids"
depends_on = ["operation"]

[destination.warden]
owns = "the host service: capabilities, approval surface, outcome store, audit log"
# Deliberately empty, and not an oversight: the warden is a separate binary with no dependency on
# skein's modules. §14 says so in the row itself.
depends_on = []

[destination.box]
owns = "box identity and lifecycle"
depends_on = ["state", "operation", "act", "source", "signal"]

[destination.fleet]
owns = "fleet lifecycle — create, destroy, resize as their composition"
depends_on = ["operation", "warden-client", "state"]

[destination.grant]
owns = "who may do what, and with which credential"
depends_on = ["state", "source", "warden-client"]

[destination.mailbox]
owns = "cross-box and cross-project messaging, and its provenance"
depends_on = ["state"]

[destination.github]
owns = "HTTP client, review queue, CODEOWNERS, contract signals, summary cache and its throttle"
depends_on = ["state", "source"]

[destination.probes]
owns = "the in-box probe scripts and hook merging; the probe/binary compatibility contract"
depends_on = ["state", "source"]

[destination.api]
owns = "HTTP transport, auth, routes, the WebSocket"
# §14 used to write this row as "everything below", which is the only row of the table that could
# not be read mechanically: taken literally — the rows printed below it — it made `api` depend on
# `cli` and on `cockpit`, and `cockpit` already depends on `api`. Writing this list out is what
# forced the question, and §14 now names the modules instead.
depends_on = [
  "state", "source", "signal", "operation", "act", "warden-client",
  "box", "fleet", "grant", "mailbox", "github", "probes", "stream",
]

[destination.stream]
owns = "the single event producer and its fan-out, and transitions"
depends_on = ["signal", "state"]

[destination.cockpit]
owns = "the page, its build, and the component library"
depends_on = ["api"]  # over the wire only

[destination.migrate]
owns = "the one-shot: snapshot, carry, rewrite hooks, refuse"
depends_on = ["state", "operation", "box"]

[destination.cli]
owns = "skein"
depends_on = ["state", "operation", "act", "signal", "box", "fleet", "warden-client"]

# ──────────────────────────────── the cycles that exist today ────────────────────────────────
#
# Recorded, not tolerated. Each one needs a reason and something that ends it; the check fails when
# a module JOINS one, and fails when a recorded cycle is gone and this file still claims it.

[[cycle]]
modules = [
  "ai", "asks", "config", "diff", "digest", "fleet", "gitgate", "kit", "mailbox", "place", "probes",
  "registry", "repos", "runtime", "sandbox", "sbx", "signals", "substrate", "tracking",
]
why = """
Nineteen modules in one strongly connected component — two thirds of the crate. It is not a
mistake anyone made in one place: it is what a single 7,400-line crate root looked like once it was
split, and the mutual references were function calls inside one file until then. `kit` calls
`probes::ensure_probe_in` while `probes` calls `kit::ensure_store`; `registry` reads `repos` to find
a box's store while `repos` reads the registry to find its boxes.

This is the condition architecture.md §14 exists to end, and it ends by extraction into the
destination modules rather than by untangling these. Recorded here so it cannot silently grow.

The `place -> fleet` reference that used to be named here is gone (SKEIN-22), and the knot did not
change size — `place` is still in it through `config -> runtime -> repos -> place`. Worth knowing
before anyone spends a day on a single edge: in a component this dense, removing one is a local
tidy, not a structural change.

`asks` joined with SKEIN-1061, by one edge the other way from its own: `fleet -> asks`, so that
destroying a box removes its ask drop-box with its package and write drop-boxes (`fleet::disk`'s
`box_side_state`). It is in for the reason `substrate` and `gitgate` are: a queue a box writes is
removed with the box, and the one spelling of its path is the queue module's.
"""
item = "SKEIN-1"

[[cycle]]
modules = ["prq", "review"]
why = """
The review queue and the PR store call each other directly. Separable from the big knot and
separately fixable: both want one `github` module beneath them, which §14 gives them.

`moduledocs` was the third module here and has left (SKEIN-450). Its only tie was
`review::context`, which built a prompt out of a fresh diff download, the changed paths, the module
notes and the prior summary — for every question typed into the composer. Asking in the pull
request's own conversation makes all four unnecessary, because they are already in the session, so
`context` was deleted and the edge went with it. Worth recording as the shape this whole cut has:
the edge was not broken by rearranging modules, it disappeared when the work it existed for stopped
being work.
"""
item = "SKEIN-1"

# ─────────────────────────────────── today's allow-list ───────────────────────────────────
#
# `python3 tools/module-check.py --update` merges the code's edges into what is below, and that
# is how you accept a new edge; the diff is where somebody decides whether it should exist.
#
# **Every comment below this line is the point of the file, and --update keeps them.** Each note
# says why an edge is allowed, so the next one has to be argued rather than merely added. The flag
# used to rewrite this whole section from the parsed graph — 320 lines of that reasoning deleted,
# the order lost, and the six rows whose `depends_on` is empty deleted with them, since a module
# with no edges does not appear in a graph read off the code (SKEIN-614). It now rewrites nothing
# but the `depends_on` statements themselves. It will not remove an entry a person reviewed: it
# prints what it would remove and stops, and `--prune` is the second gesture that applies it.
#
# So a note left here outlives its edge only by somebody's choice, and that is deliberate — no
# tool can tell which sentence argued for which name, so no tool should be trusted to delete one.
# @CURRENT

[current.agentpath]
# `health` for the three-valued verdict every `doctor` line is written in — Satisfied, Unsatisfied
# with a way out, Unknown for a check that could not be made. A fourth vocabulary for one row would
# be a row a reader has to learn separately, and `HealthCheck::unsatisfied` is the constructor that
# makes a fault with no remedy impossible to write by accident.
#
# `place` for ONE string: `box_path`, the PATH a box actually runs on. That edge is the point of the
# module rather than a cost of it — a check that derived the box PATH itself would be a second copy
# of the thing it checks, which is SKEIN-678's shape, and the row would go on reporting healthy
# after the PATH moved underneath it.
#
# `util` for `sh_quote`, because the two scripts are composed from directory names read off a
# placement record rather than from literals.
#
# Nothing else, and deliberately no Source: the probe is an injected closure, so every branch —
# including the ones that report a fault — is drivable from a test with no sandbox anywhere. An
# unsatisfied verdict that could only be reached on a broken fleet is an unsatisfied verdict nobody
# can show failing on purpose.
depends_on = ["health", "place", "util"]

[current.ai]
# `fleet` for one thing: WHICH HOME a `claude` call reads its credential from. `claude` finds a login
# at `$HOME/.claude/.credentials.json` and nowhere else, and this module spawned it with no
# environment — so the call used whatever HOME the server was started with, while skein's own copy
# sat under `fleet-home` being reported as `logins: ["claude"]` and seeded into every box. A live
# fleet answered `Not logged in · Please run /login` for every summary with a working credential on
# disk. The edge is upward and worth it: the fleet's login is `fleet`'s to know about, and the
# alternative was a second place that knows where skein keeps credentials.
#
# `secret` because the GitHub credential a model call is given is a `Secret` the whole way: it is
# what `prq::host_token` hands `review`, `review` hands this module, and this module sets on the
# child's environment. Nothing here reads it — the edge exists so the value cannot have been a
# printable `String` at any point between the two.
depends_on = ["config", "fleet", "secret", "signals", "util"]

[current.apiauth]
# `secret` since the fleet's API token became a `Secret`: minting it, reading it and comparing a
# presented one against it are all that module's, so this one no longer spells `/dev/urandom`, a
# file mode or a constant-time loop of its own.
#
# `doorway` for SKEIN-962: `$SKEIN_NO_API_AUTH` is refused where the cockpit is the fleet's, and
# `doorway` is the module that knows that — from an environment variable the doorway sets at the
# exec and nothing else in the tree writes. The edge is deliberately to the module whose own note
# says `depends_on = []` so that "is this socket mine" cannot be answered by writing a file: the
# party this refusal is about can write files.
depends_on = ["config", "doorway", "secret"]

[current.act]
# `util` for the name guard, and nothing else. §14 gives `act` `source`, `signal` and `state`, none
# of which it needs yet: today an Act is a command line somebody else composed, run in the
# background, with its transcript kept so a surface that was not watching can still read it. The
# guard is deliberately `util::valid_name` — the same one box names use, because an act id is
# derived from the box it is about. And `signal`, for the names of the remembered answers an Act
# says it disturbs: §14 gives `act` exactly that edge, and it is what lets an Act make the
# declaration without knowing a gate exists.
depends_on = ["signal", "util"]

[current.assets]
# Nothing. It hands out bytes, and the one decision it makes — which directory, resolved once at
# startup — is read from the environment rather than asked of `config`, so that an asset root cannot
# be changed by anything that can change a config file mid-run.
depends_on = []

[current.attempt]
# `util` alone, for the locked read-modify-write the claim is. NOT `config`: asking it where the
# volume lives put this module straight into the eighteen-module knot, which `module-check` said out
# loud the moment it did — so the directory is a parameter and the caller knows where its own state
# goes. An attempt lease that had to ask another module anything is a lease that module cannot take.
depends_on = ["util"]

[current."bin/skein"]
# `ai` for `doctor`'s `model` line, and the edge is here rather than in `health` on purpose: that
# check SPAWNS the binary to find out whether it runs, and the health report is polled every fifteen
# seconds by every open board. A command a person types can afford a subprocess; a poll cannot. The
# line exists because the two switches came apart on a live fleet — `review_summaries` defaults on
# and `ai_enrichment` off, so the health field reported "ai off" while every summary was failing.
#
# `prwork` for one line of `doctor`: whether a repo has been configured into the self-approving
# loop (`docs/pr-review.md` §13). That question needs both switches — the reviewer's ceiling and
# whether any workflow merges — and only that module can see both. Reporting only, like
# `deployment` above: `doctor` reads it and changes nothing. Note `prwork`'s own module note calls
# it a leaf on the grounds that only the tick and the routes depend on it; the tick, the routes and
# now one diagnostic, which is the same kind of caller and not a second way in.
#
# `announce` for `skein announce`, which is the other half of `doctor` and deliberately not folded
# into it: `doctor` is the pull — a person asking how full the disk is — and `announce` is the push,
# which interrupts an agent. A diagnostic that also interrupts eleven agents is a diagnostic people
# stop running. `bin/skein-server` holds this edge too now (SKEIN-734) and is what drives the
# delivery unattended; the verb stays because it is the only way to drive it on a fleet whose server
# is not running, which is exactly the fleet somebody is debugging.
#
# `agentpath` for `doctor`'s `box agent` line — whether the first file named `claude` on a box's
# PATH is the agent. The edge is here and not in `health` for the same reason `ai` is: it SPAWNS,
# twice, and the health report is polled every fifteen seconds by every open board.
depends_on = ["agentpath", "ai", "announce", "apiauth", "board", "config", "fleet", "gitgate", "handoff", "health", "mailbox", "place", "prq", "prwork", "registry", "repos", "runtime", "sandbox", "sbx", "sharedhome", "takeover", "util", "volume"]

[current."bin/skein-server"]
# `dockerd` because this is the process that runs the Docker watchdog. `dockerd` is pid-1-parented
# in the sandbox with nothing supervising it, so a container that kills it costs a fleet rebuild;
# the watchdog used to live in the in-sandbox agent on the grounds that the agent was the long-lived
# in-sandbox process, and `skein-server` is that process now (SKEIN-573).
#
# `assets` since the cockpit gained one route for a directory of built files: the four vendored
# scripts stopped being four constants and four handlers, because a build step emits names that
# carry content hashes and neither the count nor the names are known at compile time. `act` since
# creating a box became something a surface that is not a terminal can ask for — it used to be a
# query string on the terminal WebSocket, so porting the REST API alone would have lost it.
# `knock` because the accept loop is the only place a cap can be pre-auth — everything else in this
# binary, `apiauth` included, has already accepted. It is one edge from the one file that holds a
# socket before anybody has said who they are.
# `doorway` beside it, and for the neighbouring reason: `knock` decides who may stay once they have
# arrived, `doorway` decides whether this process is entitled to be the thing they arrive at. Both
# are pre-auth and both are one edge from the only file that holds a socket.
# `prwork` and `workflow` because the row where somebody assigns a workflow, sees what it would do
# and lets a stopped one run again is served here. The DECIDING is not: this binary maps a request
# to `prwork::apply` and renders `prwork::standing`, and the moment it started doing more than that
# — it worked out for itself what an absent name meant — it grew a bug where clearing a stop also
# took the workflow off the pull request. Rules about what an assignment is belong in the module
# that owns the idea, where they are tested.
# `warden_client` because every other dependency this server needs is checked at boot — probes, the
# kit, the launcher, the gh token, the ssh key — and the warden was not, so a host without one heard
# about it from a 500 when somebody pressed Launch. It is one call at startup, to say so.
#
# `reviewbox` for one call, in the queue's housekeeping pass: the review boxes of pull requests that
# have closed are destroyed there, beside the readings of them. It is the only caller, which is the
# property that module's own note asks for.
#
# `announce` because a warning nothing sends is not a warning (SKEIN-734). That module decided who
# is told and how often, and every one of its tests passed while nothing called it at all — which is
# the failure it exists to fix, one level up. This is the process that turns, so this is where the
# tick lives: five minutes, because that is `fleet_disk_usage`'s own gate and asking faster would
# only re-read the same cached figure. It runs on a blocking thread rather than the runtime's,
# because behind the reading is a recursive stat of every file under the fleet root, and a stall
# there is a stall on every cockpit connection this process is holding.
#
# `usage` because `skein-server` is the only process that CAN take the reading, and the reason is an
# isolation property rather than a convenience (SKEIN-835). A box's transcripts are visible from
# inside that box and from the host state root, and from nowhere else: a running box mounts its own
# private home over `/boxes/<box>/home`, so no box can count another one's spend. This process runs
# outside every box's mount cover, which makes it the one place a fleet-wide figure exists at all.
# The edge is one route, `/api/usage`, and it is deliberately thin — the route chooses between the
# stored tally and a re-read and serves what it gets. Nothing about what a turn costs, what a model
# is priced at, or when a reading is stale is decided here; all of it is `usage`'s, where it is
# tested against a known-good oracle. Note also that this is an edge onto counts and never onto
# content: `UsageReport` has no field that can carry a message body, which is the property
# `only_counts_leave_the_transcript` exists to hold, and serving it over HTTP is exactly the
# occasion that property was written for.
#
# `resource_signal` for one spawn: the loop that writes each box's signal file once a minute, for
# the reason the disk announcement runs here rather than behind a cockpit connection (SKEIN-1054).
depends_on = ["act", "ai", "announce", "apiauth", "asks", "assets", "board", "cockpit", "config", "diff", "digest", "dockerd", "doorway", "files", "fleet", "gitgate", "handoff", "health", "kit", "knock", "machine", "mailbox", "moduledocs", "place", "probes", "prq", "prwork", "queue", "repos", "resource_signal", "review", "reviewbox", "runtime", "sandbox", "sbx", "shape", "stream", "substrate", "takeover", "tracking", "transcript", "update", "usage", "util", "volume", "warden_client", "workflow"]

[current.knock]
# Nothing. The doorstep hands out places and takes them back; it knows nothing about sockets,
# addresses or requests, which is what lets it be tested without one. Keeping this row empty is the
# claim — a pre-auth guard that had to reach for state would be a guard with something to exhaust.
depends_on = []

[current.dockerd]
# Nothing, and that is the claim rather than an accident. This module watches a daemon and reads the
# kernel's counters: `/proc`, `/sys/fs/cgroup`, and a spawn. An edge to `config` would mean whether
# the daemon gets brought back could be changed by writing a settings file, and an edge to `place`
# would mean the watchdog crossed into a box to do it — neither is a thing a supervisor of this
# machine's own daemon should be able to depend on.
depends_on = []

[current.doorway]
# Nothing, and for a stronger reason than `knock`'s: this module decides whether skein is entitled
# to be the cockpit at all, and it does it from two environment variables and a file descriptor.
# An edge to `config` would mean the answer to "is this socket mine" could be changed by writing a
# config file — which is the shape of the thing it exists to stop.
depends_on = []

[current.board]
depends_on = ["diff", "fleet", "gitgate", "place", "registry", "repos", "runtime", "sbx", "signals", "tracking", "util"]

[current.config]
depends_on = ["runtime", "util"]

[current.diff]
# `source` for one word: the diff is computed inside the box, and the answer says so by naming the
# reach that produced it. §2.2 requires a signal to carry that; §2.3 is where the word is defined.
depends_on = ["answer", "config", "registry", "sandbox", "sbx", "source", "util"]

[current.digest]
depends_on = ["diff", "registry", "repos", "sbx", "signals", "util"]

[current.files]
# `source` for the same reason as `diff`: a listing says whether it was read by entering the box or
# off the host's copy, and those are two different §2.3 reaches with two different failure modes.
depends_on = ["answer", "place", "sandbox", "sbx", "source", "util"]

[current.fleet]
# `dockerd` for one call: `pressure` reads the kernel's counters from that module instead of asking
# the in-sandbox agent over HTTP. The agent is deleted (§13a, SKEIN-521) and the counters are files
# in the sandbox this process runs in, so what was a transport is now a read.
#
# `warden_client` since delivery step 3: fleet create and the resize's destroy no longer run `sbx`
# here — they are asked of the host warden, which is the whole point of building it before skein
# moves inside (§8). One `sbx` spelling is left in this module: `ports`, which only a host needs.
#
# `operation` since SKEIN-576, for the cockpit's port. Skein no longer publishes it, so what used to
# be a publish loop is `publish_cockpit_port`, an Operation whose recipe a person runs. The warden
# has a `publish` doer since SKEIN-1130, performed only after the person types the operation id,
# and nothing drives this Operation, because a publish is a repair (SKEIN-1140): a server start asks
# the warden for it directly, once. The edge is what
# stops that being a bare `String` message: the tri-state check is why "I cannot see the host from
# here" does not read as "nothing forwards this port".
depends_on = [
  # `ai` for one call: `after_login` clears the model-refusal memory in the process that ran the
  # login (SKEIN-212). The tail used to live in the CLI, where clearing it fixed the wrong process —
  # the server kept declining model calls over a credential that had just been renewed. The
  # dependency is the fix: whoever completes a login is the one holding the memory that must forget.
  "ai",
  # `asks` for one path: the box's ask drop-box, removed with the box as the other two queues' are
  # (`disk::box_side_state`, SKEIN-1061).
  "asks",
  "attempt",
  "config",
  "dockerd",
  "gitgate",
  "kit",
  "operation",
  "place",
  # `probes` for one call: `install_launcher` writes skein's box plugin, and the plugin's turn-state
  # hooks are the probe's own wiring (SKEIN-1062). `probes::plugin_install` gives the bytes of both
  # plugin variants; `runtime` keeps only the directories, which the argv names. Asking `runtime`
  # for the bytes instead would make `runtime` depend on `probes`, which already depends on it.
  "probes",
  "repos",
  # `runtime` for one question, and only to REFUSE with: is this word a runtime skein has an adapter
  # for (SKEIN-405). The fleet-wide version check reads lines out of a script it ran in the sandbox,
  # and anything else on that stream parses just as cleanly — `npm ERR! code E404` becomes an offer
  # to update "npm ERR! code" to "E404" and puts it in the bar. Asked of the registry rather than
  # written down beside the parser, so a runtime added there is covered without anyone remembering
  # this. The dependency is one direction only: `runtime` knows nothing about fleets.
  "runtime",
  "sbx",
  # `secret` for the credential this module handles directly: the fleet's kept copy of an agent
  # login, which it saves out of a sandbox. The in-sandbox agent's own token was the other one, and
  # went with the agent (SKEIN-521).
  "secret",
  # `signal` for the NAMES of the remembered answers, which are part of what a signal is (§2.2's
  # cadence and its Gate contract). The gates themselves stay here. Split that way so an Act can
  # declare what it disturbs without depending on the module that owns them.
  "signal",
  "substrate",
  "util",
  "warden_client",
]

[current.gitgate]
# `warden_client` for the same reason as `sandbox`: a credential arriving at a box or being taken
# away from it is what §9.5 R6 exists to make permanent, and this is where that happens.
#
# `secret` because every credential in this module is one: the stored PATs, the App JWT, the
# installation tokens minted with it, and the per-repo token placed inside a box. The
# `Authorization: Bearer` document curl reads off stdin is built from a `Secret` and nothing else.
#
# `github` because this module no longer talks to GitHub itself. It had its own curl wrapper, which
# was a second client with a second set of answers: it never asked for an HTTP status (so a refusal
# carrying an `id` read as success, and a live token read as one that had lost its push rights), it
# spent the request body on argv, and it knew nothing of the rate-limit hold. One client, and this
# is the edge that says so.
#
# `mailbox` for one call: `send_answer`, which puts the owner's answer to a write request in the
# asking box's read-only inbox (SKEIN-1142). The box's own request file cannot carry the answer,
# because the box can write it; the inbox is the one place in a box that only the host writes.
depends_on = [
  "config",
  "fleet",
  "github",
  "mailbox",
  "place",
  "repos",
  "secret",
  "util",
  "warden_client",
]

[current.github]
# `secret` for one line: the `Authorization: Bearer` document curl reads off stdin is built from a
# `Secret` and from nothing else, so the header cannot be assembled out of a bare string.
depends_on = ["secret", "util"]

[current.handoff]
depends_on = ["diff", "digest", "registry", "repos", "runtime", "signals", "util"]

[current.health]
# `warden_client` because fleet create and destroy go only through the warden and there is no
# fallback, so a host that is not running one has lost two lifecycle operations — and until this
# edge existed, the first anybody heard of that was a 500 from pressing Launch. The edge is to the
# CLIENT and not the warden's crate, which this one deliberately does not depend on; what health
# reaches for is the reporting endpoint, the one that needs no compiled capability at all.
# `place` for one string: the fleet sandbox's NAME, which the full-disk fix puts inside the command
# it tells somebody to run (`sbx exec <sandbox> docker system prune -af`). A recipe that cannot be
# copied is half a recipe, and the alternative — health guessing the name, or printing a
# placeholder — is worse than the edge.
# `prq` for the credential deadline check (SKEIN-928). The question — when does each GitHub
# credential skein holds stop working — has to be asked of the credential that is actually in use,
# and `prq::credentials` is already the one place that resolves which of four sources that is
# ($GH_TOKEN, the read token, a stored write PAT, the host's `gh` login). The alternative was for
# `health` to resolve it a second time, which is the precise shape of SKEIN-547: two answers to one
# question, agreeing until the day they do not. What crosses the boundary is a reading, never a
# credential — `health` turns `prq::Life` into the sentence and the recipe, exactly as it already
# turns `gitgate`'s scope states into the `gitgate` line. The edge adds no cycle: nothing reachable
# from `prq` depends on `health`.
