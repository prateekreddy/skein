# Where each Source is spelled today, and HOW MANY TIMES. Read by `tools/source-check.py`,
# which fails the build on a reach from a unit that is not listed — and on a count that has moved,
# because a unit already on the list is where the next new reach hides (SKEIN-478).
#
# Merged from the code (`--update`) and then reviewed. The list is not an argument that today's
# spread is right — `enter` is spelled in several files and belongs in one. It is there so the
# spread cannot quietly get wider while the rewrite is under way.
#
# architecture.md §2.3 is the design; `src/source.rs` is the taxonomy, and its own test
# checks itself against §2.3.
#
# Two crates are read. `warden/…` units are the host service (§8), which is deliberately not
# part of skein — and is the one component whose reaches matter most, because it is the
# process that runs `sbx create` and `sbx rm`.
#
# **The numbers are the point, and they used to be missing.** This file recorded bare names, so it
# answered "may `fleet` spell `sbx` at all" — to which the answer was already yes — and a second,
# third or tenth reach in `fleet` was a clean run. Counting also makes the file's own prose
# checkable: the note under [sbx] said `fleet` spelled `sbx` three times for as long as it took two
# of the three to be deleted from the code, and nothing could tell.

[enter]
reaches = { place = 3 }

# `fleet`'s six `socket` reaches are `tmux -S`, all at sandbox scope and all to the cockpit's own
# session: four on `private/server.tmux` (one of them the `capture-pane` line handed to a person
# to type), and two on the pre-SKEIN-529 `.skein/server.tmux`, which
# `start_server` asks and `stop_server` kills so a fleet not yet re-bootstrapped can still be
# stopped and is not given a second supervisor (SKEIN-1025). Those two go when no fleet carries
# the old socket.
[socket]
reaches = { fleet = 6, place = 1, sandbox = 1 }

[file]
# Empty on purpose, and the emptiness is the claim: every module reads files, so `fs::read` is not
# what this law is about. What a file read may REACH is, and that is counted under the other rows.
reaches = {}

[http]
# `warden/serve` is the warden's own listener and `warden_client` is the near end: together they
# are §2.3's "http reaches GitHub, and the warden", and this is the pair that carries fleet create
# and destroy since delivery step 3. The warden listens on loopback and on each Docker bridge and
# never on `0.0.0.0` — §8.6 says why, and what it measured to correct the reasoning it used to
# give. The client's end is the one that moved with the deployment: in-fleet `127.0.0.1` is the
# sandbox, so it asks `host.docker.internal`.
#
# `doorway` is the odd one and worth saying so rather than letting the list imply otherwise: it
# spells `TcpStream` and reaches **nothing**. The type is used to ask a descriptor somebody handed
# in whether it has a peer — a listening socket has none, so an answer is the proof it is the wrong
# end of a connection. It opens nothing, connects nowhere, and the only thing it can do with the
# descriptor is refuse it. Listed because the checker matches the spelling, and a spelling exempted
# by hand is how the next real reach gets exempted with it.
#
# `fleet` spells `TcpStream::connect_timeout` in exactly one place (`cockpit_settled`): after the
# move's publish it connects to the host side of the cockpit's mapping to learn whether anything
# holds it, speaks no bytes, and drops the connection. Loopback only, and the answer decides only
# whether to burn a second candidate port. It was justified here as "sbx has no unpublish, so a
# mapping published on a wrong guess is permanent" — `sbx ports --help` takes `--unpublish`, so it
# is recoverable. Asking first is still worth a Source row: it is a TCP connect out of `fleet`, and
# what it decides is whether to make a host mapping, which is the privileged half.
#
# `place` was here for the in-sandbox agent, and left: the agent listens on a unix socket under
# `.skein/private/` rather than on `0.0.0.0:8317` (ISO-4), so what `place` speaks to it is a
# `socket` reach and no longer a network one. **It is back at 1 for a reach that was never
# counted, not a new one**: `place/crossing.rs` embeds `box-session.sh`, whose git shim runs
# `skein_reach_hint` when a git command that reaches GitHub fails — `curl --noproxy '*'` to
# api.github.com, bounded (`-m 5 --connect-timeout 3`), no credential, status discarded, so a
# blocked egress policy is named instead of read as a transient git error. `health` asks the same
# question from the server (`probe_github_reach_at`); the shim asks it inside the box, at the
# moment git failed, where no skein binary runs. The checker read Rust only until SKEIN-1201
# taught it the shell a unit embeds.
#
# `gitgate` left the same way, and for the better reason: it had a curl client of its own to mint
# App tokens, and it now asks `github` instead. Two units spelling the same reach were two sets of
# answers about the same boundary — one of them could not read an HTTP status and put its request
# body on argv — so the row leaving is a duplicate client leaving, not a reach being hidden.
#
# `health` is here for SKEIN-548: making the per-repo GitHub boundary real routes a scoped box's
# git/gh DIRECT (`NO_PROXY`), so a host egress policy that blocks GitHub now shows up as a failed
# connection rather than a silent proxy fallback. `github_reach_health` spawns `curl --noproxy` to
# `github.com` and turns the result into the `gh` doctor line — a bounded HEAD (`-m 5
# --connect-timeout 3`) that carries no credential and reads only the http_code, so it is a
# reachability probe, not a data reach. It is the web host, not the rate-limited REST API, and a
# test pins `$SKEIN_GITHUB_REACH_URL` at a listener rather than reaching out.
#
# **`health` is 2 from 1** for the other half of SKEIN-548, and the two are deliberately opposite
# reaches rather than one reach reused. `github_reach_health` above asks whether GitHub can be
# reached with the proxy taken OUT of the path (`--noproxy '*'`). `probe_proxy_injection_at`
# (SKEIN-927) asks what the proxy does when it is put back IN: it spawns `curl -x "$HTTPS_PROXY"
# --noproxy ''` to `api.github.com/rate_limit` carrying a credential that is marked as not being
# one — `skein-test-not-a-credential`, a constant, never a stored token — and reads back a status
# and `x-ratelimit-limit` with the body discarded to `/dev/null`. An acceptance on a ceiling above
# the anonymous one means the proxy answered as the account, and that is the red banner.
#
# It is a probe rather than a read of configuration on purpose, and this row is where that is
# written down: `sbx secret ls` describes what is stored, and three sbx issues on SKEIN-927 record
# the store and the proxy's behaviour disagreeing. It is bounded (`-m 8 --connect-timeout 4`),
# behind a one-hour `util::Gate` so an open cockpit does not turn it into a poll, it does not run
# from a test unless `$SKEIN_PROXY_PROBE_URL` pins it at a listener, and `/rate_limit` is chosen
# over `/user` because it spends nothing from the anonymous rate-limit pool every box shares.
#
# **`github` is 1 from 2** (SKEIN-1093). The second count was `have_curl`, which spawned
# `curl --version` only to learn whether curl was installed. Under load its five-second deadline
# ran out on an installed curl, so it answers from PATH now and spawns nothing. That is a probe
# leaving, not a reach being hidden: the one left is `call_reading_headers`, the client every
# GitHub request goes through.
#
# **`fleet` is 3 from 1, and `tracking` is 2 from nothing, with no new reach among them**
# (SKEIN-1201). The checker matched `Command::new("curl")` in Rust and nothing else, so curl run
# from a `sh -c` string or from a script a unit embeds was invisible. `fleet` embeds the same
# `box-session.sh` shim as `place` (`fleet/kit.rs`), and `bootstrap.sh` (`fleet/install.rs`),
# which fetches rustup's installer over https when the sandbox has no Rust toolchain. `tracking`
# mints and revokes a box's sync-gateway token with `curl -X POST` and `curl -X DELETE` under
# `sh -c`, the Plane token passed in the environment rather than on argv.
reaches = { doorway = 1, fleet = 3, github = 1, health = 2, place = 1, repos = 1, tracking = 2, "warden/serve" = 2, warden_client = 3 }

[sbx]
# The warden's two are the point of the whole component: `warden/doer` is where `sbx create` and
# `sbx rm -f` are spelled, and nothing reaches them without a human at the host approving the
# operation (§8.1). `warden/sightings` is the read-only listing (`sbx ls --json`), which decides
# nothing.
#
# The three skein units were invisible until the pattern was corrected: skein does not spawn `sbx`
# with `Command::new` — it goes through `run_capture_for` and friends — so the checker had been
# reporting `fleet` as reaching nothing while it spawned the fleet create and the resize's destroy.
#
# **`fleet` is down to one, and the count is how anyone can tell.** It went 5 → 2 when create and
# destroy moved behind the warden (delivery step 3), then to 3 without anything being written,
# because the pattern was widened to see past a line break (SKEIN-104). It is **1** now, and this
# note claimed 3 until SKEIN-478 made the number checkable. What left: `sbx ports … --publish` is
# no longer spawned by skein at all — `fleet::publish_cockpit_port` returns it as a recipe a person
# runs, and where it is performed it is the warden's `publish` doer that runs it, on the host, after
# the person types the operation id (`warden_client::Act::Publish`, SKEIN-1130) — and the interactive login
# lost its host arm with the deployment flag (SKEIN-576), so `login_argv` spawns `bash` and `sbx`
# is not in the sandbox to be run. What is left is the READ: `fleet::existing_forwards` runs
# `sbx ports <sandbox>` to learn which host ports already forward to one, and answers `None` rather
# than an empty list when it cannot run at all (§2.4's `unknown`).
#
# `sbx` — the module — came off this list with its `Command::new("sbx")` arm (SKEIN-1201). It was
# unreachable: `fleet_boxes` returned before it whenever `$SKEIN_LS_CMD` was unset, because in the
# fleet `sbx ls` asks about a host this process is not standing on. The listing it would have made
# is `warden/sightings`', from the host side.
#
# `health`'s one is not a reach at all: it is the check's own name in `checks()` — a label. Its
# second used to be `program_on_path("sbx")`, and SKEIN-576 deleted the question along with the
# answer: whether `sbx` is on `$PATH` decides nothing from inside the fleet, since `sbx ls` asks
# about the HOST's machine and this process is not standing on it.
#
# `bin/skein` came off this list with the deployment flag (SKEIN-576). Its one reach was `sbx` in
# the tool list `skein doctor` checks for, and that list dropped it wherever its absence was
# correct — which is now everywhere, so the entry went with the condition that made it conditional.
#
# `repos` came off this list with the fleet-wide GitHub secret (architecture §13a). Its reach was
# `sbx secret set -g github -t <token>`: the machine-global store, which is why two fleets on one
# host shared one credential — and a token on argv, which is the leak `github`'s `--config -`
# document exists to close. Nothing replaces it; a box that is not scoped now holds whatever a
# pre-deletion seeding left, and `repos::gh_secret_seeded` is the only trace.
#
# `bin/skein-server` came off this list when the crossing learned where skein runs (SKEIN-103). The
# cockpit's terminal used to spawn a literal `CommandBuilder::new("sbx")`; it now takes the program
# from the placement's own argv, which is the `nsenter` alone. A spawner that names the program
# cannot be told the crossing changed shape — which is how a terminal ends up attached to the wrong
# machine.
reaches = { fleet = 1, health = 1, "warden/doer" = 1, "warden/sightings" = 1 }
