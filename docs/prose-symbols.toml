INITIAL_SETUP_WAIT = "the agent launch's setup wait as it was NAMED when the three deadlines were last inverted. `src/fleet/start.rs:1774-1778` is the account of that inversion; the live reading is `setup_wait_secs()`, which the test beneath it calls."
draft_critique = "the second drafter, removed with its own prompt and its own diff download. `visit`'s doc says 'there used to be' and `docs/parity.md:153` records the cut — the argument for one reading needs the name of the two."
REV_SUM_AUTO = "the client-side summary budget, deleted from the page. The module note in `src/review/budget.rs` says 'The client used to keep this budget'; review-product-review.md is the record of the review that moved it to the server."
revSumAuto = "the page's counter for REV_SUM_AUTO, deleted with it. Same record, same reason."
revViewerOf = "the page reader for `Queue.viewer`. `docs/queue-fields.md` says it existed 'until the drafted-review surfaces went' — the field's entry has to be able to say what used to read it."
CLOSE_CHILD_ENDED = "the close code a box terminal carried when the child ended it (4001), renamed to `CLOSE_NOTHING_TO_RECONNECT` by SKEIN-702 — the SAME number, widened to cover a refusal, at which point \"the child ended\" was false: a refusal has no child and nothing ended. Named in the PAST TENSE by four rows and notes in `docs/recovery-survey.md`, which is a dated survey of what was wrong and must be able to say what the constant was called when it was measured; by the doc comments on the constant at both ends (`src/bin/skein-server/terminal.rs`, `src/web/app/board.js`), which record the rename and why it is the fix rather than tidying; and by `tests/ui/closecode.mjs`, whose header explains that what it measures did not move with the name."
ensure_fleet_agent_port = "gone with ISO-4: the agent moved from a TCP port inside the sandbox to a unix socket under `private/`, and a host cannot be given a mapping to a unix socket, so there is nothing left to publish. Named in the PAST TENSE by `docs/inventory.md:24`, a record of the false `sbx` claim that justified its port-burning dance. This reason used to also cite architecture.md's line 561, but that line has always been §7.3's resize sentence — it never named this symbol, not even when the citation ledger first recorded it (the SKEIN-858 shape; corrected under SKEIN-1041). `docs/inventory.md:257` is NOT past tense — it is an inventory row asserting the function exists, and it is a defect for SKEIN-523 to delete."
migrate_box = "the migration's own start path. `src/fleet/start.rs:748` says 'used to be the only caller' and the paragraph is the account of the bug that caused — see docs/prose-debt.toml for the note that the same sentence then slips into the present tense."
seed_shared_paths = "one of the two functions `kit` reached into `Repo` for, to read a LOCAL checkout. Gone with local-path repos: a repo is a remote now and no checkout is reachable from inside the fleet. `git grep` finds the name in exactly one line of this tree — `docs/modules.toml:469`, which is the record of why `kit` no longer depends on `repos` or `util` — and in no code at all: zero occurrences in `src/`, `tests/`, `tools/`, `cockpit/` and `warden/`, so not a call, not a definition, and not a mention in a comment either. A dependency table that explains a REMOVED edge has to be able to say what used to cross it. Its sibling is `record_repo_source`, named in the same sentence. Invisible to this gate until `docs/*.toml` became a prose source."
record_repo_source = "the other one, which recorded WHERE the checkout `seed_shared_paths` read had come from. Removed the same day and for the same reason, named in the PAST TENSE by that same sentence at `docs/modules.toml:469`, and equally absent by the same count. Both had already been reduced to warning that the files had not arrived before either was deleted, which is the fact the paragraph exists to record — so the sentence is about two functions that were vestigial and then gone, and it cannot make that point without their names."
read_diff = "the store-resolving reader of a box's diff as it stood on 2026-06-29, which is the day `docs/GENERALIZATION.md` was decided and dated. It was `pub fn read_diff(name: &str) -> Option<String>` in `src/lib.rs` and was deleted on 2026-08-03 by `c7f8bf06`, which stopped the host measuring a box's diff at all. The doc's line 39 is a list of the functions that then resolved the single store, and the surviving `read_diffstat_file` is not a rename of it — it reads the stat the BOX wrote, which is the thing `c7f8bf06` replaced it with. So the name cannot be corrected without making a dated record claim to have listed something that did not exist when it was written; same reading as the dated reviews in `docs/prose-debt.toml`'s citation note (SKEIN-600). Found by SKEIN-610: `read_diff` is a prefix of `read_diffstat_file`."

run_verify = "the click-triggered `cargo test` a box's row would show beside its other signals, part of a `Verify` feature added the same day `src/transcript.rs` was extracted (`refactor(core): extract tracking, diff, files, transcript and verify`) and deleted whole the very next day by `feat: remove Verify, and tell a box who it commits as` \u2014 the module, the chip, the dockbar button, the output modal, the per-repo check command and its global default, the routes and the docs. `src/transcript.rs`'s own section header outlived that deletion; SKEIN-563 rewrote it as history, and the sentence still has to be able to name what a tick, a hook and a schedule never called."

force_gh_secret = "the config field behind the cockpit's **Overwrite token on startup** switch, deleted with the fleet-wide GitHub secret (SKEIN-521, architecture \u00a713a). Its only job was passing `-f` to `sbx secret set -g`. Named in the PAST TENSE by `docs/parity.md` \u00a77, which is the record of what was removed and has to be able to say what the switch was called."
SKEIN_FORCE_GH_SECRET = "the environment spelling of `force_gh_secret`, deleted with it (SKEIN-521, architecture \u00a713a). Named in the PAST TENSE by `docs/parity.md` \u00a77 beside the field, for the same reason: it is the record of what was removed. Found when prose-check began reading a variable written with its `$` (SKEIN-648)."
SKEIN_SSH_KEY = "the variable that named a host key file for the cockpit's SSH key setting, deleted with the Settings field, the `ssh_key` setting and the path-probing route (SKEIN-947): a key on the host is a path the sandbox cannot read. Named in the PAST TENSE by `docs/parity.md` and `docs/threat-model.md`, each of which records the deletion and has to be able to say what went. Found by SKEIN-648."

ensure_gh_secret = "the fleet-wide GitHub seeding, deleted with the machine-global secret store (SKEIN-521, architecture \u00a713a). Named in the PAST TENSE by the regression test that forbids its return, `repos::tests::skein_no_longer_writes_a_secret_that_belongs_to_the_machine_rather_than_the_fleet`, whose doc has to be able to say what it is stopping from coming back."

exec_sbx = "the one `Place` call that deliberately bypassed the in-sandbox agent \u2014 restarting a stale agent cannot be sent through the connection it is about to kill. Deleted with the agent (SKEIN-573): with nothing to bypass it was identical to `Place::exec`. Named in the PAST TENSE by `docs/parity.md` \u00a77, which records what the deletion removed."
fleet_agent_port = "the setting that pinned the in-sandbox agent's host port, deleted with the agent (SKEIN-573). Named in the PAST TENSE by `docs/parity.md` \u00a77 beside `fleet_agent`, because a record of removed settings has to be able to name them."

has_critique = "the summary field that said a drafted review was waiting beside a reading, dropped when the session began posting its reviews to GitHub — `Known` is a `Summary` and a `stale` flag and neither names it (`src/review/summary.rs`). It became declarable only with SKEIN-612, which removed the page's last READ of it: until then `src/web/index.html` still tested `s.has_critique` against a field nothing sends, and a guard that can only fall through was satisfying this gate for four comments that describe the field in the PAST TENSE. Those four are the record of why the branch went and what the wire lost with it — including that no payload can now say a row HAS a review, which is a live question and not a settled one."

critique_because = "the summary field that recorded a reading whose REVIEW was bought and did not come back — the reason skein was given, verbatim. It was the last discriminator the page had for that state, and no server has sent it since the drafted review moved to GitHub: `Known` is a `Summary` and a `stale` flag and neither names it (`src/review/summary.rs`). SKEIN-660 deleted the branch that read it, so it is now named only in the PAST TENSE — by `src/review/summary.rs:295`, which says what `Known` used to assemble, and by the note in `src/web/index.html` that records what the deletion removed and what a stack can no longer say."

revNoReviewCameBack = "the page function that answered \u201cskein read this commit and the review did not come back\u201d, deleted by SKEIN-660 with the three surfaces it decided. Named in the PAST TENSE by the note left where it stood in `src/web/index.html`, which is the record of why the affordance went and of the SKEIN-371 complaint the page can no longer report; a deletion whose reason cannot be found comes back as a bug report."

# The cockpit suites' record of the drafted review, which skein no longer keeps (SKEIN-699). The
# ten below are page functions deleted together, by *refactor(review): the session posts its own
# review to GitHub, and skein stops keeping one*; every sentence naming them is written in the past
# tense to say what a section that is GONE used to drive. `tests/ui/lift.mjs` carries the argument for
# recording them at all: the cluster was lifted into one helper because "listing them by hand in
# each suite is how five of them broke at once the first time a function was added", and a note
# explaining a deletion has to be able to name what was deleted.
revDraftedReview = "the page's reading of a drafted review off the summary — it required `has_critique` AND `critique` and answered the review or null. Named in the PAST TENSE by `tests/ui/budget.mjs`, which records that the demotion tally counted 'review ready' with it while `Known::thin` had taken `critique` out of the queue payload, so no row could ever be demoted. Deleted with the chip that asked (SKEIN-313)."
revDraftHeld = "the drafted review a COLLAPSED row was told about but did not carry — `Known::drafted` or null. The head of the cluster `draftRules()` lifted, and named in the PAST TENSE by `tests/ui/lift.mjs`'s record of what went with it."
revDraftPosted = "the receipt that said skein had posted the held draft (SKEIN-364), read off `revDraftHeld`. Gone with it, and named in the PAST TENSE by the same note in `tests/ui/lift.mjs`."
revDraftEchoes = "the check for the viewer's own comment arriving after a draft was written — it compared GitHub's `createdAt` with `review::stamp_now`'s stamp as RFC3339 strings. Gone with the drafted review, and named in the PAST TENSE by `tests/ui/lift.mjs`."
revSentSince = "the same question asked of what skein itself had sent since a draft was written, off the summary's `sent` list. Gone with the drafted review, and named in the PAST TENSE by `tests/ui/lift.mjs`."
revDraftAtHead = "whether the held draft was written against the row's current head. Gone with the draft; named in the PAST TENSE by `tests/ui/lift.mjs`. Its surviving half of the question is `revDraftIsOlder`'s, which went the same day."
revDraftIsOlder = "the other half of that comparison — a draft written against a different head sha. Gone with the draft, and named in the PAST TENSE by `tests/ui/lift.mjs`."
revDraftedPostedOf = "the receipt for one drafted review, taken from the object when it carried one and from the row otherwise, because `Known::thin` split the review's prose off the row (SKEIN-287). Gone with the draft, and named in the PAST TENSE by `tests/ui/lift.mjs`."
revDraftVintageHtml = "the line a row drew about a draft's vintage — its sha, whether it was older than the head, and what had been echoed or sent since. It drew the other seven, which is why they were lifted together. Named in the PAST TENSE by `tests/ui/lift.mjs`."
revCritiquePost = "the post control of the keep/drop panel: it sent only the comments a reader had not ticked off. Named in the PAST TENSE by `tests/ui/review_return.mjs`, whose record of the two deleted sections has to be able to say that vetting-on-the-page was the whole of the property they proved. There is no panel now — the session posts its own review to GitHub and GitHub is where it is read."
# Two more from the same suites, each deleted on its own day and for its own reason.
revSettled = "the page's own copy of the hour a pull request had to be quiet before it was read — `pr.settled !== false`. The owner removed that rule on 2026-08-24 and the day's spend ceiling (`review::over_budget`) is the money guard now; the page held the copy after the server dropped it, where it could only ever refuse rows skein's background reader was already reading. Named in the PAST TENSE by `tests/ui/review_return.mjs`, which is the record of why the section went."
revStackRun = "the ONE global that held the stack read in progress, before `revStackRuns` made it a map keyed by stack (SKEIN-353). Named in the PAST TENSE by `tests/ui/stackread.mjs`, which is the account of the reported defect: a second press overwrote the global, `revStackPump` read it, and the first stack's queue never advanced again. A note explaining what a per-stack run bought has to be able to name the thing it replaced."

