pane_pid = "turn-state.md's probe table names the pid a probe would read under. The table is the design; O7 is not implemented."
observed_at = "a field of the signal shape architecture.md §2.2 designs (the table at :84). Nothing carries it yet — `src/signal.rs` is the taxonomy, and its `//!` at :35 is arguing about where the answering Source belongs in that same design."
