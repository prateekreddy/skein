"testutil::fake_github" = "proposed, not built, and by a doc that says it is proposing: `tests/common/mod.rs` argues that a second fake GitHub for the 25 hand-rolled stubs in `src/` 'would be the other half, and belongs in `src/testutil.rs`'. The name it would have is the subject of the sentence, so the sentence has to be able to say it. `fake_github` itself exists — in `tests/common/mod.rs`, which is the half the crate boundary allows — so this is a claim about the MODULE and only the module rule can see it."
