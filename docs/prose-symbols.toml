resolve_under_repo = "as `persistent_launch_command`: named in the record of what the per-VM retirement deleted."
remint_tracker_token = "as `persistent_launch_command`: named in the record of what the per-VM retirement deleted."
write_restore_launch_spec = "as `persistent_launch_command`: named in the record of what the per-VM retirement deleted."
SKEIN_KIT = "one of the `$SKEIN_REPO`/`$SKEIN_KIT`/`$SKEIN_STORE` triple the retired per-VM launch mode read. Same record as `persistent_launch_command`: self-sufficient.md quotes the old path in order to say what replaced it."
transcript_is_vm_local = "a parameter of the per-VM model, 'that only a migration ever set true'. `docs/TODO.md:925` lists it in the retirement record and `src/fleet.rs:15280` says in as many words that the flag is gone with the model."
INITIAL_SETUP_WAIT = "the agent launch's setup wait as it was NAMED when the three deadlines were last inverted. `src/fleet.rs:17681-17685` is the account of that inversion; the live reading is `setup_wait_secs()`, which the test beneath it calls."
draft_critique = "the second drafter, removed with its own prompt and its own diff download. `src/review.rs:1810` says 'there used to be' and `docs/parity.md:139` records the cut — the argument for one reading needs the name of the two."
REV_SUM_AUTO = "the client-side summary budget, deleted from the page. `src/review.rs:658` says 'the client used to keep this budget'; review-product-review.md is the record of the review that moved it to the server."
revSumAuto = "the page's counter for REV_SUM_AUTO, deleted with it. Same record, same reason."
revViewerOf = "the page reader for `Queue.viewer`. `docs/queue-fields.md` says it existed 'until the drafted-review surfaces went' — the field's entry has to be able to say what used to read it."
ensure_fleet_agent_port = "gone with ISO-4: the agent moved from a TCP port inside the sandbox to a unix socket under `private/`, and a host cannot be given a mapping to a unix socket, so there is nothing left to publish. Named in the PAST TENSE by `docs/TODO.md:276`, `docs/architecture.md:554` and `docs/inventory.md:24`, each a record of the false `sbx` claim that justified its port-burning dance. `docs/inventory.md:257` is NOT past tense — it is an inventory row asserting the function exists, and it is a defect for SKEIN-523 to delete."
migrate_box = "the migration's own start path. `src/fleet.rs:5467` says 'used to be the only caller' and the paragraph is the account of the bug that caused — see docs/prose-debt.toml for the note that the same sentence then slips into the present tense."
a_fleet_with_no_sandbox_holds_no_review_boxes = "a test written and deleted in the same increment. TODO.md records WHY — it went on passing with the guard it tested removed, because `config::load_config` substitutes a default fleet name and the state it described is unreachable. The account is worth nothing without the name."

