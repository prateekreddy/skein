# Symbols this project's prose names that the code does not have. Read by
# `tools/prose-check.py`, which fails the build on any other one.
#
# Three things belong here and nothing else:
#
#   * a name that is SOMEBODY ELSE'S — a kernel capability, a variable another tool sets.
#     The tree will never contain it and should not be made to.
#   * a name this tree discusses in the PAST TENSE, deliberately. A design record that
#     explains why a thing was removed has to be able to say what it was called, and a
#     record of a review has to be able to quote what the reviewer saw.
#   * a name for something NOT BUILT YET, in a document that is proposing it. Naming the
#     thing you intend to write is how a design is written; the gate must not push a
#     proposal into inventing a placeholder.
#
# Anything else is drift, and the point of the gate is that it stops rather than
# accumulating. `--update` writes the names; the reasons are written by a person.
#
# A reason that says nothing ("historical", "external") is worse than no entry: the next
# person cannot tell an exemption that was thought about from one that was pasted. Say which
# of the three it is and what it refers to.
#
# **This file is for names that are RIGHT to keep.** A name the code ought to have, or prose
# that ought to stop saying it, is a defect and belongs in `docs/prose-debt.toml`, which is a
# list that only shrinks. Putting a defect here would retire it by declaring it fixed.
#
# The list grew when the gate stopped being satisfied by comments (WTS-8): a symbol used to
# pass whenever any file mentioned it in a comment, and comments were not themselves checked,
# so every name below that is cited from `src/**/*.rs` was invisible until Phase 0.

# ---- somebody else's names ----------------------------------------------------------------
CAP_LINUX_IMMUTABLE = "a Linux kernel capability, cited by architecture.md where it explains what the warden must not hold. Never ours."
CAP_SYS_ADMIN = "a Linux kernel capability. `src/fleet/stop.rs:262` and `src/place/record.rs:108` name it to explain why a box can mount over its own view of /proc — the same class as CAP_LINUX_IMMUTABLE."
ANTHROPIC_BASE_URL = "Anthropic's own environment variable. `src/fleet/model.rs:215` names it to say skein deliberately does NOT set it; a variable named in order to be ruled out still has to be spelled right."
RUSTUP_HOME = "rustup's environment variable. `bootstrap.sh` and `src/fleet/install.rs` point it at the private toolchain, and the code comments have to be able to say which variable that is."
SSH_ASKPASS = "ssh's (and git's last-resort) askpass variable. `bootstrap.sh` unsets it, and its comment names it, because it is one of the three places git asks for a password before it looks at GIT_TERMINAL_PROMPT (SKEIN-1032). Never ours."
DOCKER_SANDBOXES_DOCKER_SIZE = "an sbx environment variable, the sibling of DOCKER_SANDBOXES_ROOT_SIZE. skein passes ROOT_SIZE (src/warden_client.rs:1168) and never sets this one; three comments name it to say the two disks are separate."
ARG_MAX = "the kernel's total argument-and-environment limit for `execve(2)`. `src/ai/call.rs` and `src/util.rs` name it in order to say what the constraint is NOT: the ceiling that broke a large review is `MAX_ARG_STRLEN`, the per-ELEMENT cap, which is 32 pages and independent of this much larger total. A name in a negative claim still has to be spelled right. Same class as MAX_IMSGSIZE."
MAX_IMSGSIZE = "OpenBSD's imsg framing limit, which is what sbx's control channel is built on. `src/fleet/server.rs:222` names it to explain why a long tmux command fails and a short one does not. Not ours to define."
SD_LISTEN_FDS_START = "systemd's socket-activation constant, spelled in its headers. `src/doorway.rs:53` uses the number and names the constant rather than taking a crate dependency for it."
SO_REUSEPORT = "a POSIX socket option. `src/doorway.rs:14` names it to bound what the separate uid does and does not protect."
TCP_NODELAY = "another POSIX socket option, set through `TcpStream::set_nodelay` rather than spelled. `docs/operating.md` and `src/bin/skein-server/main.rs` name the option because the property they are explaining — Nagle's algorithm coalescing single-keystroke packets — is a statement about TCP, not about the Rust method that switches it off. Same class as SO_REUSEPORT."
await_holding_lock = "a clippy lint, `clippy::await_holding_lock`. `src/bin/skein-server/review.rs:998` names the lint to explain what the code is avoiding. Lint names are the compiler's."
too_many_arguments = "a clippy lint, `clippy::too_many_arguments`. `Visit`'s doc names it to say what grouping six values into one struct bought. Same class as await_holding_lock. It was invisible to this gate until SKEIN-582: an `#[allow]` for it sat on the wrong item — inert, since the function beneath took seven arguments and the lint fires above seven — and while that attribute existed the code contained the name, so the comment passed for the wrong reason."
dismiss_stale_reviews = "GitHub's repository setting. `docs/pr-review.md:73` and `src/workflow/facts.rs:47` both name it to say the behaviour is the repo's configuration rather than a property of the word 'approved'."
expected_head_sha = "a field of GitHub's REST `PUT /pulls/{n}/update-branch` body. Named in `docs/pr-workflow.md` and `src/prwork/acts.rs:56` to say what REST offers and why skein uses GraphQL instead."
first_key_value = "`std::collections::BTreeMap::first_key_value`. `src/knock.rs:82` names it to say 'oldest' costs a lookup rather than a scan. The standard library is not ours."
try_send = "`tokio::sync::mpsc::Sender::try_send`, named in order to be RULED OUT. `src/bin/skein-server/terminal.rs` and `tests/ui/ptystall.mjs` both say what the terminal's input pump refuses to do with a full queue: dropping bytes on their way into a shell leaves half a command that still runs, and a notice afterwards does not unrun it — so the channel is unbounded instead (SKEIN-750). A name in a negative claim still has to be spelled right, same class as ANTHROPIC_BASE_URL and O_NOFOLLOW. tokio's API is not ours."
O_EXCL = "a flag of the kernel's `open(2)`, reached through `std::fs::OpenOptions::create_new` rather than spelled. `src/secret.rs` names it because the property the credential writer depends on — POSIX says an `O_CREAT | O_EXCL` open fails on a symbolic link — is stated about the flag, not about the Rust method."
O_NOFOLLOW = "another `open(2)` flag, and named in `src/secret.rs` in order to say why it is NOT used: the constant is per-ARCHITECTURE (`0o400000` on x86-64, `0o100000` on aarch64), so hand-writing it is a protection that is silently absent on half the machines skein runs on. A name in a negative claim still has to be spelled right."
O_LARGEFILE = "the `open(2)` flag whose value on aarch64 is `O_NOFOLLOW`'s value on x86-64. `src/secret.rs` names it to make that collision concrete rather than abstract."
F_GETPIPE_SZ = "an `fcntl(2)` command, Linux's own, and there is no Rust spelling of it to use instead. `src/place/run.rs` names it in the test that writes a body larger than the pipe, to say where the 262144 in that comment came from: the size was MEASURED with it rather than remembered as the stock kernel's 64 KiB, and the previous figure was wrong here by a factor of four (SKEIN-944). Same class as O_EXCL — a property stated about the kernel, not about a Rust method."
F_SETFL = "an `fcntl(2)` command, the kernel's. `src/doorway.rs` names it in `a_descriptor_that_cannot_be_a_door_is_refused_at_the_door` as the sabotage that test is written against: `F_SETFL` in place of `F_SETFD` in `close_on_exec` sets the status flags instead of the descriptor flags and clears `O_NONBLOCK` (SKEIN-1084). The tree never calls it, which is the point. Same class as F_GETPIPE_SZ."

