# Test scopes that touch process-global env vars without holding `env_lock()`.
#
# Read by `tools/env-lock-check.py`, which fails the build on an undeclared one AND on an entry here
# that no longer names a real site — a stale exemption is a permission nobody granted.
#
# **This list is not an argument that its entries are fine.** It is the same kind of list as
# `docs/sources.toml`: what the code does today, written down, so that the NEXT unlocked `set_var`
# is a line in a diff instead of an intermittent failure in a test that has nothing to do with it
# (SKEIN-307).
#
# **It is empty, and that is the point.** It was written with three entries, all three described in
# their own reasons as defects left declared only because the files belonged to other agents that
# round. When those files came free the three were fixed rather than kept:
#
#   * `src/bin/skein-server::origin_guard_honours_allowlist` — took the lock. Fixing it exposed a
#     larger fault: `env_lock` lived INSIDE `mod review_routes`, so it serialised that module
#     against itself and not against `mod tests` in the same binary. It is now at file scope and
#     both modules reach it through `super::`.
#   * `src/knock::the_grace_is_overridable_for_tests_and_sane_without_one` — took the lock. Its old
#     comment argued that being the only reader made it safe; that argument is now the reason
#     recorded against it, not a licence.
#   * `warden/src/doer::a_doer_without_an_approver_...` — took the crate's own lock. It mutates
#     `$PATH`, which decides what every spawn in the process resolves to.
#
# Keep the file. An empty allow-list that a gate reads is the thing that makes the next entry a
# decision somebody makes on purpose; deleting it would make the next unlocked write silent again.
#
# Each entry is `<unit>::<fn>`, where `<unit>` is the path with `.rs` dropped.
