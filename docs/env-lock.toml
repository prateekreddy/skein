# theory that cargo gives that file its own process. That theory is FALSE for this file: it is not
# a `tests/*.rs` binary at all, it is `tests/common/mod.rs`, a module reached only through a
# sibling's `mod common;` and compiled once into each of the ~29 integration binaries that declare
# it. `own_test_binary()` now excludes any `tests/` file with a further `/` in its unit name, so
# this scope falls through to the ordinary helper check — which answers "no #[test] in its module
# calls it", because `put`'s real callers (`EnvPins::set`/`unset`) are `#[test]`s in the ~29
# *other* files that pull this module in via `mod common;`, each its own Rust module and its own
# cargo binary, entirely outside the by-name, same-module radius `callers_of` searches.
#
# The real argument for why this is safe: `put` is the one write site in this file (its own doc
# comment says so, tests/common/mod.rs:994-1007), and it is reached only through
# `EnvPins::set`/`EnvPins::unset`, whose only constructor is `env_pins()` (tests/common/mod.rs:956)
# — so a caller cannot reach `put` without first calling `env_pins()`, which is itself in this
# checker's TOUCH pattern and puts THAT call under rule one in the caller's own binary. There is no
# path to `put` that skips the check; there is only a module boundary `callers_of` cannot see past.
[exempt."tests/common/mod::put"]
reason = "not actually its own test binary — tests/common/mod.rs is compiled into ~29 integration binaries via `mod common;`, so the old per-file waiver (before `own_test_binary`, SKEIN-722) was answering a question about a process this file does not have. `put` (tests/common/mod.rs:1008) is the sole env-touching write site here; its only callers are `EnvPins::set`/`EnvPins::unset`, reachable only by first calling `env_pins()` (tests/common/mod.rs:956), which is itself in this checker's TOUCH pattern — so every real caller is already being asked for the lock, in the *caller's* binary, where `callers_of`'s same-module radius cannot see it because that caller lives in a different tests/*.rs module entirely"

