[exempt."src/review/testkit::drafting_teardown_for"]
reason = "the teardown half of `drafting_fixture_for`, called at the end of the same seven locked #[test]s and from nowhere else; its `remove_var` runs while that test's guard is still bound, and the caller is in a sibling file for the same reason as the row above"

[exempt."src/review/testkit::two_repo_fixture"]
reason = "the same shape once more, with one caller: `src/review/scope.rs:1025 a_review_request_in_the_last_repo_is_read_before_a_stack_you_opened_in_the_first`, which binds `let _g = crate::testutil::env_lock();` as its first statement"

# `src/testutil` is where the lock and the pins themselves live, so the three rows below are the
# machinery this gate checks everything else against.
#
# **This key names TWO functions**, because the checker's key is `<unit>::<fn>` and `src/testutil.rs`
# has three `fn drop`s: `EnvGuard::drop` (:101) and `EnvPins::drop` (:197), which both touch the
# environment, and `TempDir`'s (:260), which does not. One row therefore exempts both env-touching
# ones and there is no way to say only one of them here. Both are argued below; the collision itself
# is a defect in the key, written down as SKEIN-896.
#
#   · `EnvGuard::drop` (:101) IS the lock. Its struct carries the `MutexGuard` as a field (:97), a
#     `Drop::drop` body runs before the value's fields are dropped, so the restore it performs runs
#     with every other writer in the crate still locked out. Exactly the argument already recorded
#     for `src/prq/fixtures::drop` above, one level lower down.
#   · `EnvPins::drop` (:197) puts back what `set`/`unset` pinned. It deliberately does not take the
#     lock — the doc comment on `EnvPins` (:167) says why: `Mutex` is not re-entrant, and a fixture
#     that pins reaching another that also pins would deadlock. The lock is the caller's, and the
#     caller is made to hold it mechanically rather than by convention: `env_pins` is in this gate's
#     TOUCH pattern, so every one of the 109 scopes that calls it is judged by rule one.
[exempt."src/testutil::drop"]
reason = "two functions under one key: `EnvGuard::drop` (src/testutil.rs:101) holds the crate lock as a field of the struct it belongs to, so its restore runs before that guard is released; `EnvPins::drop` (src/testutil.rs:197) must not take the lock — `Mutex` is not re-entrant and a pinning fixture reaching another would deadlock — and its callers are held to rule one instead, because `env_pins(` is in this checker's TOUCH pattern"

[exempt."src/testutil::unset"]
reason = "`EnvPins::unset` (src/testutil.rs:185) is one half of the pin API and cannot take the lock for the same non-reentrancy reason as `EnvPins::drop`; the only way to hold an `EnvPins` is `env_pins()` or `no_warden()` (the field is private and the struct is constructed at src/testutil.rs:169 and nowhere else), and `env_pins(` is in TOUCH, so every scope that reaches it is asked for the lock. Its sibling `EnvPins::set` is judged ok only by the accident that one #[test] in this same file calls it"

# `no_warden()` is NOT in the same position as the two rows above, and this reason says so rather
# than borrowing their argument. It hands back an `EnvPins` without the caller ever writing
# `env_pins()`, and `no_warden` is not in this gate's TOUCH pattern — so a test whose only write to
# the environment is `let _w = crate::testutil::no_warden();` pins $SKEIN_WARDEN process-globally
# and is never asked for the lock at all. Three of its 36 callers are in exactly that shape today:
#
#   src/gitgate.rs:2478 a_placed_token_is_never_readable_by_anyone_else
#   src/gitgate.rs:2516 forgetting_a_stored_token_takes_it_away_from_the_boxes_holding_it
#   src/gitgate.rs:2545 un_scoping_a_box_withdraws_what_it_was_already_holding
#
# Reproduce by adding `no_warden` to TOUCH in `tools/env-lock-check.py` and running `--show`: those
# three, and only those three, turn from invisible into "sets env vars and never takes `env_lock()`".
# Left declared rather than fixed only because `src/gitgate.rs` belongs to another lane this round —
# the same wording, and the same intent to come back, as the three entries this file's header
# describes having been fixed rather than kept. Written down as SKEIN-895, which retires this row.
[exempt."src/testutil::no_warden"]
reason = "pins $SKEIN_WARDEN at 127.0.0.1:1 through an `EnvPins` it returns, so the pin is undone by `Drop` at the caller and cannot take the lock itself without deadlocking a caller that already pins; the remaining defect is that `no_warden` is not in this gate's TOUCH pattern, so three #[test]s in src/gitgate.rs (2478, 2516, 2545) reach it holding no lock — a declared defect, not a licence"
