# The six below became visible on the day `tools/env-lock-check.py` learned that a file its parent
# declares `#[cfg(test)] mod X;` is test code (SKEIN-871). They were not new writes; they were
# writes in files the gate had never read. Each one is here because its callers are in ANOTHER
# FILE, which is the hole the checker's own docstring names — "resolution is by name within one
# file" — not because anybody decided a lock was optional.
#
# Every row below was checked against its real callers, one at a time, and the command that
# re-checks it is written into the row. A reason that cannot be re-run is a reason nobody can
# retire.
# ---------------------------------------------------------------------------------------------

