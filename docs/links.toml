# Paths the markdown names that this repository does not track, on purpose. Read by
# `tools/link-check.py`, which fails on any other link or backticked repo path that names nothing.
#
# Two things belong here and nothing else — the classes `docs/prose-symbols.toml` already uses:
#
#   * a path named in the PAST TENSE, deliberately: a file that was deleted or split into a
#     directory, named by a sentence about what happened to it or about what was measured in it
#     before it moved. Rewriting the name to today's path would make the record claim something
#     happened somewhere it did not.
#   * a path that is SOMEBODY ELSE'S: relative to where a file is installed rather than to where it
#     sits in this tree, or a path in another repository.
#
# A link a reader is meant to follow that names nothing is neither. It is a dead link, and the fix
# is the link. Entries are keyed by the file that names the path, so one document's past tense does
# not excuse the same path in another. An entry that excuses nothing any more fails the gate.

