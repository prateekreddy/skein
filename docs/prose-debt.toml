# The rule that survives is the one the row format already implied: a row here is work somebody
# will do. A claim whose subject is a different tree is not work, and belongs beside the claim.
#
# WHY THIS IS A LIST AND NOT A REPORTING MODE. A gate that only reports is a gate nobody reads,
# and the whole cost of this class was that nothing was red. Recording the sites makes the gate
