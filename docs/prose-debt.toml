# Prose debt: what the gates found on the day they were given their eyes.
#
# Read by `tools/prose-check.py`. Two lists, both of them **defects**, both recorded here only so
# that the gate can be green about the tree as it is today and red about anything added to it.
# Neither list may grow. Phase 5 (SKEIN-523) empties both, and the gate fails on an entry that no
# longer names a live finding — so the file cannot outlive the debt.
#
# This is the opposite of `docs/prose-symbols.toml`. That file holds names it is RIGHT to keep:
# somebody else's, deliberately past tense, or proposed and not yet built. Everything here is
# wrong and scheduled.
#
# Why a separate file: `prose-check.py --update` rewrites `prose-symbols.toml` from the tree,
# keeping only names and reasons. A list kept there would be deleted by the tool's own
# maintenance command, and nobody would find out until Phase 5 went looking for it.
#
# ---- stale-symbol -----------------------------------------------------------------------------
