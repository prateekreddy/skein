# TWENTY-FIVE OF THOSE FORTY-TWO WERE NEVER DEBT (SKEIN-600). Twenty-four were in
# `docs/review-product-review.md`, a product review of 23 August 2026, and they cite the code as it
# stood that day — which is what a review's evidence IS. They are gone from this list because that
