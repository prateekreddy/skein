# Prose debt: what the gates found on the day they were given their eyes.
#
# Read by `tools/prose-check.py`. Three lists, all of them **defects**, all recorded here only so
# that the gate can be green about the tree as it is today and red about anything added to it.
# No list may grow. Phase 5 (SKEIN-523) empties the first two; every row of the third names the
# work item that removes it. The gate fails on an entry that no longer names a live finding — so
# the file cannot outlive the debt.
#
# This is the opposite of `docs/prose-symbols.toml`. That file holds names it is RIGHT to keep:
# somebody else's, deliberately past tense, or proposed and not yet built. Everything here is
# wrong and scheduled.
#
# Why a separate file: `prose-check.py --update` rewrites `prose-symbols.toml` from the tree,
# keeping only names and reasons. A list kept there would be deleted by the tool's own
# maintenance command, and nobody would find out until Phase 5 went looking for it.
#
# ---- stale-symbol -----------------------------------------------------------------------------
#
# A name the prose presents as live that the code does not have. Each is recorded with its sites
# for the agent that owns the file, which is the only reason any of them is here rather than
# fixed. Where a successor is named it is a READING, not a fact: confirm it before renaming
# anything.
#
# The sites were all in `src/**` or `docs/*.md` when this list was written, because those were
# the files the Phase 0 agent could not edit. `tests/ui/` joined them when SKEIN-699 made the
# cockpit's suites a prose source.

# `run_verify` is repaid (SKEIN-563): the src/transcript.rs section it named is rewritten as
# history rather than a present-tense claim about deleted code, and the successor name is declared
# in docs/prose-symbols.toml under "named in the past tense, deliberately".
#
# `revReadLine` is repaid (SKEIN-720): the two comments in tests/ui/review.mjs that named it now
# name `revReadAgain`, the function they always meant.

# A QUALIFIED KEY is the module rule's row (SKEIN-695): the name is in the tree, and the module
# the prose puts it in has not got it — not as a definition, not as a re-export, not as a mention.
# Such a row is invisible to the rule above, because the leaf exists, which is the whole reason the
# module rule was written. **Both rows it found are repaid, and neither is a row here any more.**
# `board::foreign_views` went with SKEIN-697: the listing and the route beside it were renamed and
# re-subjected — a sandbox is reported as a sandbox now — so the document was corrected rather than
# re-pointed. `kit::ensure_fleet_kit` went with SKEIN-698 the other way round, because there the
# qualifier was the half that was wrong: the function is `fleet::ensure_fleet_kit` and `src/kit.rs`
# is a real module that has not got the name at all, so the prose was sending the reader to a file
# where there was nothing to find.

# WRITE `item` ON EVERY ROW YOU ADD HERE, even though nothing on this list enforces it yet. The
# citation list below has required one since it was written, for the reason it gives there: a
# deferred defect that names no work is not deferred, it is accepted. The row above predates the
# convention and is the only one without an id.
#
# Three rows lived here between SKEIN-610 and 2026-09-08 (SKEIN-639), the whole class SKEIN-610
# created when it stopped the symbol rule being satisfied by a FRAGMENT of a real name: each was a
# prefix of the function it meant, and each had passed a substring match for years. All three are
# fixed — `ensure_box` was `start_box_inner`, `ensure_probe` was `ensure_probe_all` at startup and
# `ensure_probe_in` per store, and `repo_launch_command` was `repo_launch_command_as`.
#
# Their `reason` fields named those successors as READINGS rather than facts, which is the habit
# worth copying: all three readings held when they were checked against the code, and the line
# numbers beside them had already drifted — `fetch_mirror` was cited at `src/fleet.rs:4828` and was
# at `:4742` by the time anyone followed it. Name the successor, and expect to re-derive its line.


# ---- stale-citation ---------------------------------------------------------------------------
#
# A `path.rs:123` citation naming a file that is not on disk, or a line past the end of one that
# is. Sixty-three of them existed on the day the citation rule was written (SKEIN-583) — a claim
# about the code that nothing had ever checked, in a repo whose first rule is "cite the file and
# line". Twenty-one were fixed in the commit that follows the rule, and forty-two were deferred
# here, every one of them in a file another agent held while that was written.
#
# TWENTY-FIVE OF THOSE FORTY-TWO WERE NEVER DEBT (SKEIN-600). Twenty-four were in a product
# review of 23 August 2026, and they cited the code as it stood that day — which is what a review's
# evidence IS. They left this list because that document declared the commit it cited, and
# `prose-check.py` followed them there; all twenty-four resolved. The twenty-fifth, in the UX review
# written the same day, resolved at no commit at all: it had been written INTO the document two
# weeks after it was composed, replacing a symbol the code no longer had with a line number, and it
# was fixed by naming a symbol again. Both reviews have since left the repository (SKEIN-512).
#
# The rule that survives is the one the row format already implied: a row here is work somebody
# will do. A claim whose subject is a different tree is not work, and belongs beside the claim.
#
# WHY THIS IS A LIST AND NOT A REPORTING MODE. A gate that only reports is a gate nobody reads,
# and the whole cost of this class was that nothing was red. Recording the sites makes the gate
# fail TODAY on the sixty-fourth — which is the thing worth having, since a day of module splits
# added about eighty at once.
#
# WHAT STOPS IT BECOMING PERMANENT. `item` is required, and `prose-check.py` fails on a row
# without one. A deferred defect that names no work is not deferred, it is accepted; requiring
# the id means somebody decided. `reason` is for the reader who finds the row and wonders why it
# was not simply fixed.
#
# Matching is on (file, text), never on `line`, for the reason the doc-attachment list gives
# below: a line number goes stale the moment anything above it moves, and the entire subject of
# this list is that line numbers go stale.
#
# `python3 tools/prose-check.py --update-citations` rewrites everything below @STALE-CITATION
# from the tree, with `item = "TODO-0"` on every row. Read the diff and write the ids: it will
# record a new defect as happily as it retires a fixed one.
#
# EMPTY SINCE 2026-09-08 (SKEIN-599), and empty by repair rather than by deletion. The last four
# rows all named `src/prq.rs`, a file Phase 6 split into `src/prq/`; each site now names the
# function instead of a line — `queue` and `counts` and `queues_are_cached` in `src/prq/refresh.rs`,
# and `build_pr` in `src/prq/node.rs`. The heading stays because the gate writes under it.
#
# EMPTY AGAIN SINCE 2026-09-23 (SKEIN-1107). Four rows lived here for a day: SKEIN-1103 split
# `src/bin/skein-server.rs` into `src/bin/skein-server/` while `src/place.rs` and the page sources
# were held by other lanes. Each site now names a symbol rather than a line — `terminal_session` in
# `src/bin/skein-server/terminal.rs`, `main` in `src/bin/skein-server/main.rs`, and `api_workflows`
# in `src/bin/skein-server/workflows.rs`.
#
# @STALE-CITATION

# ---- doc-attachment ---------------------------------------------------------------------------
#
# FLEET-1's class: a doc block whose item was moved or deleted, left glued to the block below it,
# so rustdoc attaches both to the item that follows and the first paragraph documents the wrong
# thing. `tools/prose-check.py` reports the line where the SECOND block starts — the first line
# rustdoc renders under a heading it does not belong to.
#
# Each entry carries the finding's own text, and matching is on (file, text) rather than on the
# line number: a line number goes stale the first time anything above it changes, and a gate that
# fails on unrelated edits is a gate that gets switched off. `line` is a hint for the reader and
# is not compared. A fix deletes the entry; a NEW site in a file that already has some is caught,
# because its text is not in the list.
#
# `python3 tools/prose-check.py --update-attachment` rewrites everything below @DOC-ATTACHMENT
# from the tree. Read the diff: it will record a new defect as normal just as happily as it will
# retire a fixed one.
#
# @DOC-ATTACHMENT

