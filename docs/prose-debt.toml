# Prose debt: what the gates found on the day they were given their eyes.
#
# Read by `tools/prose-check.py`. Two lists, both of them **defects**, both recorded here only so
# that the gate can be green about the tree as it is today and red about anything added to it.
# Neither list may grow. Phase 5 (SKEIN-523) empties both, and the gate fails on an entry that no
# longer names a live finding — so the file cannot outlive the debt.
#
# This is the opposite of `docs/prose-symbols.toml`. That file holds names it is RIGHT to keep:
# somebody else's, deliberately past tense, or proposed and not yet built. Everything here is
# wrong and scheduled.
#
# Why a separate file: `prose-check.py --update` rewrites `prose-symbols.toml` from the tree,
# keeping only names and reasons. A list kept there would be deleted by the tool's own
# maintenance command, and nobody would find out until Phase 5 went looking for it.
#
# ---- stale-symbol -----------------------------------------------------------------------------
#
# A name the prose presents as live that the code does not have. Every one lives in `src/**` or
# `docs/*.md` — neither of which the Phase 0 agent could edit — so each is recorded with its sites
# for the agent that owns the file. Where a successor is named it is a READING, not a fact:
# confirm it before renaming anything.

[stale-symbol.send_request]
sites = ["docs/TODO.md:1081", "docs/TODO.md:1094"]
reason = "no definition anywhere in the tree (`grep -rn 'fn send_request' src tests warden` → none), and all four sites discuss it in the present tense as the thing that writes the head and the body as two `write_all` calls. The WTS-8 exemplar: two comments kept the name alive, and the gate read them as the code having it."

[stale-symbol.run_verify]
sites = ["src/transcript.rs:302"]
reason = "a comment whose whole point is that nothing calls it — 'No tick, no turn-end hook, no schedule calls' it. There is no `verify` function in src/transcript.rs at all, so the comment is a claim about something that is not there to be uncalled."

[stale-symbol.note_critique_tried]
sites = ["src/web/index.html:7226"]
reason = "the page's comment cites it (`src/review.rs`) as the only writer of a field. No such function; the real writer has to be named before a reader can check the claim."


# ---- doc-attachment ---------------------------------------------------------------------------
#
# FLEET-1's class: a doc block whose item was moved or deleted, left glued to the block below it,
# so rustdoc attaches both to the item that follows and the first paragraph documents the wrong
# thing. `tools/prose-check.py` reports the line where the SECOND block starts — the first line
# rustdoc renders under a heading it does not belong to.
#
# Each entry carries the finding's own text, and matching is on (file, text) rather than on the
# line number: a line number goes stale the first time anything above it changes, and a gate that
# fails on unrelated edits is a gate that gets switched off. `line` is a hint for the reader and
# is not compared. A fix deletes the entry; a NEW site in a file that already has some is caught,
# because its text is not in the list.
#
# `python3 tools/prose-check.py --update-attachment` rewrites everything below @DOC-ATTACHMENT
# from the tree. Read the diff: it will record a new defect as normal just as happily as it will
# retire a fixed one.
#
# @DOC-ATTACHMENT

