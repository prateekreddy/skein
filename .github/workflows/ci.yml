name: ci

on:
  # Branches only. A `v*` tag is gated by `release.yml`, which calls this whole workflow through
  # `workflow_call` below and publishes nothing unless every job here passes on the tagged commit —
  # so a tag push runs these gates once, as the release's precondition, rather than twice.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `upstream/sync` is a submodule and two drift tests read it —
          # `the_shipped_skill_is_upstreams_verbatim` and
          # `the_always_on_block_names_every_tool_upstreams_own_rules_do`, both in `src/probes.rs`.
          # Named rather than cited by line: the line numbers written here were `1272,1304` and had
          # drifted to point at unrelated code, which is the one thing a comment like this must not
          # do. Without the submodule those two `return` through `crate::testutil::skip`, and
          # `cargo test` hides a passing test's output — a guard that quietly checks nothing, which
          # is what their own comment warns against.
          #
          # This line is no longer the only thing standing behind that: `submodule-check` runs as a
          # gate below and fails when the checkout is absent, so a fetch that silently stops
          # working is a named red step rather than two tests going quiet (SKEIN-826).
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # bubblewrap, so the isolation cover is exercised against a real namespace rather than skipped.
      # The test skips with a message where bwrap cannot make one, which keeps a constrained runner
      # green — and that is exactly the outcome this line exists to stop being the normal one.
      # tmux for the same reason: `tests/common/mod.rs`'s REQUIREMENTS lists it for `lib`,
      # `fleet_launch`, `fleet_move` and `server`, and whether the runner image carries it was
      # written down nowhere (SKEIN-1094). Installing it makes the question moot rather than
      # answered. `the_check_job_installs_every_package_the_coverage_job_does` in
      # `tests/platform_gates.rs` keeps this line from falling behind the coverage job's again.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      # Installing bubblewrap is NOT enough, and believing it was cost 27 days of red master.
      # `ubuntu-24.04` ships `kernel.apparmor_restrict_unprivileged_userns=1`, which refuses the
      # unprivileged user namespace bwrap needs. So bwrap installs, runs, and dies — and a guard
      # that asked "is bwrap on PATH" saw nothing wrong. SKEIN-549.
      # `|| true` deliberately: on a kernel without AppArmor the key does not exist, and
      # unprivileged namespaces are then already allowed — failing the job there would be a false
      # red. The next step is the real gate, and it cannot be fooled by this one succeeding.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # And prove it, here, before anything depends on it. This is the exact predicate every
      # isolation guard in the suite uses (`src/testutil.rs::bwrap_works` and its two siblings), so
      # a green step here means none of them can silently skip. Asserting it in the log instead
      # would not work: `cargo test` captures a PASSING test's output, and a skipped test passes —
      # the reason the skips were invisible in the first place.
      - run: bwrap --dev-bind / / -- /bin/true
      # **Every gate below is `tools/gates.sh run <name>`, and that indirection is the point.**
      #
      # The list of gates, and the command each one runs, used to exist twice: here, and in a
      # runner that lived in a session scratchpad, that every agent on this box was told to run,
      # and that was never checked in. They drifted in BOTH directions before anybody looked.
      # `tools/alone-check.py` was in that runner and in `CONTRIBUTING.md` and in no step here;
      # `tools/line-cite-check.py` was added here and to `CONTRIBUTING.md` and the local runner
      # never learned about it; and the two copies of the cockpit `node --test` line had come to
      # disagree about their own arguments. Running "the gates" locally and running "the gates"
      # here therefore checked different things, and neither said so.
      #
      # So a gate's command now lives in `tools/gates.sh` and nowhere else. What this file still
      # holds is the ORDER and the membership, because those are what a per-step run needs in order
      # to put a red X on the step that failed.
      #
      # **One step per gate rather than one step for the whole script, deliberately.** A single
      # step would collapse every gate's outcome into one name in the UI, and it would have to
      # reproduce this job's setup as well — installing bubblewrap, proving it actually runs,
      # fetching a browser, deepening the clone for the last step. None of that is a gate. Setup
      # belongs here; the list belongs there.
      #
      # And this first gate is what stops the membership drifting again: it fails when this file
      # and `CONTRIBUTING.md` stop naming the set `tools/gates.sh` defines, in either direction,
      # and it fails when a step here names a gate the list marks as deliberately not-for-CI.
      - run: tools/gates.sh run gate-list-check
      - run: tools/gates.sh run fmt
      # `--all` as well as `--all-targets`: the workspace's other crate is `warden/`, and a gate
      # that lints one of two crates says less than it appears to.
      - run: tools/gates.sh run clippy
      # Node BEFORE `cargo test`, because `cargo test` shells out to it: `cockpit::tests::
      # the_cockpit_bundle_is_not_stale` runs `node cockpit/build.mjs --check`, and the suites
      # listed in `tests/browser_suites.rs` run from there too. It passed only because `ubuntu-latest` preinstalls some
      # node — never the version pinned here, so the suites ran on a toolchain nothing declared.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # **The browser tier, which CI has never once run.**
      #
      # `tests/browser_suites.rs` runs the suites that need Playwright's chromium and skips them
      # with a printed reason when it is absent. That skip is right for somebody building skein —
      # a 150 MB download is not a reasonable build dependency — and it was wrong here: every green
      # run in this repository's history skipped `actfail, connections, onboarding, review, smoke,
      # updatepane`, the two largest included, so "a dead page cannot pass every other check" held
      # for the node tier only. The whole argument of that file is that a check nothing invokes is a
      # check that does not exist, and CI was the place it was not invoked (SKEIN-567).
      #
      # `npm install`, not `npm ci`: `tests/ui/package-lock.json` is gitignored (.gitignore:4), so
      # there is no lockfile here to install from.
      - run: npm install
        working-directory: tests/ui
      # Cached because the download is the entire cost — the browser is ~150 MB and the suites
      # themselves are about a minute. Keyed on `package.json`, which is what pins the playwright
      # version; a miss re-downloads, which is the same as today's every-run cost and no worse.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ui/package.json') }}
      # `--with-deps` installs chromium's system libraries too. On a runner that is the supported
      # path and it has the sudo to do it; inside a skein box it is not (see tests/ui/README.md,
      # where the libraries have to be asked for through the substrate instead). A cache hit still
      # runs this, and it is then a no-op for the browser and a fast apt check for the libraries.
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      # **The precondition of two tests in the gate below, asserted before them rather than skipped
      # inside them.** `upstream/sync` is a submodule and the two drift guards that read it return
      # early when it is not checked out — and a skipped test PASSES, which `cargo test` then hides.
      # That is not hypothetical: in this fleet the submodule was never initialised, so those two
      # guards proved nothing on every local run while `cargo test --lib` read 1051 passed / 0
      # failed. `$SKEIN_TESTS_NO_SKIP` found it; nothing made it go away (SKEIN-826).
      #
      # The `submodules: true` on this job's checkout is what makes this step green HERE. That is
      # the point of putting it here as well as locally: if that checkout ever stops fetching the
      # submodule, this says so in one named step, instead of two guards going quiet again.
      - run: tools/gates.sh run submodule-check
      # `--no-fail-fast`, because cargo stops at the first test BINARY that fails and there are
      # ~20 after this one. Master was pushed red at `d5d0e95` on a local run that stopped inside
      # `browser_suites` and never reached `parity_numbers`; CI, being fail-fast too, then found
      # that one and still did not reach `queue_field_readers`, which was also broken. One run that
      # reports everything beats two that each report the first thing.
      - run: tools/gates.sh run test
      # The module graph. Rust cannot express "this module may not depend on that one", so the rule
      # architecture.md §14 is built on has no compiler behind it — this is the compiler.
      - run: tools/gates.sh run module-check
      # The Source law (§2.3): nothing reaches anything except through a declared Source. Same
      # reason and same shape — a law nothing checks is a paragraph.
      - run: tools/gates.sh run source-check
      # Process-wide env vars in tests. `cargo test` runs a file's tests on many threads, so two
      # that set the same variable interleave and read each other's values — which fails as a
      # random red somewhere else, and has cost real time on this project more than once. The gate
      # finds a `set_var`/`remove_var` in a scope that does not hold `env_lock()`, resolving test
      # helpers transitively, with the deliberate exceptions declared in `docs/env-lock.toml`.
      - run: tools/gates.sh run env-lock-check
      - run: tools/gates.sh run fleet-pin-check
      # Symbols named in prose. CLAUDE.md rule 1 is "derive, do not assert", and nothing enforced
      # the prose half: a cut removes a function and the sentence describing it stays, indefinitely
      # and confidently. The review cut left nine such references, two of them in `docs/parity.md`
      # — the acceptance gate — while that same file's own route and page-function COUNTS kept
      # reproducing. Counting cannot see a sentence. Absences that are legitimate (somebody else's
      # name, a design record's past tense, a proposal for something unbuilt) are declared with
      # their reason in `docs/prose-symbols.toml`.
      #
      # The same gate checks the OTHER half of rule 1, the `file:line` citation. Sixty-three of
      # them named a file that is not on disk or a line past the end of one — three sampled at
      # random from one file were all wrong, one by about 530 lines, and nothing had ever looked.
      # It cannot tell you a citation points at the wrong line, only that the line is not there
      # to point at; the fix it recommends is a symbol name, which the check above already keeps
      # honest. Today's are deferred in `docs/prose-debt.toml`, each naming the item that ends it.
      - run: tools/gates.sh run prose-check
      # Whether the file a markdown link or a backticked repo path names is tracked at all — the
      # question the step above never asks. `[docs/live-check.md](docs/live-check.md)` on the root
      # page passed every doc gate the day that file left the repository (SKEIN-1157).
      - run: tools/gates.sh run link-check
      # The other half of that citation, and the half that actually goes wrong. `prose-check.py`
      # above asks only whether the line is INSIDE the file it names, and says so itself — "GREEN
      # HERE MEANS FOLLOWABLE, NEVER RIGHT". `docs/prose-symbols.toml` cited
      # `src/bin/skein-server.rs:5132` for `await_holding_lock`, which lives at 5296; that citation
      # was read by the step above and passed, because 5132 is inside the file. A number that is
      # looked at and cannot be judged is the shape SKEIN-647 warns about: a check that is trusted
      # and cannot fail.
      #
      # `docs/line-cites.toml` records what each cited line SAID when it was cited — read out of the
      # tree as it stood in the commit that wrote the citation, so seeding it could not bless a
      # citation that had already drifted. This step fails when a line no longer says it. Seventy-
      # five citations in `docs/` were wrong the day the ledger was written; one inserted line in
      # `src/fleet.rs` turns seventy of them red, and `--relocate --write` puts them back.
      #
      # It reads the working tree and the ledger only, so unlike `citation-check.py` at the end of
      # this file it needs no history and is unaffected by the shallow clone.
      - run: tools/gates.sh run line-cite-check
      # Prose inside a string literal, where a `\` line continuation used to be. rustfmt cannot
      # break a literal, so a long sentence is written across two lines with a trailing `\` — and a
      # heredoc that patches Rust source eats that `\` as its OWN line continuation, leaving the
      # continuation line's indentation inside the string. `skein doctor` then prints "branch and
      # <18 spaces> conversation" to the fleet's owner. Fifteen were in the tree when the gate was
      # written and two more were nearly added the same way (SKEIN-741, SKEIN-735). It is invisible
      # in a diff, which is why review had not caught one of them.
      - run: tools/gates.sh run continuation-check
      # Identifiers from before this repository was this repository. `CONTRIBUTING.md` has told
      # contributors to run this since it was written — twice, once in prose and once in the
      # pre-push list — and nothing ever did: the gate existed, passed, and was invoked by no
      # workflow, so the one check standing between a prior client's names and a public git
      # history ran only when somebody remembered.
      # It is also the gate whose failure is unfixable after the fact — a push cannot be unseen —
      # which is precisely the kind that must not depend on memory (SKEIN-492).
      - run: tools/gates.sh run residue-check
      # The cockpit's pure functions, in node. They live in `cockpit/src` because a function that
      # cannot be imported cannot be tested except by reimplementing it — and a reimplementation
      # agrees with the code right up until one of them changes.
      - run: tools/gates.sh run cockpit-tests
      # The binary embeds the built bundle and `cargo build` does not run node, so a bundle that has
      # gone stale is a cockpit quietly running last week's code.
      - run: tools/gates.sh run cockpit-bundle
      # A browser fixture belongs under one root, swept by the pid rule. The suites that built
      # theirs from `os.tmpdir()` instead were unreadable from inside the box they are for, and
      # carried no pid, so nothing ever swept them. This derives the suites rather than listing
      # them, and refuses when it derives none (SKEIN-653, SKEIN-700, SKEIN-717).
      - run: tools/gates.sh run fixture-root-check
      # **What that run skipped — reported, and now able to fail the build (SKEIN-558, SKEIN-881).**
      #
      # `common::skip` prints a notice and returns, and `cargo test` CAPTURES a passing test's
      # output — a skipped test passes — so the notice is invisible in exactly the run where it
      # matters. That is how eighteen silent skips survived here, and how SKEIN-549's two tests
      # died on this runner for 27 days while reading as fine. `$SKEIN_TESTS_NO_SKIP` inverts it:
      # every skip becomes a named panic (`tests/common/mod.rs`, `NO_SKIP`), and cargo cannot hide
      # a failing test's output.
      #
      # The mechanism itself is no longer the unverified half. `tests/harness.rs`'s
      # `a_skip_becomes_a_failure_when_the_run_asked_for_a_run_with_no_skips` proves both arms —
      # an ordinary early return without the variable, and with it a panic naming the guard and the
      # reason — and the `test` gate above runs it.
      #
      # **This step used to be non-blocking, and the argument for that had a hole in it.** It read:
      # a scoped no-skip run "needs a hand-kept list of what a runner image happens to provide,
      # sitting beside `common::REQUIREMENTS`, which is derived — and a hand-kept list of somebody
      # else's platform is exactly the thing that goes stale without saying so". True about a list,
      # and a list was never the only option. Whether THIS runner has tmux is not a fact anybody
      # writes down: it is a question you ask the machine you are standing on, at the moment you
      # need the answer. `tools/noskip-check.py` reads the requirements out of
      # `tests/common/mod.rs`, probes each one here, and fails the build for a skip inside a binary
      # whose every declared requirement this machine answers for — reporting, and nothing more,
      # about the rest. Both halves are derived and nothing about this image is written down.
      #
      # Why it had to stop being advisory: two `upstream/sync` drift guards skipped on every run
      # for as long as anyone had been running them. This switch DID find them and this summary DID
      # list them, and because the step could not fail they sat as expected failures until somebody
      # was sent to look (SKEIN-826). Two failures everyone has learned to expect is how a switch
      # stops being run at all.
      #
      # **AND IT MUST NOT REPORT AN ALL-CLEAR FROM A RUN THAT NEVER HAPPENED.** This step used to
      # decide between "these skipped" and "nothing skipped" on one question — does the log hold a
      # `SKIPPED at` line — which a log holds neither of when the build failed, when a gate refused,
      # or when `tools/gates.sh` exited 3 because HEAD moved under it. All three produce zero
      # matches, and the step was `set +e`, so the summary said "Nothing: every guard in the suite
      # found what it needed" about a run that had asked nothing and been told nothing. That is the
      # same defect one layer up from the one the switch exists for — a display reporting on
      # something other than what it names — and the fix is the same shape: require POSITIVE
      # evidence the run happened before reading anything into its silence. `^test result:` is that
      # evidence, one line per test binary, and the count is printed so a run that reported on three
      # binaries cannot be mistaken for one that reported on all of them (SKEIN-826). That rule now
      # lives in the tool, which also FAILS on that silence rather than printing Unknown into a
      # green step — except for the two `tools/gates.sh` exit codes documented as neither a pass nor
      # a failure.
      #
      # It still goes through `tools/gates.sh run test`, so this report does not become a second
      # place the test command is written down, and it still reuses the build the `test` gate made.
      - run: tools/gates.sh run noskip-check
      # Commit-sha citations in `docs/`. A history rewrite invalidates every one of them at once,
      # without touching a document — it has happened here already, and the rewrite over the
      # archive branches (SKEIN-652, SKEIN-605) is scoped and not yet run.
      #
      # THIS STEP IS LAST, AND THE ONE BEFORE IT IS WHY. `actions/checkout` clones at depth 1, and
      # on a depth-1 clone `git rev-list HEAD` names one commit — so every citation would be
      # reported unresolvable, for a reason indistinguishable from the failure this gate exists to
      # find. `tools/citation-check.py` refuses to run on a shallow clone rather than answer from
      # one. The clone is therefore deepened here, with `--filter=tree:0` fetching the COMMITS
      # only: 2.0 MiB of this repository's 1021 MiB, against 1018 MiB of blobs that nothing in
      # this gate reads. That leaves a partial clone behind, which is why this pair sits after
      # every other step rather than beside the checkout — nothing that follows can then be
      # slowed by a lazy object fetch. Measured over `file://` on a developer box: 6.4 s for the
      # fetch, 1.8 MiB added to `.git`, and 0.04 s for the gate itself.
      - run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --filter=tree:0 origin
          fi
      - run: tools/gates.sh run citation-check

  # **The declared MSRV, built at.** `rust-version` in `Cargo.toml` is a claim to every reader, and a
  # claim nothing re-checks goes stale the first time somebody uses an API newer than it: the job
  # above builds on `stable` only, where that is invisible. The version is READ from `Cargo.toml`
  # rather than written here too, so there is one copy of it and this job cannot test a different
  # number from the one the manifest declares.
  #
  # A build, not the gates: the gates' verdicts are about the code, and running them twice on two
  # compilers doubles the bill to learn one fact. What this job adds is whether the tree compiles —
  # every target, tests included, against the lockfile — on the oldest compiler it says it supports.
  #
  # Its command lives here and not in `tools/gates.sh`, which is an exception to that file's rule
  # (the `coverage` job below is the other) and is deliberate for now: a local run would need a
  # second toolchain installed to answer it, and `gates.sh` has no way yet to say "not answerable on
  # this machine" for a Rust version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Exactly one `rust-version = "x.y"` line, or the job fails naming what it found — an empty
      # read would otherwise hand `rust-toolchain` an empty toolchain and build on whatever that
      # defaults to, which is the silent-success shape this repository keeps paying for.
      - run: |
          found=$(grep -cE '^rust-version = "[0-9]+\.[0-9]+(\.[0-9]+)?"$' Cargo.toml || true)
          if [ "$found" != 1 ]; then
            echo "expected exactly one rust-version line in Cargo.toml, found $found" >&2
            exit 1
          fi
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          echo "MSRV from Cargo.toml: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
        id: msrv
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: rustc --version && cargo build --locked --all --all-targets

  # **Line coverage, held at a floor that only rises (SKEIN-508).** The floors live in
  # `docs/coverage-floor.toml`, one per language, each the measured number rounded DOWN; the
  # comparison, the refusal when nothing was measured, and the "it rose, raise the floor" notice are
  # all in `tools/coverage-check.py`. The owner's standard for it: "ratchet from measured, no
  # invented target".
  #
  # A job of its own rather than a gate in `tools/gates.sh`, for the reason the `msrv` job is: an
  # instrumented build of every target is a second full compile and a second full test run, and
  # putting it in the gate list would put that on every local run of the gates too. Its command is
  # a tool rather than a line here, so a contributor runs exactly this with
  # `python3 tools/coverage-check.py rust` — `gate-list-check` counts a tool a workflow step runs as
  # run, which is what lets this one live outside the list.
  #
  # **The setup repeats the `check` job's, deliberately, and adds `tmux`.** A number is only
  # comparable with the floor if it comes from the same suite the floor was measured on, and that
  # was a machine where every requirement in `tests/common/mod.rs` was present — bwrap able to make
  # a namespace, tmux, node, and Playwright's chromium. Leave one out here and its tests skip, the
  # number drops a point or two, and the job goes red about the runner rather than the change. The
  # reasons for each step are on the `check` job's copy of it above.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      # A prebuilt binary, installed by the action cargo-llvm-cov's own author publishes; building
      # it with `cargo install` would cost minutes on every run for the same executable.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: bwrap --dev-bind / / -- /bin/true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: tests/ui
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ui/package.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      # Cockpit first: it takes seconds, so a drop there is reported before the long Rust run —
      # and the Rust run still happens when the cockpit's fails, because one run that reports both
      # numbers beats two that each report the first.
      - run: python3 tools/coverage-check.py cockpit
        id: cockpit
      - run: python3 tools/coverage-check.py rust
        if: success() || steps.cockpit.outcome == 'failure'
