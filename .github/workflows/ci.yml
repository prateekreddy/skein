name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # bubblewrap, so the isolation cover is exercised against a real namespace rather than skipped.
      # The test skips with a message where bwrap cannot make one, which keeps a constrained runner
      # green — and that is exactly the outcome this line exists to stop being the normal one.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The module graph. Rust cannot express "this module may not depend on that one", so the rule
      # architecture.md §14 is built on has no compiler behind it — this is the compiler.
      - run: python3 tools/module-check.py
